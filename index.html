  // ------------------------------------------------------------------ actions
  function generate(force) {
    const start = $("#start") ? $("#start").value : ui.start;
    ui.error = ""; ui.confirm = null;
    if (!start) { ui.error = "Διάλεξε ημερομηνία."; render(); return; }
    ui.start = start;
    if (!force && !S.example) {
      const later = S.history.entries.filter(e => e.date >= start).map(e => e.date).sort();
      if (later.length) { ui.confirm = { from: later[0], to: later[later.length - 1] }; render(); return; }
    }
    ui.busy = true; render();
    setTimeout(() => {
      try {
        const r = E.generate({ people: S.people, rules: S.rules, services: S.services, notes: S.notes, history: S.example ? E.emptyHistory() : S.history,
          mode: S.mode, startIso: start, attempts: 20 });
        if (!S.example) S.history = r.history;
        S.view = E.makeView(r); ui.day = 0; ui.start = null;
        save();
        toast(r.res.unfilled ? `Έτοιμο, με ${r.res.unfilled} ακάλυπτες θέσεις` : "Έτοιμο το πρόγραμμα ✓");
      } catch (e) { ui.error = e.message; }
      ui.busy = false; render();
      const res = $("#h-res"); if (res && !ui.error) res.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 30);
  }

  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, v = el.dataset.v;
    if (act === "close-bg" && ev.target !== el) return;  // clicks inside the sheet
    switch (act) {
      case "mode": S.mode = v; ui.start = null; ui.confirm = null; save(); render(); break;
      case "generate": generate(false); break;
      case "gen-force": generate(true); break;
      case "gen-cancel": ui.confirm = null; render(); break;
      case "day": ui.day = +v; render(); break;
      case "dl-roster": if (S.view) offer(`Υπηρεσίες_${E.fmtDate(S.view.startIso).replace(/\//g, "-")}${S.view.days > 1 ? "_έως_" + E.fmtDate(S.view.endIso).replace(/\//g, "-") : ""}.xlsx`, X.rosterWorkbook(Object.assign({}, S.view, { formNotes: S.notes }), S.template ? b64.dec(S.template.b64) : null)); break;
      case "dl-history": offer("Άτομα.xlsx", X.historyWorkbook(S.history, S.people, S.rules, S.services)); break;
      case "tpl-upload":  // the user's own empty form decides the duties and the layout
        if (!window.ExcelJS) { toast("Δεν φόρτωσε το Excel (χρειάζεται ίντερνετ)."); break; }
        pickFile(async (buf, name) => {
          try { const res = await X.readTemplate(buf.slice(0), S.services); templateSheet(res, name || "πρότυπο.xlsx", buf); }
          catch (e) { toast("Δεν διαβάστηκε το πρότυπο: " + ((e && e.message) || e)); }
        });
        break;
      case "tpl-use": {
        const pt = ui.pendingTpl; if (!pt) break;
        S.services = pt.services; S.template = pt.template; S.newDefaults = false; S.view = null; ui.pendingTpl = null;
        save(); closeSheet(); render(); toast("Το πρότυπο μπήκε ✓"); break;
      }
      case "dl-names-template": offer("Ονόματα.xlsx", X.sampleNamesWorkbook(S.example || !S.people.length ? [{ name: "ΕΠΩΝΥΜΟ Ο", rank: "ΣΤΡ" }] : S.people)); break;
      case "import-names":
        if (!window.ExcelJS) { toast("Δεν φόρτωσε το Excel (χρειάζεται ίντερνετ)."); break; }
        pickFile(async buf => {
          try {
            const r = await X.readNames(buf);
            if (!r.people.length) throw new Error("Δεν βρέθηκαν ονόματα.");
            const keep = {}; r.people.forEach(p => { if (S.rules[p.name] && !S.example) keep[p.name] = S.rules[p.name]; });
            if (S.example) { S.history = E.emptyHistory(); S.view = null; }
            S.people = r.people; S.rules = Object.assign(keep, r.rules); S.example = false; ui.start = null;
            save(); toast(`Διαβάστηκαν ${r.people.length} ονόματα` + (Object.keys(r.rules).length ? ` και ${Object.keys(r.rules).length} εξαιρέσεις` : ""));
            location.hash = "#onomata"; render();
          } catch (e) { toast("Δεν διαβάστηκε: " + e.message); }
        });
        break;
      case "import-history":
        if (!window.ExcelJS) { toast("Δεν φόρτωσε το Excel (χρειάζεται ίντερνετ)."); break; }
        pickFile(async buf => {
          try { S.history = await X.readHistory(buf); S.view = null; ui.start = null; save(); toast(`Φορτώθηκαν ${S.history.entries.length} υπηρεσίες`); render(); }
          catch (e) { toast("Δεν διαβάστηκε: " + e.message); }
        });
        break;
      case "nf": ui.nf = v; render(); break;
      case "add-person": personSheet(null); break;
      case "edit-person": personSheet(v); break;
      case "save-person": {
        const e = readPersonForm();
        if (!e.name) { toast("Γράψε ονοματεπώνυμο."); break; }
        if (S.people.some(p => N(p.name) === N(e.name) && p.name !== e.orig)) { toast("Υπάρχει ήδη αυτό το όνομα."); break; }
        if (S.example) { S.example = false; S.history = E.emptyHistory(); S.view = null; }
        if (e.orig === null) S.people.push({ name: e.name, rank: e.rank });
        else { const p = S.people.find(x => x.name === e.orig); p.name = e.name; p.rank = e.rank; delete S.rules[e.orig]; }
        if (e.r.unarmed || e.r.no24h || e.r.shifts || e.r.tasks || e.r.days || e.r.leave || e.r.detached || e.r.note) S.rules[e.name] = e.r; else delete S.rules[e.name];
        save(); closeSheet(); render(); toast("Αποθηκεύτηκε ✓"); break;
      }
      case "add-range": {  // the two date pickers -> «20/11/2026-24/11/2026» added to the text field
        const f = $(`#p-${v}-from`).value, t = $(`#p-${v}-to`).value || f, box = $(`#p-${v}`);
        if (!f) { toast("Διάλεξε ημερομηνία «από»."); break; }
        const txt = `${E.fmtDate(f < t ? f : t)}-${E.fmtDate(f < t ? t : f)}`;
        box.value = box.value.trim() ? `${box.value.trim()}; ${txt}` : txt;
        updatePersonPreview(); break;
      }
      case "clear-person": delete S.rules[ui.edit.orig]; save(); closeSheet(); render(); toast("Χωρίς εξαιρέσεις"); break;
      case "del-person":
        if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Σίγουρα; Πάτα ξανά"; break; }
        S.people = S.people.filter(p => p.name !== ui.edit.orig); delete S.rules[ui.edit.orig];
        save(); closeSheet(); render(); toast("Διαγράφηκε"); break;
      case "suggest": suggestSheet(); break;
      case "dismiss-new": S.newDefaults = false; save(); render(); break;
      case "save-notes": S.notes = $("#notes").value.split("\n").map(t => t.trim()).filter(Boolean); save(); toast("Οι σημειώσεις αποθηκεύτηκαν ✓"); break;
      case "notes-default": $("#notes").value = E.DEFAULT_NOTES.join("\n"); break;
      case "sugg-missing": document.querySelectorAll("[data-sugg]:not([disabled])").forEach(x => { x.checked = true; }); break;
      case "sugg-add": {
        const chosen = [...document.querySelectorAll("[data-sugg]:checked")].map(x => clone(E.SUGGESTED[+x.dataset.sugg]));
        chosen.forEach(r => {
          const same = S.services.find(x => N(x.service) === N(r.service) && N(x.post) === N(r.post));
          if (same) { same.active = true; return; }  // already in the list as a suggestion: just turn it on
          r.active = true;
          let at = -1; S.services.forEach((x, i) => { if (r.section && x.section === r.section) at = i; });
          S.services.splice(at >= 0 ? at + 1 : S.services.length, 0, r);
        });
        save(); closeSheet(); render(); toast(`Ενεργές: ${chosen.length} ακόμα`); break;
      }
      case "edit-svc": svcSheet(v); break;
      case "who-mode": {
        readSvcForm(); ui.edit.who.mode = v; ui.sheetFocused = true; renderLayer(); break;
      }
      case "add-slot": {
        const x = readSvcForm(), a = ui.edit.from, b = ui.edit.to;
        const cur = /\d{1,2}[:.]\d{2}\s*-/.test(x.times) ? x.times : "";
        $("#s-times").value = cur ? `${cur}, ${a}-${b}` : `${a}-${b}`;
        ui.edit.from = b; $("#s-from").value = b; updateSvcCheck(); break;
      }
      case "clear-slot": $("#s-times").value = ""; updateSvcCheck(); break;
      case "save-svc": {
        const x = readSvcForm();
        if (!x.service) { toast("Γράψε τίτλο υπηρεσίας."); break; }
        if (!x.link && !/ΕΒΔΟΜΑΔ|WEEK/.test(N(x.times))) { try { E.parseTimes(x.times); } catch (e) { toast("Διόρθωσε το ωράριο."); break; } }
        if (ui.edit.index === "new") S.services.push(x); else S.services[+ui.edit.index] = x;
        save(); closeSheet(); render(); toast("Αποθηκεύτηκε ✓"); break;
      }
      case "del-svc":
        if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "Σίγουρα; Πάτα ξανά"; break; }
        S.services.splice(+ui.edit.index, 1); save(); closeSheet(); render(); toast("Διαγράφηκε"); break;
      case "svc-toggle": {
        const x = S.services[+v]; if (!x) break;
        x.active = x.active === false;
        // rows that say «ίδιος με …» this duty follow it
        if (!x.link) S.services.forEach(y => { if (y.link && N(y.link).includes(N(x.post || x.service))) y.active = x.active; });
        save(); render(); break;
      }
      case "svc-up": case "svc-down": {
        const i = +v, j = act === "svc-up" ? i - 1 : i + 1;
        if (j < 0 || j >= S.services.length) break;
        [S.services[i], S.services[j]] = [S.services[j], S.services[i]]; save(); render(); break;
      }
      case "hist-open": ui.open = ui.open === v ? null : v; render(); break;
      case "ask": askSheet(v); break;
      case "ask-yes": ASKS[v][2](); save(); closeSheet(); render(); toast("Έγινε"); break;
      case "save-file": saveLocal(false); break;
      case "share-file": saveLocal(true); break;
      case "close": case "close-bg": closeSheet(); break;
    }
  });
  document.addEventListener("input", ev => {
    const id = ev.target.id;
    if (id === "who-q") {  // filter the names list in the duty editor without redrawing it
      const q = N(ev.target.value);
      document.querySelectorAll("[data-name]").forEach(l => { l.hidden = !!q && !l.dataset.name.includes(q); });
      document.querySelectorAll("[data-grp]").forEach(g => { g.hidden = !!q; });
      return;
    }
    if (id === "q") { ui.q = ev.target.value; rerenderKeepFocus(id); }
    else if (id === "nq") { ui.nq = ev.target.value; rerenderKeepFocus(id); }
    else if (id === "hq") { ui.hq = ev.target.value; rerenderKeepFocus(id); }
    else if (id === "start") { ui.start = ev.target.value; ui.confirm = null; }
    else if (ev.target.closest(".sheetbox")) {
      if ($("#p-preview")) updatePersonPreview();
      if ($("#s-check")) {
        if (id === "s-service") {  // a suggested title fills the rest of an empty form
          const sug = E.SUGGESTED.find(r => N(r.service) === N(ev.target.value));
          if (sug && !$("#s-times").value) {
            $("#s-times").value = sug.link ? "" : sug.times; $("#s-needed").value = sug.needed; $("#s-rank").value = sug.rank;
            $("#s-armed").checked = sug.armed; $("#s-section").value = sug.section; $("#s-col").value = String(sug.col);
            if (!$("#s-post").value) $("#s-post").value = sug.post;
            if (sug.link) $("#s-link").value = sug.link;
          }
        }
        updateSvcCheck();
      }
    }
  });
  document.addEventListener("change", ev => {
    if (ev.target.dataset && ev.target.dataset.who !== undefined && ui.edit && ui.edit.who) {
      const w = ui.edit.who, key = N(ev.target.dataset.who);
      const lim = w.mode === "fixed" ? Math.max(1, parseInt($("#s-needed").value, 10) || 1) : 0;
      if (ev.target.checked) {
        if (lim === 1) { w.sel.clear(); document.querySelectorAll("[data-who]").forEach(c => { if (c !== ev.target) c.checked = false; }); }
        else if (lim && w.sel.size >= lim) { ev.target.checked = false; toast(`Έως ${lim} σταθερά άτομα (όσα τα άτομα της υπηρεσίας).`); return; }
        w.sel.add(key);
      } else w.sel.delete(key);
      const n = $("#who-n"); if (n) n.textContent = `Επιλεγμένοι: ${w.sel.size}${lim ? " / " + lim : ""}`;
      return;
    }
    if (ev.target.id === "s-preset" && ev.target.value) { $("#s-times").value = ev.target.value; ev.target.value = ""; updateSvcCheck(); }
    else if (ev.target.closest && ev.target.closest(".sheetbox")) { if ($("#p-preview")) updatePersonPreview(); if ($("#s-check")) updateSvcCheck(); }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.sheet) closeSheet(); });
  function rerenderKeepFocus(id) {
    const el = $("#" + id), pos = el ? el.selectionStart : null;
    render();
    const n = $("#" + id);
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* type=search */ } }
  }

  route();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  // a new version takes over by itself: check when the app comes back to the screen, reload once it is in
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {}));
}
</script>
</body>
</html>
