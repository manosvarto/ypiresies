    for (let r = 1; r <= Math.min(ws.rowCount, 40) && !blocks.length; r++) {
      const cells = [];
      ws.getRow(r).eachCell({ includeEmpty: false }, (cell, c) => { if (!cell.isMerged || cell.master === cell) cells.push([c, norm(ctext(cell))]); });
      for (const [nc, t] of cells) {
        if (t !== "ΟΝΟΜΑΤΕΠΩΝΥΜΟ" && t !== "ΟΝΟΜΑ") continue;
        const left = cells.filter(([c]) => c < nc && (!blocks.length || c > blocks[blocks.length - 1].nc)).sort((a, b) => b[0] - a[0]);
        const hr = left.find(([, x]) => x === "ΩΡΑΡΙΟ"), rk = left.find(([, x]) => x === "ΒΑΘΜΟΣ");
        if (!hr) continue;
        const prevEnd = blocks.length ? blocks[blocks.length - 1].nc : 0;
        blocks.push({ head: r, lc: Math.max(prevEnd + 1, hr[0] - 1), hc: hr[0], rc: rk ? rk[0] : null, nc, col: blocks.length + 1 });
      }
    }
    return blocks;
  }

  function parseBlock(ws, b) {
    const items = [], last = ws.rowCount;
    const T = (r, c) => ctext(anchorOf(ws, r, c));
    const addr = (r, c) => anchorOf(ws, r, c).address;
    const isBand = r => !!T(r, b.lc) && addr(r, b.lc) === addr(r, b.nc);
    const isBlank = r => { for (let c = b.lc; c <= b.nc; c++) { const cell = ws.getCell(r, c); if (T(r, c) || isFilled(cell) || hasBorder(cell)) return false; } return true; };
    const rowText = r => { let x = ""; for (let c = b.lc; c <= b.nc; c++) x += " " + T(r, c); return norm(x).trim(); };
    const anchorsWithText = r => { const seen = new Set(), out = [];
      for (let c = b.lc; c <= b.nc; c++) { const a = anchorOf(ws, r, c); if (seen.has(a.address)) continue; seen.add(a.address); if (ctext(a)) out.push([c, ctext(a), a.address]); }
      return out; };
    let section = "", r = b.head + 1;
    while (r <= last) {
      if (isBlank(r) || STOP_RX.test(rowText(r))) { b.end = r; break; }
      if (isBand(r)) {
        section = T(r, b.lc); r++;
        const shifts = anchorsWithText(r).filter(([, x]) => SHIFT_RX.test(norm(x)));
        if (shifts.length >= 2) {  // a duty in shifts: one column per shift, one row per person
          const times = shifts.map(([, x]) => { const m = String(x).match(/(\d{1,2})[:.](\d{2})/);
            if (!m) return ""; const h = +m[1]; return `${String(h).padStart(2, "0")}:${m[2]}-${String((h + 2) % 24).padStart(2, "0")}:${m[2]}`; }).filter(Boolean);
          const seats = []; r++;
          while (r <= last && !isBlank(r) && !isBand(r) && !rowText(r) && !STOP_RX.test(rowText(r))) {
            seats.push({ cells: shifts.map(([c]) => addr(r, c)), rank: null, rankInName: false }); r++;
          }
          items.push({ section, label: "", kitchen: true, hours: times.join(", "), hasHours: true, rank: "", seats, inactive: !seats.length, col: b.col });
        }
        continue;
      }
      const label = T(r, b.lc);
      if (!label) { r++; continue; }  // grey separator rows and the like
      // a table: a row of column titles, then rows whose first cell has the hours
      if (!timesOf(label).length && timesOf(T(r + 1, b.lc)).length && !normHours(T(r, b.hc))) {
        const heads = anchorsWithText(r).filter(([c]) => addr(r, c) !== addr(r, b.lc));
        let rr = r + 1, i = 0;
        while (rr <= last && timesOf(T(rr, b.lc)).length) {
          const la = addr(rr, b.lc); let end = rr;
          while (end + 1 <= last && addr(end + 1, b.lc) === la) end++;
          const lt = T(rr, b.lc);
          const key = (lt.split(/[(\n]|\d{1,2}[:.]\d{2}/)[0] || "").trim() || `${i + 1}ος`;
          const rankM = lt.match(/\(([^)]+)\)/);
          const rowCells = anchorsWithText(rr).map(([, x]) => x);
          const rankTxt = rankM ? rankM[1].trim() : (rowCells.find(x => /^(ΣΤΡ|ΝΣΤΡ|ΔΝΕΑΣ|ΕΠΧΙΑΣ|ΑΛΧΙΑΣ|ΛΧΙΑΣ|Μ ΛΧΙΑΣ|ΑΜ)$/.test(norm(x))) || "");
          for (const [c, head] of heads) {
            const seats = [], seen = new Set(); let empty = true;
            for (let k = rr; k <= end; k++) {
              const a = addr(k, c); if (seen.has(a)) continue; seen.add(a);
              if (EMPTY_MARK.test(T(k, c))) continue;
              empty = false; seats.push({ cells: [a], rank: null, rankInName: false });
            }
            items.push({ section: label, label: `${key}|${head}`, hours: timesOf(lt).join(", "), hasHours: true, rank: rankTxt, seats, inactive: empty, col: b.col, grid: true });
          }
          rr = end + 1; i++;
        }
        r = rr;
        continue;
      }
      // an ordinary duty: rows sharing the same (merged) title cell are its people
      const la = addr(r, b.lc); let end = r;
      while (end + 1 <= last && addr(end + 1, b.lc) === la) end++;
      const hoursRaw = T(r, b.hc) === label ? "" : T(r, b.hc);
      const seats = [], seen = new Set(); let inactive = true;
      for (let k = r; k <= end; k++) {
        const na = anchorOf(ws, k, b.nc);
        if (seen.has(na.address)) continue; seen.add(na.address);
        const ra = b.rc ? anchorOf(ws, k, b.rc) : null;
        const rankSeparate = ra && ra.address !== na.address && ra.address !== la;
        if (!isFilled(na) || ctext(na)) inactive = false;
        seats.push({ cells: [na.address], rank: rankSeparate ? ra.address : null, rankInName: !rankSeparate });
      }
      const clean = label.replace(/\([^)]*\d{1,2}[:.]\d{2}[^)]*\)/g, "").replace(/\s+/g, " ").trim();
      const hrs = normHours(hoursRaw) || timesOf(label).join(", ");
      items.push({ section, label: clean, hours: hrs, hasHours: !!hrs, rank: b.rc ? T(r, b.rc) : "", seats, inactive, col: b.col });
      const parts = new Set([b.lc, b.hc, b.rc, b.nc].filter(Boolean).map(c => addr(r, c)));
      if (end === r && parts.size === [b.lc, b.hc, b.rc, b.nc].filter(Boolean).length) b.proto = r;  // a plain one-row duty
      r = end + 1;
    }
    if (!b.end) b.end = r;
    if (!b.proto) b.proto = b.head + 1;
    return items;
  }

  function templateSheet(wb) {
    for (const ws of wb.worksheets) { const blocks = findBlocks(ws); if (blocks.length) return { ws, blocks }; }
    return null;
  }
  function templateItems(ws, blocks) { return blocks.flatMap(b => parseBlock(ws, b)); }

  /* which entry of `list` (services, or the posts of a roster) each template item is */
  function matchItems(items, list) {
    const used = new Set();
    const find = pred => list.findIndex((s, i) => !used.has(i) && pred(s));
    return items.map(it => {
      const sec = loose(it.section), lab = loose(it.label);
      let i = -1;
      if (it.kitchen) i = find(s => loose(s.section) === sec && (!s.post || loose(s.service) === sec));
      if (i < 0 && lab) i = find(s => loose(s.post) === lab && loose(s.section) === sec);
      if (i < 0 && lab) i = find(s => !s.post && loose(s.service) === lab && (!sec || !s.section || loose(s.section) === sec));
      if (i < 0 && lab) i = find(s => loose(s.task || E.taskName(s)) === lab);
      if (i < 0 && lab && sec) i = find(s => loose(s.post) === lab && (loose(s.service).includes(sec) || sec.includes(loose(s.section))));
      if (i >= 0) used.add(i);
      return i;
    });
  }

  /* Read an uploaded form: the duties it has, matched with the current list (settings kept) or new. */
  async function readTemplate(buffer, services) {
    const wb = new (XL().Workbook)();
    await wb.xlsx.load(buffer);
    const t = templateSheet(wb);
    if (!t) throw new Error("Δεν βρέθηκαν οι στήλες «ΩΡΑΡΙΟ», «ΒΑΘΜΟΣ» και «ΟΝΟΜΑ» (ή «ΟΝΟΜΑΤΕΠΩΝΥΜΟ») στην επικεφαλίδα του πίνακα.");
    const items = templateItems(t.ws, t.blocks);
    const match = matchItems(items, services);
    const out = [], report = { found: 0, kept: 0, added: [], removed: [], sheet: t.ws.name };
    items.forEach((it, k) => {
      const i = match[k];
      if (i >= 0) {
        const s = JSON.parse(JSON.stringify(services[i]));
        s.active = !it.inactive;  // on the form = active, even if it was only a suggestion
        s.col = it.col;
        if (it.section && !it.grid && !it.kitchen) s.section = it.section;
        if (!s.link && it.hours && !it.kitchen) { try { E.parseTimes(it.hours); s.times = it.hours; } catch (e) { /* keep the list's hours */ } }
        if (it.seats.length > (+s.needed || 1)) s.needed = it.seats.length;
        out.push(s); report.found++; report.kept++;
      } else if (it.hasHours && it.seats.length) {
        const single = E.rankSet(it.rank).size === 1 ? it.rank : "";
        const s = { service: it.grid || it.kitchen || it.section ? it.section : it.label, post: it.grid || it.section ? it.label : "",
          times: it.hours, needed: it.seats.length, rank: single || "ΣΤΡ", section: it.section || "", col: it.col, link: "",
          active: !it.inactive, armed: false };
        if (!s.service) { s.service = s.post; s.post = ""; }
        out.push(s); report.found++; report.added.push(E.taskName(s));
      }
    });
    if (!report.found) throw new Error("Δεν βρέθηκε καμία υπηρεσία κάτω από τις στήλες του πίνακα.");
    services.forEach((s, i) => {
      if (!match.includes(i)) { out.push(Object.assign(JSON.parse(JSON.stringify(s)), { active: false }));
        if (s.active !== false && !s.link) report.removed.push(E.taskName(s)); }
    });
    return { services: out, report };
  }

  const colNum = l => l.split("").reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
  const parseRange = m => { const x = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(m); return x && { c1: colNum(x[1]), r1: +x[2], c2: colNum(x[3]), r2: +x[4] }; };
  const parseAddr = a => { const x = /^([A-Z]+)(\d+)$/.exec(a); return { c: colNum(x[1]), r: +x[2] }; };

  /* Copy of the form. `inserts` = [{at, k, block}]: k empty duty rows (styled like the block's plain duty row)
     open at row `at` of that block only - the block's own rows below move down, the other column stays where it
     is, and from the first full-width row under the duties (ΟΥΔΕΜΙΑ ΑΛΛΑΓΗ..., signatures) everything moves
     down by the largest k. ws._mapRow(r, c) gives where a cell of the form went. */
  function cloneSheet(wb, src, name, inserts = []) {
    const merges = (src.model.merges || []).map(parseRange).filter(Boolean);
    const ws = wb.addWorksheet(name, { pageSetup: Object.assign({}, src.pageSetup), properties: Object.assign({}, src.properties) });
    if (src.views && src.views.length) ws.views = src.views.map(v => Object.assign({}, v));
    for (let c = 1; c <= src.columnCount; c++) {
      const sc = src.getColumn(c), dc = ws.getColumn(c);
      if (sc.width) dc.width = sc.width;
      if (sc.hidden) dc.hidden = true;
    }
    const inside = (c, blk) => c >= blk.lc && c <= blk.nc;
    const K = inserts.reduce((m, x) => Math.max(m, x.k), 0);
    const lastAt = inserts.reduce((m, x) => Math.max(m, x.at), 0);
    let sync = Infinity;
    for (const m of merges) {
      const crosses = inserts.some(x => (m.c1 < x.block.lc && m.c2 >= x.block.lc) || (m.c1 <= x.block.nc && m.c2 > x.block.nc));
      if (crosses && m.r1 >= lastAt) sync = Math.min(sync, m.r1);
    }
    const mapRow = (r, c) => {
      if (r >= sync) return r + K;
      const x = inserts.find(i => inside(c, i.block) && r >= i.at);
      return x ? r + x.k : r;
    };
    const heights = {};
    const setH = (R, h) => { if (h) heights[R] = Math.max(heights[R] || 0, h); };
    src.eachRow({ includeEmpty: true }, (row, r) => {
      row.eachCell({ includeEmpty: true }, (cell, c) => {
        const nc = ws.getCell(mapRow(r, c), c);
        if (!cell.isMerged || cell.master === cell) {
          let v = cell.value;
          if (v && typeof v === "object" && (v.formula || v.sharedFormula)) v = v.result === undefined ? null : v.result;
          nc.value = v;
        }
        nc.style = JSON.parse(JSON.stringify(cell.style || {}));
      });
      setH(mapRow(r, 1), row.height);
      inserts.forEach(x => setH(mapRow(r, x.block.lc), row.height));
    });
    for (const ins of inserts) {  // the new rows: styled like the block's plain duty row
      const proto = src.getRow(ins.block.proto);
      for (let i = 0; i < ins.k; i++) {
        for (let c = ins.block.lc; c <= ins.block.nc; c++) {
          const cell = ws.getCell(ins.at + i, c);
          cell.value = null;
          cell.style = JSON.parse(JSON.stringify(proto.getCell(c).style || {}));
        }
        setH(ins.at + i, proto.height || 15);
      }
    }
    for (const [R, h] of Object.entries(heights)) ws.getRow(+R).height = h;
    for (const m of merges) {
      const r1 = mapRow(m.r1, m.c1), r2 = mapRow(m.r2, m.c1);
      if (r2 > r1 || m.c2 > m.c1) { try { ws.mergeCells(r1, m.c1, r2, m.c2); } catch (e) { /* overlapping merge in the form: skip */ } }
    }
    ws._mapRow = mapRow;
    return ws;
  }

  function fillTitle(ws, date) {
    let done = false;
    ws.eachRow(row => row.eachCell(cell => {
      if (cell.isMerged && cell.master !== cell) return;
      const t = ctext(cell); if (!t) return;
      const n = norm(t);
      if (!done && /ΚΑΤΑΣΤΑΣΗ ΥΠΗΡΕΣΙΩΝ|ΣΥΓΚΕΝΤΡΩΤΙΚΗ/.test(n)) {
        let v = t.replace(/\d{1,2}\s*\/\s*\d{1,2}\s*\/\s*\d{2,4}/, fmtDate(date)).replace(/_+\s*\/\s*_+\s*\/\s*_+/, fmtDate(date));
        if (v === t) v = /ΤΗΣ\s*$/.test(n) ? `${t} ${fmtDate(date)}` : `${t} ΤΗΣ ${fmtDate(date)}`;
        cell.value = v; done = true;
      } else if (/^ΗΜΕΡΑ\s*:/.test(n)) cell.value = `ΗΜΕΡΑ: ${norm(DAY_NAMES[weekday(date)])}`;
    }));
  }

  async function templateDaySheets(wb, view, tplBuffer) {
    const tw = new (XL().Workbook)();
    await tw.xlsx.load(tplBuffer);
    const t = templateSheet(tw);
    if (!t) throw new Error("Το πρότυπο Excel δεν έχει τις στήλες ΩΡΑΡΙΟ / ΒΑΘΜΟΣ / ΟΝΟΜΑ.");
    const items = templateItems(t.ws, t.blocks);
    const match = matchItems(items, view.posts);
    // duties of the app that the form does not have: new rows under the last duty of their column
    const inForm = new Set(match.filter(i => i >= 0));
    const extra = view.posts.filter((p, i) => !inForm.has(i));
    const inserts = [];
    for (const b of t.blocks) {
      const mine = extra.filter(p => (t.blocks.some(x => x.col === p.col) ? p.col : t.blocks[t.blocks.length - 1].col) === b.col);
      if (mine.length) inserts.push({ at: b.end, k: mine.reduce((n, p) => n + p.needed, 0), block: b, posts: mine });
    }
    inserts.sort((a, b) => a.at - b.at);
    view.dates.forEach((date, d) => {
      const ws = cloneSheet(wb, t.ws, `${d + 1}. ${DAY_SHORT[weekday(date)]} ${date.slice(8, 10)}-${date.slice(5, 7)}`, inserts);
      fillTitle(ws, date);
      const at = a => { const { r, c } = parseAddr(a); return ws.getCell(ws._mapRow(r, c), c); };
      // the new rows: title and hours once per duty (merged over its people), then one person per row
      for (const ins of inserts) {
        const b = ins.block, base = ins.at;
        const protoMerges = (t.ws.model.merges || []).map(parseRange).filter(m => m && m.r1 === b.proto && m.r2 === b.proto && m.c1 >= b.lc && m.c2 <= b.nc);
        const spanOf = c => { const m = protoMerges.find(x => x.c1 <= c && c <= x.c2); return m ? [m.c1, m.c2] : [c, c]; };
        const L = spanOf(b.lc), H = spanOf(b.hc), Rk = b.rc ? spanOf(b.rc) : null, Nm = spanOf(b.nc);
        let r = base;
        for (const p of ins.posts) {
          const first = r, last = r + p.needed - 1, seats = view.seats[d][p.idx] || [];
          const merge = (r1, c1, r2, c2) => { if (r2 > r1 || c2 > c1) { try { ws.mergeCells(r1, c1, r2, c2); } catch (e) { /* skip */ } } };
          merge(first, L[0], last, L[1]); merge(first, H[0], last, H[1]);
          for (let k = first; k <= last; k++) {
            protoMerges.filter(m => m.c1 !== L[0] && m.c1 !== H[0]).forEach(m => merge(k, m.c1, k, m.c2));
            const s = seats[k - first];
            if (s) {
              ws.getCell(k, Nm[0]).value = s.name + (s.unarmed ? " (ΑΟΠΛΟΣ)" : "");
              if (Rk && Rk[0] !== Nm[0]) ws.getCell(k, Rk[0]).value = s.rank;
            } else {
              if (!p.linkKind) ws.getCell(k, Nm[0]).value = "ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ";
              if (Rk && Rk[0] !== Nm[0]) ws.getCell(k, Rk[0]).value = p.rank;
            }
          }
          ws.getCell(first, L[0]).value = (p.section && p.post ? p.post : p.task).replace(/\|/g, " · ");
          ws.getCell(first, H[0]).value = p.linkKind ? p.linkText : hoursText(p);
          r = last + 1;
        }
      }

      items.forEach((it, k) => {
        if (match[k] < 0 || !it.seats.length) return;
        const p = view.posts[match[k]], seats = view.seats[d][p.idx] || [];
        const per = Math.max(1, Math.ceil(p.needed / it.seats.length));
        it.seats.forEach((row, j) => {
          const who = seats.slice(j * per, (j + 1) * per).filter(Boolean);
          if (!who.length) {
            if (!p.linkKind && !p.noOne && seats.length) row.cells.forEach(a => { at(a).value = "ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ"; });
            return;
          }
          const text = who.map(s => (row.rankInName && !it.kitchen && !it.grid ? s.rank + " " : "") + s.name + (s.unarmed ? " (ΑΟΠΛΟΣ)" : "")).join(" / ");
          row.cells.forEach(a => { at(a).value = text; });
          if (row.rank) at(row.rank).value = [...new Set(who.map(s => s.rank))].join(" / ");
        });
      });
    });
  }

  async function rosterWorkbook(view, tplBuffer) {
    const wb = new (XL().Workbook)();
    wb.creator = "Υπηρεσίες";
    const left = view.posts.filter(p => p.col !== 2), right = view.posts.filter(p => p.col === 2);
    const nameOf = s => s ? s.name + (s.unarmed ? " (ΑΟΠΛΟΣ)" : "") : "";
    if (view.days > 1 && !view.blank) {
      const ws = wb.addWorksheet("Εβδομάδα", { pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
      const ncol = 3 + view.days;
      ws.mergeCells(1, 1, 1, ncol);
      ws.getCell(1, 1).value = `ΠΡΟΓΡΑΜΜΑ ΥΠΗΡΕΣΙΩΝ ${fmtDate(view.dates[0])} - ${fmtDate(view.dates[view.days - 1])}`;
      ws.getCell(1, 1).font = { bold: true, size: 14 }; ws.getCell(1, 1).alignment = CENTER;
      ["ΥΠΗΡΕΣΙΑ", "ΝΟΥΜΕΡΟ", "ΩΡΑΡΙΟ"].concat(view.dates.map(d => `${DAY_NAMES[weekday(d)]}\n${fmtDate(d, false)}`))
        .forEach((t, i) => { ws.getCell(3, i + 1).value = t; });
      header(ws, 3, ncol, 32);
      let r = 4;
      for (const p of view.posts) {
        const first = r;
        for (let slot = 0; slot < p.needed; slot++) {
          const vals = [p.section || p.task, p.section ? p.post : "", p.weekly ? "ΕΒΔΟΜΑΔΙΑΙΑ" : (p.labels.join("\n") || p.linkText)];
          view.dates.forEach((_, d) => {
            const s = view.seats[d][p.idx][slot];
            vals.push(s ? nameOf(s) : (p.linkKind ? "" : "ΔΕΝ ΦΤΑΝΟΥΝ"));
          });
          vals.forEach((v, i) => { const cell = ws.getCell(r, i + 1); cell.value = v; cell.border = BORDER; cell.alignment = CENTER; cell.font = { size: 9, bold: i === 0 }; });
          r++;
        }
        if (r - 1 > first) for (const i of [1, 2, 3]) ws.mergeCells(first, i, r - 1, i);
      }
      [22, 13, 13].concat(view.dates.map(() => 19)).forEach((w, i) => { ws.getColumn(i + 1).width = w; });
      ws.views = [{ state: "frozen", xSplit: 3, ySplit: 3 }];
    }
    if (tplBuffer && !view.blank) await templateDaySheets(wb, view, tplBuffer);
    else view.dates.forEach((date, d) => {
      const ws = wb.addWorksheet(view.blank ? "Έντυπο" : `${d + 1}. ${DAY_SHORT[weekday(date)]} ${date.slice(8, 10)}-${date.slice(5, 7)}`,
        { pageSetup: { paperSize: 9, orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 1, horizontalCentered: true,
          margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } } });
      const ncol = right.length ? 9 : 4;
      ws.mergeCells(1, 1, 1, ncol); ws.mergeCells(2, 1, 2, ncol);
      ws.getCell(1, 1).value = `ΣΥΓΚΕΝΤΡΩΤΙΚΗ ΚΑΤΑΣΤΑΣΗ ΥΠΗΡΕΣΙΩΝ ΤΗΣ ${view.blank ? "____/____/________" : fmtDate(date)}`;
      ws.getCell(1, 1).font = { bold: true, size: 14, underline: true }; ws.getCell(1, 1).alignment = CENTER;

      }
      if (right.length) {

        rr += 3;
        for (const area of FORM_AREAS) {

          cell.value = area; cell.font = { bold: true, size: 8 }; cell.alignment = CENTER; cell.border = BORDER;
          ws.mergeCells(rr, 7, rr, 9);

      let r = Math.max(rl, rr) + 1;
      ws.mergeCells(r, 1, r, ncol);
      ws.getCell(r, 1).value = "ΟΥΔΕΜΙΑ ΑΛΛΑΓΗ ΔΕΝ ΔΥΝΑΤΑΙ ΝΑ ΠΡΑΓΜΑΤΟΠΟΙΗΘΕΙ ΣΤΙΣ ΥΠΗΡΕΣΙΕΣ ΠΕΡΑΝ ΑΠΟ ΤΗΝ ΕΓΚΡΙΣΗ ΤΟΥ ΔΙΟΙΚΗΤΗ.";
      ws.getCell(r, 1).font = { bold: true, underline: true, size: 9 }; ws.getCell(r, 1).alignment = { wrapText: true, vertical: "middle" };
      heights[r] = right.length ? 15 : 26;
      r += 1;
      const sigCols = right.length ? [1, 2, 3, 4, 6, 7, 8, 9] : [1, 2, 3, 4];
      const sigs = right.length ? FORM_SIGNATURES : ["Ο ΣΥΝΤΑΞΑΣ", "ΤΟ 2ο ΓΡΑΦΕΙΟ", "", "ΘΕΩΡΗΘΗΚΕ\nΟ ΔΙΟΙΚΗΤΗΣ"];
      sigCols.forEach((col, i) => {
        const cell = ws.getCell(r, col);
        cell.value = sigs[i]; cell.font = { bold: true, size: 8 }; cell.alignment = { horizontal: "center", vertical: "top", wrapText: true };
      });

      (right.length ? [23, 13.5, 11, 23, 1.5, 19, 13.5, 11, 23] : [30, 16, 12, 34]).forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    });
    if (view.blank) return wb.xlsx.writeBuffer();
    const ls = wb.addWorksheet("Λίστα");
    const lh = ["Date", "Day", "Shift Time", "Task Name", "Assigned Worker", "Rank", "Hours", "Notes", "Γύρος", "Εξαιρέσεις ατόμου"];
    ls.addRow(lh); header(ls, 1, lh.length);
    view.dates.forEach((date, d) => {
      for (const p of view.posts) view.seats[d][p.idx].forEach(s => {

          : s.viol.map(([rule, det]) => `${rule} (${det})`).join("; ");
        if (s && s.carried) note = "εβδομαδιαία (ίδιος όλη την εβδομάδα)";
        else if (s && s.kept3) note = "τριήμερο ΣΚ (ίδιος από Παρασκευή, επιστροφή Δευτέρα πρωί)";
        const row = ls.addRow([isoDate(date), DAY_NAMES[weekday(date)], p.shiftText, p.task, s ? s.name : "ΔΕΝ ΦΤΑΝΟΥΝ",
          s ? s.rank : p.rank, p.linkKind ? 0 : Math.round(p.hours * 100) / 100, note, s ? s.cycle : null, s ? s.exempt : ""]);
        row.eachCell({ includeEmpty: true }, cell => { cell.border = BORDER; cell.fill = fill(d % 2 ? WHITE : "FFDDEBF7"); });
        row.getCell(1).numFmt = "dd/mm/yyyy";

    [12, 11, 40, 34, 24, 9, 7, 45, 7, 30].forEach((w, i) => { ls.getColumn(i + 1).width = w; });
    ls.views = [{ state: "frozen", ySplit: 1 }];
    const wsW = wb.addWorksheet("Warnings");
    wsW.addRow(["#", "Date", "Task Name", "Worker", "Κανόνας που χαλάρωσε", "Λεπτομέρειες"]); header(wsW, 1, 6);
    (view.shortage || []).forEach(sh => {  // first: ranks with more duties than people
      const text = typeof sh === "string" ? sh : sh.text;
      const row = wsW.addRow(["!", "", "ΟΛΕΣ", text.split(":")[0], "ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ", text]);
      row.eachCell(c => { c.font = { bold: true }; c.alignment = { wrapText: true, vertical: "top" };
        c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF8CBAD" } }; });
      row.height = 15 * (Math.floor(text.length / 45) + 1);

    if (!view.warnings.length && !(view.shortage || []).length) wsW.addRow(["", "", "Καμία χαλάρωση - τηρήθηκαν όλοι οι κανόνες."]);
    view.warnings.forEach((w, i) => {
      const row = wsW.addRow([i + 1, isoDate(w.date), w.task, w.worker, w.rule, w.detail]);

  // ------------------------------------------------------------------ names / history workbook (Άτομα.xlsx)
  const LOG_HEADERS = ["Ημερομηνία", "Ημέρα", "Υπηρεσία", "Νούμερο", "Ωράριο", "Ονοματεπώνυμο", "Βαθμός", "Ώρες", "Γύρος"];
  const cyclesText = c => Object.keys(c).sort().map(k => `${k}=${c[k]}`).join(";");
  function parseCycles(v) {
    const t = String(v === undefined || v === null ? "" : v).trim();
    if (!t) return { "*": 1 };
    if (/^\d+(\.0)?$/.test(t)) return { "*": parseInt(t, 10) };
    const out = {};
    t.split(";").forEach(part => { const [k, val] = part.split("="); if (val !== undefined && !isNaN(+val)) out[k.trim()] = parseInt(val, 10); });
    return Object.keys(out).length ? out : { "*": 1 };
  }
  const names = v => String(v || "").split("|").map(s => s.trim()).filter(Boolean).map(norm);

  /* The quarter of each rank with the fewest hours (at least one, and only if really behind the average):
     shown in bold - they are next, so the hours even out. Same rule as Άτομα.xlsx of the PC. */
  function fewestHours(history, people, rules) {
    const hours = new Map(people.map(p => [norm(p.name), 0])), n = new Map();
    for (const e of history.entries) { const k = norm(e.worker); if (hours.has(k)) { hours.set(k, hours.get(k) + (+e.hours || 0)); n.set(k, (n.get(k) || 0) + 1); } }
    const last = E.lastDate(history);
    if (rules && last) for (const p of people) {  // απόσπαση counts as duties done (same credit as the engine)
      const k = norm(p.name), rng = E.parseRanges((rules[p.name] || {}).detached, last);
      const days = rng.reduce((a, [f, t]) => a + (last >= f ? E.diffDays(last < t ? last : t, f) + 1 : 0), 0);
      if (days) hours.set(k, hours.get(k) + days * E.CONFIG.detachedPerWeek / 7 * (n.get(k) ? hours.get(k) / n.get(k) : 24));
    }
    const byRank = new Map();
    for (const p of people) { const g = rankKey(p.rank || E.CONFIG.defaultRank); if (!byRank.has(g)) byRank.set(g, []); byRank.get(g).push(hours.get(norm(p.name))); }
    const out = new Set();
    for (const p of people) {
      const k = norm(p.name), hs = byRank.get(rankKey(p.rank || E.CONFIG.defaultRank)).slice().sort((a, b) => a - b);
      if (hs.length < 2 || hs[0] === hs[hs.length - 1]) continue;
      const cut = hs[Math.max(0, Math.floor(hs.length / 4) - 1)], avg = hs.reduce((a, b) => a + b, 0) / hs.length;
      if (hours.get(k) <= cut && hours.get(k) < avg - 0.01) out.add(k);
    }
    return out;
  }

  async function historyWorkbook(history, people, rules, services) {
    const wb = new (XL().Workbook)();
    const entries = history.entries.slice().sort((a, b) => a.date.localeCompare(b.date) || a.service.localeCompare(b.service) || a.worker.localeCompare(b.worker));
    const byWorker = new Map(), display = new Map();
    for (const e of entries) {
      const k = norm(e.worker);
      if (!byWorker.has(k)) byWorker.set(k, []);
      byWorker.get(k).push(e);
      if (!display.has(k)) display.set(k, [e.worker, e.rank]);
    }
    for (const p of people) display.set(norm(p.name), [p.name, p.rank || E.CONFIG.defaultRank]);
    const active = new Set(people.map(p => norm(p.name)));
    const svcList = [...new Set(services.filter(s => s.active !== false && !s.link).map(s => s.service).concat(entries.map(e => e.service)))];
    const exempt = name => {
      const r = rules[name] || {};
      return [r.unarmed ? "ΑΟΠΛΟΣ" : "", r.no24h ? "όχι 24ωρες" : "", r.shifts ? `όχι ώρες: ${r.shifts}` : "", r.tasks ? `όχι: ${r.tasks}` : "",
        r.days ? `λείπει: ${r.days}` : "", r.leave ? `άδεια: ${r.leave}` : "", r.detached ? `απόσπαση: ${r.detached}` : ""].filter(Boolean).join(" · ");
    };
    const served = new Set(history.served);
    // ---- Ονόματα
    const ws = wb.addWorksheet("Ονόματα", { pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    const last = E.lastDate(history);
    const groups = new Map();
    for (const p of people) { const g = rankKey(p.rank || E.CONFIG.defaultRank); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(norm(p.name)); }
    const cyc = [...groups].sort((a, b) => rankSort(a[0]) - rankSort(b[0]))
      .map(([g, ms]) => `${g}: γύρος ${E.historyCycle(history, g)} (έκαναν ${ms.filter(n => served.has(n)).length}/${ms.length})`).join("   ");
    ws.getCell(1, 1).value = "ΟΝΟΜΑΤΑ - ΥΠΗΡΕΣΙΕΣ ΠΟΥ ΕΧΕΙ ΚΑΝΕΙ Ο ΚΑΘΕΝΑΣ"; ws.getCell(1, 1).font = { bold: true, size: 14 };
    ws.getCell(2, 1).value = (last ? `Ενημέρωση έως: ${fmtDate(last)}   |   ` : "") + `Γύροι: ${cyc}` +
      "   |   Με ΕΝΤΟΝΑ: όσοι έχουν τις λιγότερες ώρες στον βαθμό τους (μπαίνουν πρώτοι για να βγουν ίσες)";
    ws.getCell(2, 1).font = { bold: true };
    const maxDuties = Math.max(0, ...[...byWorker.values()].map(v => v.length));
    const fixed = ["Α/Α", "Ονοματεπώνυμο", "Βαθμός", "Εξαιρέσεις", "ΣΥΝΟΛΟ"].concat(svcList, ["Ώρες", "Τελευταία υπηρεσία", "Γύρος υπηρεσιών"]);
    const heads = fixed.concat(Array.from({ length: maxDuties }, (_, i) => `${i + 1}η`));
    const hr = 4;
    heads.forEach((t, i) => { ws.getCell(hr, i + 1).value = t; });
    header(ws, hr, heads.length, 46);
    const order = [...display.keys()].sort((a, b) => (active.has(b) - active.has(a)) || rankSort(display.get(a)[1]) - rankSort(display.get(b)[1]) || display.get(a)[0].localeCompare(display.get(b)[0]));
    const behind = fewestHours(history, people, rules);
    order.forEach((k, i) => {
      const ents = byWorker.get(k) || [];
      let [name, rank] = display.get(k);
      const c = E.historyCycle(history, rank);
      let status = served.has(k) ? `ΕΚΑΝΕ - περιμένει τους άλλους (γύρος ${c})` : `ΣΕΙΡΑ ΤΟΥ ΣΥΝΤΟΜΑ (γύρος ${c})`;
      if (!active.has(k)) { name += " (εκτός λίστας)"; status = "-"; }
      const counts = {}; ents.forEach(e => { counts[e.service] = (counts[e.service] || 0) + 1; });
      const ex = active.has(k) ? exempt(name) : "";
      const row = ws.getRow(hr + 1 + i);
      [i + 1, name, rank, ex, ents.length].concat(svcList.map(s => counts[s] || 0),
        [Math.round(ents.reduce((a, e) => a + (+e.hours || 0), 0) * 10) / 10, ents.length ? isoDate(ents[ents.length - 1].date) : null, status],
        ents.map(e => `${fmtDate(e.date).slice(0, 6)}${e.date.slice(2, 4)} ${e.task}`)).forEach((v, j) => {
        const cell = row.getCell(j + 1);
        cell.value = v; cell.border = BORDER; cell.alignment = (j === 1 || j === 3 || j >= fixed.length) ? LEFT : CENTER;
        if (j >= 5 && j < 5 + svcList.length && v === 0) cell.font = { color: { argb: "FFBFBFBF" } };
      });
      row.getCell(5).font = { bold: true };
      if (behind.has(k)) { row.getCell(2).font = { bold: true }; row.getCell(fixed.length - 2).font = { bold: true }; }
      row.getCell(fixed.length - 1).numFmt = "dd/mm/yyyy";
      row.getCell(fixed.length).fill = fill(status.startsWith("ΕΚΑΝΕ") ? "FFC6EFCE" : "FFFFF2CC");
      if (ex.includes("ΑΟΠΛΟΣ")) [2, 4].forEach(j => { row.getCell(j).fill = fill("FFF4B183"); });
    });
    const widths = [5, 26, 9, 22, 10].concat(svcList.map(() => 14), [8, 12, 38], Array.from({ length: maxDuties }, () => 34));
    widths.forEach((w, i) => { ws.getColumn(i + 1).width = w; });
    ws.views = [{ state: "frozen", xSplit: 2, ySplit: hr }];
    // ---- Άοπλοι & εξαιρέσεις
    const ex = wb.addWorksheet("Άοπλοι & εξαιρέσεις");
    ex.addRow(["Ονοματεπώνυμο", "Βαθμός", "Άοπλος", "Εξαιρέσεις", "Σημείωση"]); header(ex, 1, 5);
    people.filter(p => exempt(p.name) || (rules[p.name] || {}).note)
      .sort((a, b) => (!!(rules[b.name] || {}).unarmed - !!(rules[a.name] || {}).unarmed) || rankSort(a.rank) - rankSort(b.rank))
      .forEach(p => {
        const r = rules[p.name] || {};
        const row = ex.addRow([p.name, p.rank, r.unarmed ? "ΑΟΠΛΟΣ" : "", exempt(p.name), r.note || ""]);
        if (r.unarmed) row.eachCell(cell => { cell.fill = fill("FFF4B183"); });
      });
    [26, 10, 10, 60, 30].forEach((w, i) => { ex.getColumn(i + 1).width = w; });
    // ---- Ιστορικό
    const lg = wb.addWorksheet("Ιστορικό");
    lg.addRow(LOG_HEADERS); header(lg, 1, LOG_HEADERS.length);
    entries.forEach(e => {
      const row = lg.addRow([isoDate(e.date), DAY_NAMES[weekday(e.date)], e.service, e.task, e.shift, e.worker, e.rank, e.hours, e.cycle]);
      row.getCell(1).numFmt = "dd/mm/yyyy";
    });
    [12, 11, 26, 32, 40, 24, 9, 7, 7].forEach((w, i) => { lg.getColumn(i + 1).width = w; });
    lg.views = [{ state: "frozen", ySplit: 1 }];
    // ---- Γύροι
    const cy = wb.addWorksheet("Γύροι");
    cy.addRow(["Βαθμός", "Γύρος", "Από", "Έως", "Υπηρεσίες", "Άτομα", "Κατάσταση"]); header(cy, 1, 7);
    const per = new Map();
    entries.forEach(e => { const k = (rankKey(e.rank) || "ΣΤΡ") + "|" + e.cycle; if (!per.has(k)) per.set(k, []); per.get(k).push(e); });
    [...per.keys()].sort((a, b) => { const [ga, ca] = a.split("|"), [gb, cb] = b.split("|"); return rankSort(ga) - rankSort(gb) || ca - cb; })
      .forEach(k => {
        const [g, c] = k.split("|"), es = per.get(k);
        const row = cy.addRow([g, +c, isoDate(es[0].date), isoDate(es[es.length - 1].date), es.length, new Set(es.map(e => norm(e.worker))).size,
          +c >= E.historyCycle(history, g) ? "σε εξέλιξη" : "ολοκληρώθηκε"]);
        row.getCell(3).numFmt = row.getCell(4).numFmt = "dd/mm/yyyy";
      });
    // ---- machine state (hidden) - same as the PC program
    const st = wb.addWorksheet("_state", { state: "hidden" });
    st.addRow(["cycles", cyclesText(history.cycles)]);
    st.addRow(["served", history.served.slice().sort().join("|")]);
    st.addRow(["early", history.early.slice().sort().join("|")]);
    const sn = wb.addWorksheet("_snapshots", { state: "hidden" });
    sn.addRow(["start", "cycle", "served", "early"]);
    Object.keys(history.snapshots).sort().forEach(d => {
      const s = history.snapshots[d];
      sn.addRow([isoDate(d), cyclesText(s.cycles), s.served.slice().sort().join("|"), s.early.slice().sort().join("|")]);
    });
    return wb.xlsx.writeBuffer();
  }

  async function readHistory(buffer) {
    const wb = new (XL().Workbook)();
    await wb.xlsx.load(buffer, LOAD_OPTS);
    const h = E.emptyHistory();
    const lg = findSheet(wb, "Ιστορικό");
    if (!lg) throw new Error("Αυτό δεν είναι αρχείο Άτομα.xlsx (δεν έχει φύλλο «Ιστορικό»).");
    sheetRows(lg).slice(1).forEach(r => {
      const date = E.excelDateToIso(r[0]);
      if (!date || !r[5]) return;
      h.entries.push({ date, service: String(r[2] || ""), task: String(r[3] || r[2] || ""), shift: String(r[4] || ""),
        worker: String(r[5]).trim(), rank: String(r[6] || ""), hours: +r[7] || 0, cycle: parseInt(r[8] || 1, 10) || 1 });
    });
    const st = findSheet(wb, "_state");
    if (st) {
      const kv = {}; sheetRows(st).forEach(r => { kv[String(r[0])] = r[1]; });
      h.cycles = parseCycles(kv.cycles !== undefined ? kv.cycles : kv.cycle);
      h.served = names(kv.served); h.early = names(kv.early);
    }
    const sn = findSheet(wb, "_snapshots");
    if (sn) sheetRows(sn).slice(1).forEach(r => {
      const d = E.excelDateToIso(r[0]);
      if (d) h.snapshots[d] = { cycles: parseCycles(r[1]), served: names(r[2]), early: names(r[3]) };
    });
    h.entries.sort((a, b) => a.date.localeCompare(b.date));
    return h;
  }

  /* Empty paper form: the duties and hours of the list, no names - to print or to show how the roster looks */
  async function blankFormWorkbook(services, notes) {
    const posts = E.buildPosts(services).map(p => Object.assign({}, p, { noOne: false }));
    return rosterWorkbook({ blank: true, days: 1, dates: ["2000-01-03"], posts, formNotes: notes,
      seats: [posts.map(p => new Array(p.needed).fill(null))] });
  }

  async function sampleNamesWorkbook(people) {
    const wb = new (XL().Workbook)();
    const ws = wb.addWorksheet("Workers");

    ws.getColumn(1).width = 28; ws.getColumn(2).width = 12;
    return wb.xlsx.writeBuffer();

window.HELP = {"title": "Υπηρεσίες - Οδηγίες χρήσης", "sections": [{"title": "Τι κάνει", "intro": "Βγάζει το πρόγραμμα υπηρεσιών (ημερήσιο ή εβδομαδιαίο) με δίκαιη σειρά για όλους. Κάθε υπηρεσία την κάνει μόνο όποιος έχει τον σωστό βαθμό, κανείς δεν παίρνει κολλητές βάρδιες, και όλοι μπαίνουν με τη σειρά. Βγάζει δύο Excel: το έντυπο με τις υπηρεσίες (για εκτύπωση) και το Άτομα.xlsx, που γράφει ποιος έκανε τι.", "items": [], "numbered": false}, {"title": "Τα 4 βήματα για να βγάλεις πρόγραμμα", "items": ["Ονόματα - Άνοιξε το Excel με τα ονόματα. Χρειάζεται δύο στήλες: «Ονοματεπώνυμο» και «Βαθμός» (ΣΤΡ, ΔΝΕΑΣ, ΕΠΧΙΑΣ...). Όποιος δεν έχει βαθμό θεωρείται ΣΤΡ. Μπορείς και να γράψεις ονόματα ένα-ένα.", "Υπηρεσίες - Όλες οι υπηρεσίες του εντύπου υπάρχουν ως «προτεινόμενες», αλλά ξεκινούν ανενεργές. Ανέβασε το άδειο έντυπο της μονάδας σαν «Πρότυπο» και ενεργοποιούνται μόνες τους όσες έχει. Ή ενεργοποίησε εσύ όσες θέλεις (το «+» στο κινητό, κλικ στο ☐ στον υπολογιστή). Μπορείς και να φτιάξεις νέες (δες «Πώς φτιάχνεις νέα υπηρεσία»).", "Εξαιρέσεις - Για όποιον χρειάζεται: άοπλος, όχι πρωινές ή βραδινές, όχι 24ωρες, άδεια, υπηρεσίες που δεν κάνει (δες «Πώς δουλεύουν οι εξαιρέσεις»).", "Βγάλε πρόγραμμα - Διάλεξε «Ημερήσιο» ή «Εβδομαδιαίο» και από ποια μέρα, και πάτα «Βγάλε πρόγραμμα». Κατέβασε το Excel με τις υπηρεσίες για να το τυπώσεις και κράτα το Άτομα.xlsx."], "numbered": true, "note": "Την επόμενη φορά συνεχίζει μόνο του από την επόμενη μέρα, με τη σειρά που έμεινε."}, {"title": "Κανόνες που δεν σπάνε ποτέ", "items": ["Μία υπηρεσία τη μέρα - κανείς δεν παίρνει 2 διαφορετικές υπηρεσίες την ίδια μέρα. Αν δεν φτάνουν τα άτομα, η θέση μένει κενή και γράφει «ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ» - δεν μπαίνει κανείς δεύτερη φορά.", "Δύο συνεχόμενες μέρες μόνο αν δεν φτάνουν τα άτομα - κανονικά μπαίνουν το πολύ μέρα παρά μέρα. Αν τα άτομα δεν φτάνουν για να καλυφθούν οι θέσεις, κάποιοι μπαίνουν 2 συνεχόμενες μέρες, με τη σειρά (πρώτα όσοι δεν έχουν ξαναμπεί), και το πρόγραμμα γράφει ότι οι υπηρεσίες είναι περισσότερες από τα άτομα.", "Φυλάκια το Σαββατοκύριακο - είναι τριήμερο: όποιος πάει Παρασκευή μένει Σάββατο και Κυριακή και γυρνάει Δευτέρα πρωί (τη Δευτέρα δεν παίρνει υπηρεσία). Αλλάζει με το «Τριήμερο ΣΚ» σε κάθε υπηρεσία.", "Βαθμός - κάθε υπηρεσία την κάνει μόνο όποιος έχει τον βαθμό που επιτρέπει (π.χ. το ΑΥΔΜ ποτέ ΣΤΡ).", "Εξαιρέσεις και άδειες - ο άοπλος δεν μπαίνει ποτέ σε ένοπλη, κανείς δεν μπαίνει σε ώρες ή μέρες που έχει εξαίρεση ή άδεια.", "Ίδια ώρα - κανείς δεν έχει δύο βάρδιες που πέφτουν την ίδια ώρα."], "numbered": false, "note": "Δεν μετράνε σαν δεύτερη υπηρεσία: οι εβδομαδιαίες (ΑΓΟΣ / ΑΝΘΣΤΗΣ ΕΒΔΟΜΑΔΑΣ) και οι θέσεις που είναι «ίδιος με» ή «από» άλλη υπηρεσία (π.χ. ΟΔΗΓΟΣ Φ/Φ, πληρώματα οχημάτων, ΑΜ 2) - αυτές τις κάνει ο ίδιος άνθρωπος μαζί με την υπηρεσία του."}, {"title": "Πώς δουλεύουν οι εξαιρέσεις", "intro": "Στο κινητό: καρτέλα «Ονόματα» και πατάς πάνω στο όνομα. Στον υπολογιστή: κουμπί «Εξαιρέσεις».", "items": ["Άοπλος - δεν μπαίνει ποτέ σε ένοπλη υπηρεσία. Στις άοπλες υπηρεσίες μπαίνει πρώτος.", "Όχι πρωινές / απογευματινές / βραδινές / νυχτερινές - δεν μπαίνει σε υπηρεσία που πέφτει σε αυτές τις ώρες (πρωί 06-12, απόγευμα 12-18, βράδυ 18-24, νύχτα 00-06). Στο «Άλλες ώρες» γράφεις δικές σου, π.χ. 22:00-02:00.", "Όχι 24ωρες - δεν μπαίνει σε 24ωρες ή εβδομαδιαίες υπηρεσίες.", "Υπηρεσίες που δεν κάνει - τσεκάρεις όσες δεν μπορεί να κάνει.", "Άδεια - γράφεις από-έως (π.χ. 20/11/2026-24/11/2026). Εκείνες τις μέρες δεν μπαίνει υπηρεσία. Όταν γυρίσει, αν έχει μείνει πίσω σε υπηρεσίες, μπαίνει πρώτος μέχρι να φτάσει τους άλλους (μέρα παρά μέρα - ισχύει για ΣΤΡ). Αν δεν είναι πίσω, συνεχίζει κανονικά.", "Απόσπαση - γράφεις από-έως. Δεν μπαίνει υπηρεσία ούτε στις υπηρεσίες «μόνο από». Μετράει σαν να έκανε υπηρεσίες: 1 εβδομάδα = 3 υπηρεσίες (λιγότερες μέρες αναλογικά), οπότε όταν γυρίσει δεν χρειάζεται να «φτάσει» τους άλλους.", "Άλλες μέρες που λείπει - μέρες (π.χ. Σάββατο, Κυριακή) ή ημερομηνίες (π.χ. 18/11/2026). Εκείνες τις μέρες δεν μπαίνει πουθενά.", "Σημείωση - ό,τι θέλεις να θυμάσαι (δεν επηρεάζει το πρόγραμμα)."], "numbered": false, "note": "Κάτω-κάτω γράφει αμέσως ποιες υπηρεσίες μπορεί ακόμα να κάνει. Αν γράψει «καμία», οι εξαιρέσεις είναι πολλές."}, {"title": "Πώς φτιάχνεις νέα υπηρεσία", "items": ["Άνοιξε - «Υπηρεσίες» και μετά «+ Νέα υπηρεσία» (ή «Από τις προτεινόμενες» για μία του εντύπου).", "Τίτλος - π.χ. ΣΚΟΠΟΣ ΑΠΟΘΗΚΗΣ. Αν έχει νούμερα (1ο, 2ο...), γράψ' το στο «Νούμερο».", "Ωράριο - διάλεξε έτοιμο (24ωρη, 3ωρες βάρδιες...) ή γράψε π.χ. 08:00-20:00, ή φτιάξε βάρδιες με «Από» / «Έως» και «+ Βάρδια». Από κάτω γράφει αν κατάλαβε το ωράριο.", "Άτομα και βαθμός - πόσοι τη φορά, και ποιος βαθμός την κάνει (π.χ. ΣΤΡ). Για δύο βαθμούς γράψε τους με κόμμα, π.χ. «ΔΝΕΑΣ, ΣΤΡ».", "Ένοπλη - τσέκαρέ το αν είναι ένοπλη, για να μη μπαίνουν άοπλοι.", "Ποιοι την κάνουν - «Όλοι του βαθμού» (με τη σειρά), «Σταθερό άτομο» (π.χ. στο ΚΨΜ μπαίνει πάντα ο ίδιος) ή «Μόνο από συγκεκριμένους» (διαλέγει μόνο ανάμεσα σε όσους τσεκάρεις).", "Στο έντυπο - «Στήλη εντύπου» (αριστερή ή δεξιά) και «Επικεφαλίδα»: πού θα τυπωθεί.", "Αποθήκευση - και είναι έτοιμη. Για να μη βγαίνει για λίγο καιρό, κάν' την ανενεργή αντί να τη σβήσεις."], "numbered": true}, {"title": "Πώς μοιράζει τις υπηρεσίες", "items": ["Γύρος - όλοι του ίδιου βαθμού κάνουν από μία υπηρεσία πριν ξαναμπεί κάποιος. Όταν κάνουν όλοι, ξεκινά νέος γύρος με τυχαία σειρά. Κάθε βαθμός έχει δικό του γύρο.", "Ξεκούραση - μία υπηρεσία τη μέρα το πολύ, μέρα παρά μέρα (δύο συνεχόμενες μόνο αν δεν φτάνουν τα άτομα), και όσο γίνεται χωρίς κολλητές βάρδιες.", "Ποικιλία - προσπαθεί να μην πιάνει κάποιος την ίδια υπηρεσία ξανά μέσα στην εβδομάδα, ώστε να περνούν όλοι από όλες.", "Ίσες ώρες - μοιράζει τις μεγάλες υπηρεσίες (24ωρες) σε όσους έχουν κάνει λιγότερες ώρες. Στο Άτομα.xlsx όσοι έχουν τις λιγότερες ώρες στον βαθμό τους φαίνονται με έντονα - αυτοί μπαίνουν πρώτοι.", "Ίδια υπηρεσία ξανά - επιτρέπεται όταν δεν φτάνουν τα άτομα. Τότε μπαίνει όποιος έχει τις λιγότερες ώρες.", "Σαββατοκύριακα (ΣΤΡ) - μπαίνουν πρώτα όσοι έχουν κάνει τα λιγότερα Σαββατοκύριακα.", "Δεν φτάνουν τα άτομα - αν μια μέρα δεν υπάρχει ελεύθερος, η θέση μένει κενή με «ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ». Αν στο σύνολο οι υπηρεσίες είναι περισσότερες από τα άτομα, όλοι ξαναμπαίνουν πιο συχνά με τη σειρά."], "numbered": false}, {"title": "Πρότυπο Excel (το έντυπο της μονάδας)", "items": ["Τι είναι - το άδειο Excel της μονάδας με τη φόρμα που θέλετε (διάταξη, σημειώσεις, υπογραφές). Το πρόγραμμα βγαίνει πάνω σε αυτό, ίδιο ακριβώς, με τα ονόματα στις θέσεις τους.", "Τι πρέπει να έχει - μια γραμμή επικεφαλίδας με «ΩΡΑΡΙΟ», «ΒΑΘΜΟΣ» και «ΟΝΟΜΑ» (ή «ΟΝΟΜΑΤΕΠΩΝΥΜΟ») για κάθε στήλη. Κάτω από αυτήν, κάθε γραμμή με τίτλο και ωράριο είναι μια υπηρεσία (ενωμένες γραμμές = περισσότερα άτομα).", "Πώς το βάζεις - κουμπί «Πρότυπο» και διαλέγεις το αρχείο. Γράφει ποιες υπηρεσίες βρήκε, ποιες είναι νέες και ποιες λείπουν, και πατάς «Χρήση».", "Ποιες γίνονται ενεργές - όσες βρει στο πρότυπο γίνονται ενεργές μόνες τους. Όσες δεν έχει μένουν προτεινόμενες (ανενεργές) και τις ενεργοποιείς μόνο αν τις θέλεις.", "Νέες υπηρεσίες - όσες προσθέτεις μετά στην εφαρμογή μπαίνουν μόνες τους στο Excel, κάτω από τις υπόλοιπες της ίδιας στήλης. Το πρότυπο δεν χρειάζεται να το αλλάξεις."], "numbered": false}, {"title": "Ιστορικό (Άτομα.xlsx)", "items": ["Τι γράφει - δίπλα σε κάθε όνομα πόσες και ποιες υπηρεσίες έκανε, τις ώρες, και αν έκανε στον τωρινό γύρο («ΕΚΑΝΕ») ή αν έρχεται η σειρά του («ΣΕΙΡΑ ΤΟΥ ΣΥΝΤΟΜΑ»).", "Ξανά οι ίδιες μέρες - αν ξαναβγάλεις μέρες που έχουν ήδη βγει, ρωτάει πρώτα και μετά τις αντικαθιστά.", "Κινητό και υπολογιστής - το ίδιο αρχείο ανοίγει και στα δύο: κατέβασέ το από το ένα και φόρτωσέ το στο άλλο («Ιστορικό» στο κινητό).", "Αντίγραφο - κράτα αντίγραφο. Στο κινητό τα στοιχεία μένουν μόνο σε αυτό το κινητό."], "numbered": false}, {"title": "Τι σημαίνουν τα μηνύματα", "items": ["ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ (κενή θέση) - εκείνη τη μέρα όσοι μπορούν να την κάνουν έχουν ήδη υπηρεσία ή εξαίρεση/άδεια, και κανείς δεν μπαίνει σε 2 υπηρεσίες. Συμπλήρωσέ τη με το χέρι, πρόσθεσε άτομα, λιγότερες εξαιρέσεις ή κλείσε κάποια υπηρεσία.", "Κανένας με αυτό τον βαθμό - δεν υπάρχει κανείς με αυτόν τον βαθμό στη λίστα. Άλλαξε τον βαθμό της υπηρεσίας ή πρόσθεσε άτομα.", "Κίτρινο όνομα / χαλάρωση - μπήκε επειδή δεν υπήρχε άλλος, π.χ. με λίγη ξεκούραση από την προηγούμενη βάρδια. Τις βλέπεις στις «Προειδοποιήσεις» (στο Excel: φύλλο Warnings).", "Δεν φτάνουν τα άτομα για μία μέρα (ΣΤΡ) - σε μία μέρα οι θέσεις των ΣΤΡ είναι περισσότερες από τους ΣΤΡ, οπότε κάποιες θέσεις μένουν κενές. Βγαίνει ίδιο στο ημερήσιο και στο εβδομαδιαίο.", "Ενημέρωση: 2 συνεχόμενες μέρες - μέρα παρά μέρα δεν έφταναν τα άτομα, οπότε κάποιοι μπήκαν 2 μέρες στη σειρά (με τη σειρά, πρώτα όσοι δεν είχαν ξαναμπεί). Είναι μόνο ενημέρωση, όχι λάθος."], "numbered": false}, {"title": "Νομικά, απόρρητο και ασφάλεια", "items": ["Ανεπίσημη εφαρμογή - δεν είναι επίσημη εφαρμογή του Ελληνικού Στρατού, του ΓΕΣ ή του Υπουργείου Εθνικής Άμυνας και δεν συνδέεται με αυτούς. Είναι βοήθημα για όποιον φτιάχνει το πρόγραμμα υπηρεσιών.", "Το πρόγραμμα είναι πρόταση - το ελέγχει και το εγκρίνει ο αρμόδιος (π.χ. ο Διοικητής) πριν εφαρμοστεί. Ισχύει ό,τι υπογράφεται, όχι ό,τι βγάζει η εφαρμογή.", "Χωρίς εγγύηση - η εφαρμογή δίνεται «ως έχει». Ο δημιουργός δεν ευθύνεται για λάθη στο πρόγραμμα, για χαμένα δεδομένα ή για τον τρόπο που χρησιμοποιείται.", "Τα δεδομένα μένουν στη συσκευή - ονόματα, βαθμοί, εξαιρέσεις και ιστορικό αποθηκεύονται μόνο στο κινητό ή στον υπολογιστή και στα Excel που κατεβάζεις. Η εφαρμογή δεν στέλνει τίποτα στο ίντερνετ: δεν έχει λογαριασμούς, διαφημίσεις ή στατιστικά. Με την απεγκατάσταση σβήνουν.", "Προσωπικά δεδομένα (GDPR) - τα ονόματα είναι προσωπικά δεδομένα. Υπεύθυνος για τη χρήση τους είναι η μονάδα και όποιος τα βάζει (Κανονισμός ΕΕ 2016/679, ν. 4624/2019). Βάλε μόνο ό,τι χρειάζεται για τις υπηρεσίες. ΜΗΝ γράφεις λόγους υγείας ή ιατρικά στοιχεία: γράψε μόνο «άοπλος», «όχι 24ωρες» κτλ.", "Ασφάλεια μονάδας - μη βάζεις διαβαθμισμένες πληροφορίες. Μη μοιράζεσαι τα Excel με τις υπηρεσίες εκτός μονάδας (π.χ. σε ανοιχτές ομάδες). Τήρησε τις εντολές της μονάδας για κινητά και αρχεία.", "Άδειες λογισμικού - η εφαρμογή χρησιμοποιεί ελεύθερο λογισμικό: ExcelJS (MIT, © 2014-2019 Guyon Roche), openpyxl (MIT), Python (PSF), AndroidX (Apache 2.0). Τα πλήρη κείμενα των αδειών είναι στο τέλος των Οδηγιών (κινητό) και στο ΑΔΕΙΕΣ.txt (υπολογιστής)."], "numbered": false}]};

  async function saveLocal(share) {

      window.webkit.messageHandlers.iosApp.postMessage({ name: pd.file.name, b64 });
      ui.pending = null; closeSheet(); pd.done(); return;
    }
    if (ANDROID) {
      const b64 = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(pd.file); });
      const res = share ? window.AndroidApp.shareFile(pd.file.name, b64, XLSX_TYPE) : window.AndroidApp.saveFile(pd.file.name, b64, XLSX_TYPE);
      if (String(res).startsWith("ERR")) { toast("Δεν αποθηκεύτηκε: " + String(res).slice(4)); return; }
      ui.pending = null; closeSheet(); if (!share) toast("Αποθηκεύτηκε στις Λήψεις: " + res); pd.done(); return;
    }
    if (pd.canShare) {
      try { await navigator.share({ files: [pd.file] }); }
      catch (e) { if (e && e.name === "AbortError") return; toast("Δεν αποθηκεύτηκε: " + (e.message || e)); return; }
    } else {
      const url = URL.createObjectURL(pd.file), a = document.createElement("a");
      a.href = url; a.download = pd.file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

  }

  function sections(v, d, list, q) {

      const seats = v.seats[d][p.idx] || [];
      const who = seats.map(s => {
        if (!s) return p.linkKind ? `<div class="linked">—</div>` : `<div class="empty">${p.noOne ? "κανένας " + esc(p.rank) : "δεν φτάνουν τα άτομα"}</div>`;
        const name = q && N(s.name).includes(q) ? `<mark>${esc(s.name)}</mark>` : esc(s.name);
        return `<div>${s.viol && s.viol.length ? '<span class="flag" title="χαλάρωση κανόνα"></span>' : ""}${name} <span class="badge rank">${esc(s.rank)}</span>${s.unarmed ? '<span class="badge">ΑΟΠΛΟΣ</span>' : ""}</div>`;
      }).join("");
      return `<div class="duty"><div class="what"><b>${esc(label)}</b><span class="mono">${esc(hours)}</span>${p.linkKind ? `<div class="hint">${esc(p.linkText)}</div>` : ""}</div><div class="who">${who}</div></div>`;
    }).join("")}</div>`).join("");
  }

  // ---- Ονόματα
  function viewNames() {
    const q = N(ui.nq);
    const list = S.people.filter(p => {
      if (ui.nf === "unarmed" && !(S.rules[p.name] || {}).unarmed) return false;
      if (ui.nf === "rules" && !hasRule(p.name)) return false;
      return !q || N(p.name).includes(q);
    });
    let out = exampleBanner("Αυτά είναι φανταστικά ονόματα για δοκιμή.");
    out += `<section class="panel stack" aria-labelledby="h-names">
      <div class="panel-head"><h2 id="h-names">Ονόματα & εξαιρέσεις</h2><span class="chip">${S.people.length} άτομα</span></div>
      <div class="row">
        <button class="btn primary" data-act="import-names">Άνοιξε Excel ονομάτων</button>
        <button class="btn" data-act="add-person">+ Όνομα</button>
        <button class="btn" data-act="dl-names-template" ${downloads ? "" : "disabled"}>⬇ Κενό Excel ονομάτων</button>
      </div>
      <div class="hint">Excel με στήλη «Ονοματεπώνυμο» και στήλη «Βαθμός» (ΣΤΡ, ΔΝΕΑΣ, ΕΠΧΙΑΣ…). Όποιος δεν έχει βαθμό θεωρείται ΣΤΡ. Πάτα ένα όνομα για εξαιρέσεις (άοπλος, όχι πρωινές/βραδινές, άδεια).</div>
      <div class="row">${ranksOf(S.people).map(([r, n]) => `<span class="chip">${esc(r)} ${n}</span>`).join("")}</div>
      <div class="row" role="group" aria-label="Φίλτρο">
        <button class="chip" data-act="nf" data-v="all" aria-pressed="${ui.nf === "all"}">Όλοι</button>
        <button class="chip" data-act="nf" data-v="unarmed" aria-pressed="${ui.nf === "unarmed"}">Άοπλοι (${unarmedCount()})</button>
        <button class="chip" data-act="nf" data-v="rules" aria-pressed="${ui.nf === "rules"}">Με εξαιρέσεις (${S.people.filter(p => hasRule(p.name)).length})</button>
      </div>
      <input type="search" id="nq" placeholder="Αναζήτηση ονόματος…" value="${esc(ui.nq)}" aria-label="Αναζήτηση ονόματος" autocomplete="off">
      <div class="list">`;
    let lastRank = null;
    list.slice().sort((a, b) => E.rankSort(a.rank) - E.rankSort(b.rank)).forEach(p => {
      const r = p.rank || E.CONFIG.defaultRank;
      if (r !== lastRank) { out += `<div class="group-title">${esc(r)}</div>`; lastRank = r; }
      const ex = exemptText(p.name);
      out += `<button class="item" data-act="edit-person" data-v="${esc(p.name)}"><div class="grow"><div class="t">${esc(p.name)} ${(S.rules[p.name] || {}).unarmed ? '<span class="badge">ΑΟΠΛΟΣ</span>' : ""}</div>
        <div class="s">${ex ? esc(ex) : "χωρίς εξαιρέσεις"}</div></div><span class="muted" aria-hidden="true">›</span></button>`;
    });
    if (!list.length) out += `<div class="hint">Κανένα όνομα εδώ.</div>`;
    out += `</div><details><summary class="muted">Περισσότερα</summary><div class="row" style="margin-top:8px">
      <button class="btn danger small" data-act="ask" data-v="empty-names">Κενή λίστα ονομάτων</button></div></details></section>`;
    return out;
  }

  /* the user's own empty form: status line + explanation (start panel and Υπηρεσίες tab) */
  function tplInfo() {
    const t = S.template;
    return `<div class="hint"><b>Πρότυπο Excel:</b> ανέβασε ένα άδειο Excel με τη φόρμα που θέλετε να είναι η διάταξη του προγράμματος.
      Κρατά τα σταθερά (διάταξη, σημειώσεις, υπογραφές). Τα ονόματα τα βάζει το πρόγραμμα, ανάλογα με τον βαθμό που επιτρέπει κάθε υπηρεσία.
      Υπηρεσίες που προσθέτεις εδώ στην εφαρμογή μπαίνουν μόνες τους στο Excel, κάτω από τις υπόλοιπες της ίδιας στήλης.</div>
      ${t ? `<div class="row"><span class="chip good">✓ Πρότυπο: ${esc(t.name)}</span><button class="btn small" data-act="ask" data-v="tpl-remove">Χωρίς πρότυπο</button></div>` : ""}`;
  }
  const b64 = { enc: buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
    dec: str => { const s = atob(str), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; } };
  function templateSheet(res, name, buf) {
    const r = res.report;
    ui.pendingTpl = { services: res.services, template: { name, b64: b64.enc(buf) } };
    openSheet(() => `<header><h2 id="sheet-title">Πρότυπο: ${esc(name)}</h2><button class="btn small" data-act="close">Άκυρο</button></header>
      <p style="margin:0">Βρέθηκαν <b>${r.found}</b> υπηρεσίες στο φύλλο «${esc(r.sheet)}».</p>
      ${r.added.length ? `<div class="notice"><b>Νέες (${r.added.length}):</b> ${esc(r.added.join(", "))}<br><span class="hint">Έλεγξε στις Υπηρεσίες τον βαθμό και τα άτομα τους.</span></div>` : ""}
      ${r.removed.length ? `<div class="notice"><b>Δεν υπάρχουν στο πρότυπο (${r.removed.length}) - γίνονται ανενεργές:</b> ${esc(r.removed.join(", "))}</div>` : ""}
      <div class="hint">Από εδώ και πέρα το Excel με τις υπηρεσίες βγαίνει πάνω σε αυτό το πρότυπο, με την ίδια διάταξη. Υπηρεσίες που θα προσθέσεις αργότερα στην εφαρμογή μπαίνουν μόνες τους κάτω από τις υπόλοιπες της στήλης τους.</div>
      <div class="row"><button class="btn primary" data-act="tpl-use">Χρήση προτύπου</button><button class="btn" data-act="close">Άκυρο</button></div>`);
  }

  // ---- Υπηρεσίες
  function whoText(s) {
    const fixed = E.splitNames(s.fixed), pool = E.splitNames(s.pool);
    return fixed.length ? "σταθερός: " + fixed.join(", ") : pool.length ? `μόνο από ${pool.length} άτομα` : (s.rank || "όλοι");
  }
  function viewServices() {
    const active = S.services.filter(s => s.active !== false && !s.link);
    const perDay = active.reduce((a, s) => a + (parseInt(s.needed, 10) || 0), 0);
    let out = `<section class="panel stack" aria-labelledby="h-svc">
      <div class="panel-head"><h2 id="h-svc">Υπηρεσίες & ωράρια</h2><span class="chip">${new Set(active.map(s => N(s.service))).size} υπηρεσίες · ${perDay} άτομα/ημέρα</span></div>
      <div class="row">
        <button class="btn primary" data-act="suggest">★ Από τις προτεινόμενες</button>
        <button class="btn" data-act="edit-svc" data-v="new">+ Νέα υπηρεσία</button>
        <button class="btn" data-act="tpl-upload">⬆ Πρότυπο Excel</button>
      </div>
      ${tplInfo()}
      <div class="hint">Όλες οι υπηρεσίες του εντύπου είναι εδώ ως <b>προτεινόμενες</b> (ανενεργές). Ενεργές γίνονται μόνο: όσες βρεθούν στο πρότυπο Excel που ανεβάζεις, ή όσες ενεργοποιήσεις εσύ με το <b>+</b>. Η σειρά εδώ είναι η σειρά στο έντυπο.</div>
      ${S.newDefaults ? `<div class="banner"><span>Υπάρχουν νέες προτεινόμενες υπηρεσίες (έντυπο 13/11). Η λίστα σου έχει αλλαγές, γι' αυτό δεν άλλαξε μόνη της.</span>
        <button class="btn small" data-act="ask" data-v="all-suggested">Βάλε τις νέες</button><button class="btn small" data-act="dismiss-new">Κράτα τη δική μου</button></div>` : ""}
      <div class="list">`;
    [1, 2].forEach(col => {
      const items = S.services.map((s, i) => [s, i]).filter(([s]) => (+s.col === 2 ? 2 : 1) === col);
      if (!items.length) return;
      out += `<div class="group-title">${col === 1 ? "Αριστερή στήλη εντύπου" : "Δεξιά στήλη εντύπου"}</div>`;
      items.forEach(([s, i]) => {
        const name = E.taskName({ service: s.service, post: s.post });
        const sub = s.link ? s.link : `${s.times || "χωρίς ωράριο"}`;
        out += `<div class="item" style="cursor:default"><button class="grow" data-act="edit-svc" data-v="${i}" style="all:unset;cursor:pointer;flex:1;min-width:0">
            <div class="t ${s.active === false ? "off" : ""}">${esc(name)} ${s.armed ? '<span class="badge">⚔ ένοπλη</span>' : ""}${s.active === false ? ' <span class="badge rank">προτεινόμενη</span>' : ""}</div>
            <div class="s"><span class="mono">${esc(sub)}</span> · ${esc(s.needed)} άτομα · ${esc(whoText(s))}${s.section ? " · " + esc(s.section) : ""}</div></button>
          <div class="mini">${`<button class="onoff ${s.active === false ? "" : "on"}" aria-pressed="${s.active !== false}" aria-label="${s.active === false ? "Ενεργοποίηση" : "Απενεργοποίηση"}" data-act="svc-toggle" data-v="${i}">${s.active === false ? "+" : "✓"}</button>`}<button aria-label="Πάνω" data-act="svc-up" data-v="${i}">▲</button><button aria-label="Κάτω" data-act="svc-down" data-v="${i}">▼</button></div></div>`;
      });
    });
    if (!S.services.length) out += `<div class="hint">Η λίστα είναι άδεια. Πρόσθεσε από τις προτεινόμενες ή νέα υπηρεσία.</div>`;
    out += `</div><details><summary class="muted">Περισσότερα</summary><div class="row" style="margin-top:8px">
      <button class="btn small" data-act="ask" data-v="all-suggested">Όλες οι προτεινόμενες</button>
      <button class="btn danger small" data-act="ask" data-v="empty-svc">Άδειασμα λίστας</button></div></details></section>
      <section class="panel stack" aria-labelledby="h-notes"><div class="panel-head"><h2 id="h-notes">Σημειώσεις εντύπου</h2></div>
      <div class="hint">Γραμμές που τυπώνονται κάτω από τις υπηρεσίες σε κάθε μέρα (μία ανά γραμμή).</div>
      <textarea id="notes" rows="4" style="width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)">${esc((S.notes || []).join("\n"))}</textarea>
      <div class="row"><button class="btn primary small" data-act="save-notes">Αποθήκευση σημειώσεων</button><button class="btn small" data-act="notes-default">Οι αρχικές</button></div></section>`;
    return out;
  }

  // ---- Οδηγίες (same text as the PC window and ΟΔΗΓΙΕΣ.txt - help_content.py)
  function viewHelp() {
    const H = window.HELP || { title: "Οδηγίες", sections: [] };
    const item = text => { const i = text.indexOf(" - "); return i > 0 && i <= 60 ? `<b>${esc(text.slice(0, i))}</b>: ${esc(text.slice(i + 3))}` : esc(text); };
    return `<section class="panel stack"><div class="panel-head"><h2>${esc(H.title)}</h2></div>
      <div class="hint">Με απλά λόγια, για όποιον το χρησιμοποιεί πρώτη φορά. Το ίδιο κείμενο υπάρχει και στο πρόγραμμα του υπολογιστή («Οδηγίες»).</div></section>` +
      H.sections.map(s => `<section class="panel stack help"><div class="panel-head"><h2>${esc(s.title)}</h2></div>
        ${s.intro ? `<p>${esc(s.intro)}</p>` : ""}
        ${s.items.length ? `<${s.numbered ? "ol" : "ul"}>${s.items.map(x => `<li>${item(x)}</li>`).join("")}</${s.numbered ? "ol" : "ul"}>` : ""}
        ${s.note ? `<div class="hint">${esc(s.note)}</div>` : ""}</section>`).join("") +
      (window.LICENSES ? `<section class="panel stack help"><details><summary><b>Άδειες λογισμικού (πλήρη κείμενα)</b></summary>
        <pre style="white-space:pre-wrap;font-size:11px;line-height:1.4;margin:8px 0 0">${esc(window.LICENSES)}</pre></details></section>` : "");
  }

  // ---- Ιστορικό
  function viewHistory() {
    const h = S.history;
    let out = exampleBanner("Το ιστορικό ξεκινά όταν βάλεις τα δικά σου ονόματα.");
    const served = new Set(h.served);
    const groups = new Map();
    S.people.forEach(p => { const g = E.rankKey(p.rank || "ΣΤΡ"); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(N(p.name)); });
    out += `<section class="panel stack" aria-labelledby="h-cyc"><div class="panel-head"><h2 id="h-cyc">Γύρος υπηρεσιών ανά βαθμό</h2>
      <span class="chip">${h.entries.length} υπηρεσίες${E.lastDate(h) ? " · έως " + esc(E.fmtDate(E.lastDate(h))) : ""}</span></div>
      <div class="hint">Σε κάθε γύρο κάνουν υπηρεσία όλοι του ίδιου βαθμού από μία φορά. Μετά ξεκινά νέος γύρος με τυχαία σειρά.</div>
      <div class="stack">${[...groups].sort((a, b) => E.rankSort(a[0]) - E.rankSort(b[0])).map(([g, ms]) => {
        const done = ms.filter(n => served.has(n)).length;
        return `<div><div class="row" style="justify-content:space-between"><b>${esc(g)}</b><span class="muted">γύρος ${E.historyCycle(h, g)} · έκαναν ${done}/${ms.length}</span></div>
          <div class="bar" role="img" aria-label="${done} από ${ms.length}"><i style="width:${ms.length ? Math.round(100 * done / ms.length) : 0}%"></i></div></div>`;
      }).join("")}</div></section>`;
    const by = new Map();
    h.entries.forEach(e => { const k = N(e.worker); if (!by.has(k)) by.set(k, []); by.get(k).push(e); });
    const svcs = [...new Set(S.services.filter(s => s.active !== false && !s.link).map(s => s.service))];
    const q = N(ui.hq);
    const rows = S.people.filter(p => !q || N(p.name).includes(q)).sort((a, b) => E.rankSort(a.rank) - E.rankSort(b.rank) || a.name.localeCompare(b.name));
    out += `<section class="panel stack" aria-labelledby="h-ppl"><div class="panel-head"><h2 id="h-ppl">Πόσες και ποιες υπηρεσίες</h2></div>
      <div class="hint">Με <b>έντονα</b>: όσοι έχουν τις λιγότερες ώρες στον βαθμό τους. Αυτοί μπαίνουν πρώτοι, για να βγαίνουν ίσες οι ώρες.</div>
      <input type="search" id="hq" placeholder="Αναζήτηση ονόματος…" value="${esc(ui.hq)}" aria-label="Αναζήτηση ονόματος" autocomplete="off">
      <div class="tablewrap"><table><thead><tr><th>Ονοματεπώνυμο</th><th>Βαθμός</th><th class="num">Σύνολο</th><th class="num">Ώρες</th>${svcs.map(s => `<th class="num">${esc(s)}</th>`).join("")}<th>Γύρος</th><th>Τελευταία</th></tr></thead><tbody>`;
    const behind = X && X.fewestHours ? X.fewestHours(h, S.people, S.rules) : new Set();
    rows.forEach(p => {
      const ents = by.get(N(p.name)) || [];
      const hrs = Math.round(ents.reduce((a, e) => a + (+e.hours || 0), 0) * 10) / 10;
      const bold = behind.has(N(p.name));
      const cnt = {}; ents.forEach(e => { cnt[e.service] = (cnt[e.service] || 0) + 1; });
      const done = served.has(N(p.name));
      out += `<tr class="click" data-act="hist-open" data-v="${esc(p.name)}"><td>${bold ? `<b>${esc(p.name)}</b>` : esc(p.name)}${(S.rules[p.name] || {}).unarmed ? ' <span class="badge">ΑΟΠΛΟΣ</span>' : ""}</td><td>${esc(p.rank)}</td>
        <td class="num">${ents.length}</td><td class="num">${bold ? `<b>${hrs}</b>` : hrs}</td>${svcs.map(s => `<td class="num ${cnt[s] ? "" : "zero"}">${cnt[s] || 0}</td>`).join("")}
        <td>${done ? '<span class="chip good">έκανε</span>' : '<span class="chip warn">σειρά του σύντομα</span>'}</td><td class="mono">${ents.length ? esc(E.fmtDate(ents[ents.length - 1].date)) : "—"}</td></tr>`;
      if (ui.open === p.name) out += `<tr><td colspan="${6 + svcs.length}" style="white-space:normal">${ents.length ? ents.map(e => `<div><span class="mono">${esc(E.fmtDate(e.date, false))}</span> ${esc(e.task)}</div>`).join("") : '<span class="muted">Καμία υπηρεσία ακόμα.</span>'}</td></tr>`;
    });
    out += `</tbody></table></div><div class="hint">Πάτα ένα όνομα για να δεις ποιες υπηρεσίες έκανε.</div></section>
      <section class="panel stack" aria-labelledby="h-files"><div class="panel-head"><h2 id="h-files">Αρχείο Άτομα.xlsx</h2></div>
      <div class="hint">Το ιστορικό μένει μόνο σε αυτό το κινητό. Κατέβαζε το Άτομα.xlsx για ασφάλεια. Το ίδιο αρχείο ανοίγει και το πρόγραμμα του υπολογιστή, οπότε μπορείς να συνεχίζεις όπου θέλεις.</div>
      <div class="row"><button class="btn primary" data-act="dl-history" ${downloads && !S.example ? "" : "disabled"}>⬇ Κατέβασε Άτομα.xlsx</button>
        <button class="btn" data-act="import-history">Φόρτωσε Άτομα.xlsx από το PC</button></div>
      <details><summary class="muted">Περισσότερα</summary><div class="row" style="margin-top:8px"><button class="btn danger small" data-act="ask" data-v="empty-history">Διαγραφή ιστορικού</button></div></details></section>`;
    return out;
  }

  // ------------------------------------------------------------------ overlay sheets (editors, confirmations)
  function renderLayer() {
    const L = $("#layer");
    if (!ui.sheet) { L.innerHTML = ""; return; }
    L.innerHTML = `<div class="overlay" data-act="close-bg"><div class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${ui.sheet()}</div></div>`;
    const first = L.querySelector("input, select, button.btn");
    if (first && !ui.sheetFocused) { first.focus(); ui.sheetFocused = true; }
  }
  function openSheet(fn) { ui.sheet = fn; ui.sheetFocused = false; renderLayer(); }
  function closeSheet() { ui.sheet = null; ui.edit = null; renderLayer(); }

  const ASKS = {
    "empty-names": ["Κενή λίστα ονομάτων;", "Σβήνονται όλα τα ονόματα, οι εξαιρέσεις και το ιστορικό από αυτό το κινητό.", () => {
      S.people = []; S.rules = {}; S.example = false; S.history = E.emptyHistory(); S.view = null; ui.start = null; }],
    "all-suggested": ["Όλες οι προτεινόμενες;", "Η λίστα υπηρεσιών αντικαθίσταται με όλες τις υπηρεσίες του εντύπου, όλες ανενεργές (προτεινόμενες). Ενεργοποιείς όσες θέλεις ή ανεβάζεις το πρότυπο.", () => { S.services = suggestedOff(); S.newDefaults = false; }],
    "tpl-remove": ["Χωρίς πρότυπο;", "Το Excel θα βγαίνει με τη μορφή της εφαρμογής. Οι υπηρεσίες μένουν όπως είναι.", () => { S.template = null; }],
    "empty-svc": ["Άδειασμα λίστας υπηρεσιών;", "Σβήνονται όλες οι υπηρεσίες για να βάλεις μόνο δικές σου.", () => { S.services = []; }],
    "empty-history": ["Διαγραφή ιστορικού;", "Σβήνονται όλες οι υπηρεσίες που έχουν γίνει και οι γύροι ξεκινούν από την αρχή. Κατέβασε πρώτα το Άτομα.xlsx αν το χρειάζεσαι.",
      () => { S.history = E.emptyHistory(); S.view = null; ui.start = null; }],
  };
  function askSheet(key) {
    const [title, text] = ASKS[key];
    openSheet(() => `<header><h2 id="sheet-title">${esc(title)}</h2></header><p style="margin:0">${esc(text)}</p>
      <div class="row"><button class="btn danger" data-act="ask-yes" data-v="${key}">Ναι</button><button class="btn" data-act="close">Άκυρο</button></div>`);
  }

  // ---- person editor
  function personSheet(name) {
    const isNew = name === null;
    const p = isNew ? { name: "", rank: "ΣΤΡ" } : S.people.find(x => x.name === name);
    const r = clone(isNew ? {} : (S.rules[name] || {}));
    ui.edit = { orig: name, name: p.name, rank: p.rank || "ΣΤΡ", r };
    openSheet(() => {
      const e = ui.edit, rr = e.r;
      const shiftsSet = new Set(E.splitList(rr.shifts).map(N));
      const other = E.splitList(rr.shifts).filter(t => !E.SHIFT_WINDOWS[N(t)]).join(", ");
      const tasks = new Set(E.splitList(rr.tasks).map(N));
      const own = [...new Set(S.services.filter(s => s.active !== false && !s.link && (!s.rank || E.rankSet(s.rank).has(E.rankKey(e.rank)))).map(s => s.service))];

  function readPersonForm() {
    const e = ui.edit;
    e.name = $("#p-name").value.trim(); e.rank = $("#p-rank").value.trim() || "ΣΤΡ";
    const shifts = [...document.querySelectorAll("[data-shift]")].filter(x => x.checked).map(x => x.dataset.shift);
    const other = $("#p-hours").value.trim();
    if (other) shifts.push(other);
    e.r = { unarmed: $("#p-unarmed").checked, no24h: $("#p-no24").checked, shifts: shifts.join(", "),
      tasks: [...document.querySelectorAll("[data-task]")].filter(x => x.checked).map(x => x.dataset.task).join(", "),

      note: $("#p-note").value.trim() };

  function updatePersonPreview() {
    const box = $("#p-preview");
    if (!box) return;
    const e = readPersonForm();
    const away = $("#p-away");
    if (away) {
      const part = (label, v, credit) => {
        if (!v) return "";
        const rng = E.parseRanges(v, today());
        if (!rng.length) return `${label}: ⚠ δεν κατάλαβα τις ημερομηνίες`;
        const days = rng.reduce((a, [f, t]) => a + E.diffDays(t, f) + 1, 0);
        const txt = `${label}: ${days} μέρες (${rng.map(([f, t]) => E.fmtDate(f, false) + "-" + E.fmtDate(t, false)).join(", ")})`;
        return credit ? `${txt} = μετράει σαν ${Math.round(days * E.CONFIG.detachedPerWeek / 7 * 10) / 10} υπηρεσίες` : txt;
      };
      away.textContent = [part("Άδεια", e.r.leave, false), part("Απόσπαση", e.r.detached, true)].filter(Boolean).join(" · ");
    }
    let ps; try { ps = E.buildPosts(S.services); } catch (err) { box.textContent = err.message; return; }
    const own = ps.filter(p => !p.linkKind && (!p.rank || E.rankSet(p.rank).has(E.rankKey(e.rank))));
    const w = E.buildWorkers([{ name: e.name || "?", rank: e.rank }], { [e.name || "?"]: e.r }, ps, today())[0];
    const ok = own.filter(p => E.postAllowed(w, p));
    box.className = "preview" + (own.length && !ok.length ? " bad" : "");
    box.textContent = !own.length ? "Δεν υπάρχει καμία υπηρεσία για αυτόν τον βαθμό στη λίστα."
      : !ok.length ? "⚠ Με αυτές τις εξαιρέσεις δεν μπορεί να κάνει καμία υπηρεσία!"
      : `Μπορεί να κάνει ${ok.length} από ${own.length} υπηρεσίες: ${[...new Set(ok.map(p => p.task))].join(", ")}`;
  }

        <div class="preview" id="s-check"></div>

          <label class="field" style="flex:1;min-width:140px" for="s-rank">Βαθμός<input type="text" id="s-rank" list="ranks2" value="${esc(x.rank)}"></label></div>
        <datalist id="ranks2">${E.RANK_ORDER.map(r => `<option value="${r}">`).join("")}<option value="Μ ΛΧΙΑΣ"></datalist>
        <div><label class="check"><input type="checkbox" id="s-active" ${x.active !== false ? "checked" : ""}> Ενεργή (βγαίνει στο πρόγραμμα)</label>
          <label class="check"><input type="checkbox" id="s-armed" ${x.armed ? "checked" : ""}> Ένοπλη (όχι για άοπλους)</label>

          <label class="field" style="flex:2;min-width:160px" for="s-section">Επικεφαλίδα<input type="text" id="s-section" list="sections" value="${esc(x.section)}"></label></div>

  /* «Ποιοι την κάνουν»: everyone of the rank / always the same person / only some chosen names */
  function whoBlock() {
    const w = ui.edit.who, x = ui.edit.s;
    const modes = [["all", "Όλοι του βαθμού"], ["fixed", "Σταθερό άτομο"], ["pool", "Μόνο από συγκεκριμένους"]];
    let out = `<fieldset style="border:1px solid var(--line);border-radius:10px;padding:8px 12px"><legend class="muted" style="font-size:13px">Ποιοι την κάνουν</legend>
      <div class="seg" role="group" aria-label="Ποιοι την κάνουν">${modes.map(([k, l]) =>
        `<button type="button" data-act="who-mode" data-v="${k}" aria-pressed="${w.mode === k}">${l}</button>`).join("")}</div>`;
    if (w.mode === "all") return out + `<div class="hint" style="margin-top:6px">Μπαίνουν με τη σειρά όλοι όσοι έχουν τον βαθμό${x.rank ? " " + esc(x.rank) : ""}.</div></fieldset>`;
    const lim = w.mode === "fixed" ? Math.max(1, +x.needed || 1) : 0;
    out += `<div class="hint" style="margin:6px 0">${w.mode === "fixed"
      ? `Μπαίνει πάντα ο ίδιος${lim > 1 ? ` (έως ${lim})` : ""} και δεν μπαίνει σε άλλες υπηρεσίες. Αν λείπει, μπαίνει άλλος με τη σειρά.`
      : "Διαλέγει μόνο ανάμεσα σε αυτούς, όποιον βαθμό κι αν έχουν."}</div>
      <input type="search" id="who-q" placeholder="Αναζήτηση ονόματος…" autocomplete="off" aria-label="Αναζήτηση ονόματος">
      <div class="hint" id="who-n" style="margin:6px 0">Επιλεγμένοι: ${w.sel.size}${lim ? " / " + lim : ""}</div>
      <div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 8px">`;
    let last = null;
    S.people.slice().sort((a, b) => E.rankSort(a.rank) - E.rankSort(b.rank) || a.name.localeCompare(b.name)).forEach(pp => {
      if (pp.rank !== last) { out += `<div class="group-title" data-grp="1">${esc(pp.rank || "ΣΤΡ")}</div>`; last = pp.rank; }
      out += `<label class="check" data-name="${esc(N(pp.name))}"><input type="checkbox" data-who="${esc(pp.name)}" ${w.sel.has(N(pp.name)) ? "checked" : ""}> ${esc(pp.name)}</label>`;
    });
    if (!S.people.length) out += `<div class="hint">Δεν υπάρχουν ονόματα ακόμα.</div>`;
    return out + `</div></fieldset>`;
  }
  function readSvcForm() {
    const x = ui.edit.s;
    x.service = $("#s-service").value.trim(); x.post = $("#s-post").value.trim(); x.times = $("#s-times").value.trim();
    x.needed = Math.max(1, parseInt($("#s-needed").value, 10) || 1); x.rank = $("#s-rank").value.trim();
    x.active = $("#s-active").checked; x.armed = $("#s-armed").checked; x.col = +$("#s-col").value;
    if ($("#s-wk3")) x.weekend3 = $("#s-wk3").checked;
    x.section = $("#s-section").value.trim(); x.link = $("#s-link").value.trim();
    ui.edit.from = $("#s-from").value; ui.edit.to = $("#s-to").value;
    const w = ui.edit.who, names = S.people.map(pp => pp.name).filter(n => w.sel.has(N(n)));
    x.fixed = w.mode === "fixed" ? names.slice(0, Math.max(1, x.needed)).join(", ") : "";
    x.pool = w.mode === "pool" ? names.join(", ") : "";
    return x;
  }
  function updateSvcCheck() {
    const box = $("#s-check");
    if (!box) return;
    const x = readSvcForm();
    let text, bad = false;
    if (x.link && !x.times) text = "Συνδεδεμένη θέση: δεν χρειάζεται ωράριο.";
    else if (!x.times) text = "Γράψε ωράριο, διάλεξε έτοιμο ή πρόσθεσε βάρδιες με «+ Βάρδια».";
    else if (/ΕΒΔΟΜΑΔ|WEEK/.test(N(x.times))) text = "✓ Εβδομαδιαία: ο ίδιος άνθρωπος Δευτέρα-Κυριακή.";
    else {
      try {
        const t = E.parseTimes(x.times);
        text = `✓ ${t.labels.length} βάρδιες, σύνολο ${t.intervals.reduce((a, [s, e]) => a + e - s, 0) / 60} ώρες: ${t.labels.join(" / ")}`;
      } catch (e) { text = "✗ Δεν καταλαβαίνω το ωράριο. Γράψε π.χ. 06:00-09:00, 15:00-18:00 ή 24ΩΡΗ"; bad = true; }
    }
    box.className = "preview" + (bad ? " bad" : ""); box.textContent = text;
  }

  function suggestSheet() {
    const have = new Set(S.services.filter(r => r.active !== false).map(r => N(r.service) + "|" + N(r.post)));
    const off = new Set(S.services.filter(r => r.active === false).map(r => N(r.service) + "|" + N(r.post)));
    openSheet(() => `<header><h2 id="sheet-title">Προτεινόμενες υπηρεσίες</h2><button class="btn small" data-act="close">Κλείσιμο</button></header>
      <div class="hint">Οι υπηρεσίες της Συγκεντρωτικής Κατάστασης. Τσέκαρε όσες θέλεις να γίνουν ενεργές.</div>
      <div class="row"><button class="btn small" data-act="sugg-missing">Επιλογή όσων λείπουν</button></div>
      <div class="list">${E.SUGGESTED.map((r, i) => {
        const h = have.has(N(r.service) + "|" + N(r.post));

          <span><b>${esc(E.taskName(r))}</b>${h ? ' <span class="badge rank">ενεργή</span>' : off.has(N(r.service) + "|" + N(r.post)) ? ' <span class="badge rank">προτεινόμενη</span>' : ""}<br><span class="hint mono">${esc(r.link || r.times)} · ${r.needed} · ${esc(r.rank)}${r.armed ? " · ⚔" : ""}</span></span></label>`;

      <div class="row"><button class="btn primary" data-act="sugg-add">Προσθήκη επιλεγμένων</button></div>`);
