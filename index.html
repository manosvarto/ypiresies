<style>
/* Layout: phone-first app shell - sticky title bar, one column of panels, bottom tab bar (top tabs on wide screens).
   Army colours: olive bar, khaki/sand page, gold in the dark theme; rust-orange for what needs attention. */
:root {
  --bg: #ECEADF; --surface: #FCFBF6; --surface-2: #F3F1E7; --ink: #1E2318; --muted: #62685A; --line: #D7D3C2;
  --accent: #4B5320; --accent-ink: #FFFFFF; --accent-soft: #E3E5CF; --orange: #A3561C; --orange-soft: #F5E3D0;
  --good: #3D7533; --good-soft: #E2EED9; --bad: #B3261E; --bad-soft: #F8DEDA; --warn: #8A5F00; --warn-soft: #F7ECCB;
  --bar: #3A4220; --bar-ink: #FFFFFF; --bar-sub: #D8CB8C; --shadow: 0 1px 2px rgba(30, 35, 24, .07), 0 2px 8px rgba(30, 35, 24, .06);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11130C; --surface: #1A1D13; --surface-2: #22261A; --ink: #E9E7DA; --muted: #A5A78F; --line: #33382A;
  --accent: #C9A94A; --accent-ink: #14160E; --accent-soft: #37361E; --orange: #E3A365; --orange-soft: #45301A;
  --good: #8FC67F; --good-soft: #213320; --bad: #F08A80; --bad-soft: #4A201C; --warn: #E8C25E; --warn-soft: #3F3413;
  --bar: #252A16; --bar-ink: #FFFFFF; --bar-sub: #CBBE82; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11130C; --surface: #1A1D13; --surface-2: #22261A; --ink: #E9E7DA; --muted: #A5A78F; --line: #33382A;
  --accent: #C9A94A; --accent-ink: #14160E; --accent-soft: #37361E; --orange: #E3A365; --orange-soft: #45301A;
  --good: #8FC67F; --good-soft: #213320; --bad: #F08A80; --bad-soft: #4A201C; --warn: #E8C25E; --warn-soft: #3F3413;
  --bar: #252A16; --bar-ink: #FFFFFF; --bar-sub: #CBBE82; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; -webkit-text-size-adjust: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* title bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { width: 40px; height: 40px; flex: none; border-radius: 9px; }
.top h1 { font-size: 19px; font-weight: 700; }
.top p { margin: 0; font-size: 12px; color: var(--bar-sub); }
.top .grow { flex: 1; min-width: 0; }
.icon-btn { background: transparent; border: 1px solid rgba(255,255,255,.35); color: var(--bar-ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.icon-btn:focus-visible { outline: 2px solid var(--bar-sub); outline-offset: 2px; }
.tabs-top { display: none; gap: 4px; }
.tabs-top a { color: var(--bar-sub); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.tabs-top a[aria-current="page"] { background: rgba(255,255,255,.14); color: var(--bar-ink); }

/* bottom tab bar (phones) */
.tabs-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-bottom a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 2px; border-radius: 10px; }
.tabs-bottom a svg { width: 22px; height: 22px; }
.tabs-bottom a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main { padding-block: 16px 8px; display: grid; gap: 14px; }
/* the author's line: very top (in the title bar) and very bottom of the app - never in the Excel files */
.author { text-align: center; font: 700 11px/1.3 var(--font); letter-spacing: .06em; color: var(--bar-sub); padding: 4px 16px 0; }
.author-bottom { color: var(--muted); padding: 10px 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) {
  .tabs-top { display: flex; } .tabs-bottom { display: none; } main { padding-block: 20px 8px; } .author-bottom { padding-bottom: 24px; }
}

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 17px; font-weight: 700; color: var(--accent); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.grid2 { display: grid; gap: 14px; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; padding: 14px; font-size: 17px; border-radius: 12px; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 15px; }
.check { display: flex; gap: 10px; align-items: center; padding: 8px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border: 0; white-space: nowrap; }
.chip.warn { background: var(--orange-soft); color: var(--orange); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
button.chip { cursor: pointer; }
.rank-splits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rank-split { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.rank-split b { font-size: 14px; }
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; padding: 1px 6px; background: var(--orange-soft); color: var(--orange); white-space: nowrap; }
.badge.rank { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); letter-spacing: .02em; }

.banner { border-radius: var(--r); padding: 12px 14px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.notice { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border-left: 4px solid var(--warn); font-size: 14px; }
.notice.err { border-left-color: var(--bad); }
.swapnote { font-size: 12px; color: var(--muted); white-space: normal; overflow-wrap: anywhere; margin-top: 2px; }
.swapbtn { margin-left: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); border-radius: 8px; padding: 0 8px; min-height: 26px; font-weight: 700; cursor: pointer; }
.notice.info { border-left-color: var(--accent); color: var(--muted); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat span { font-size: 12px; color: var(--muted); }
.stat.good b { color: var(--good); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }

/* day roster */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.days button { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; cursor: pointer; text-align: center; }
.days button b { display: block; font-size: 15px; }
.days button span { font-size: 11.5px; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.days button[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.sheet { display: grid; gap: 14px; }
@media (min-width: 860px) { .sheet.two { grid-template-columns: 1fr 1fr; align-items: start; } }
.sec { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sec h3 { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); padding: 7px 12px; border-bottom: 1px solid var(--line); }
.duty { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
.sec h3 + .duty, .sec .duty:first-child { border-top: 0; }
.duty .what b { display: block; font-size: 14px; }
.duty .what .mono { font-size: 12px; color: var(--muted); white-space: pre-line; }
.who { display: grid; gap: 4px; align-content: start; }
.who div { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.who .empty { color: var(--bad); font-weight: 600; }
.who .linked { color: var(--muted); font-weight: 500; font-size: 13px; }
.who .flag { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
mark { background: var(--warn-soft); color: inherit; border-radius: 4px; padding: 0 2px; }

/* lists */
.list { display: grid; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.item .off { opacity: .5; }
.group-title { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 12px 4px 4px; }
.mini { display: flex; gap: 4px; }
.mini button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.mini button.onoff { font-weight: 700; color: var(--accent); }
.mini button.onoff.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; position: sticky; top: 0; }
td.num, th.num { text-align: center; font-variant-numeric: tabular-nums; }
td.zero { color: var(--line); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* editor sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(12, 14, 8, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheetbox { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
@media (min-width: 760px) { .overlay { align-items: center; } .sheetbox { border-radius: 16px; } }
.sheetbox header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheetbox h2 { font-size: 18px; color: var(--accent); }
.preview { font-size: 13.5px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
.preview.bad { background: var(--bad-soft); color: var(--bad); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(520px, calc(100vw - 32px)); overflow-wrap: anywhere; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
@media (min-width: 760px) { .toast { bottom: 24px; } }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -3px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
details summary { cursor: pointer; font-weight: 600; }
.hint { font-size: 12.5px; color: var(--muted); }
.help ol, .help ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.help p { margin: 0; }
.help li::marker { color: var(--accent); font-weight: 700; }
</style>

\u03bd \u03ad\u03c7\u03b5\u03b9 \u03b2\u03b1\u03b8\u03bc\u03cc \u03b8\u03b5\u03c9\u03c1\u03b5\u03af\u03c4\u03b1\u03b9 \u03a3\u03a4\u03a1. \u039c\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03ba\u03b1\u03b9 \u03bd\u03b1 \u03b3\u03c1\u03ac\u03c8\u03b5\u03b9\u03c2 \u03bf\u03bd\u03cc\u03bc\u03b1\u03c4\u03b1 \u03ad\u03bd\u03b1-\u03ad\u03bd\u03b1.","\u03a5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 - \u038c\u03bb\u03b5\u03c2 \u03bf\u03b9 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03c4\u03bf\u03c5 \u03b5\u03bd\u03c4\u03cd\u03c0\u03bf\u03c5 \u03c5\u03c0\u03ac\u03c1\u03c7\u03bf\u03c5\u03bd \u03c9\u03c2 \xab\u03c0\u03c1\u03bf\u03c4\u03b5\u03b9\u03bd\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2\xbb, \u03b1\u03bb\u03bb\u03ac \u03be\u03b5\u03ba\u03b9\u03bd\u03bf\u03cd\u03bd \u03b1\u03bd\u03b5\u03bd\u03b5\u03c1\u03b3\u03ad\u03c2. \u0391\u03bd\u03ad\u03b2\u03b1\u03c3\u03b5 \u03c4\u03bf \u03ac\u03b4\u03b5\u03b9\u03bf \u03ad\u03bd\u03c4\u03c5\u03c0\u03bf \u03c4\u03b7\u03c2 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1\u03c2 \u03c3\u03b1\u03bd \xab\u03a0\u03c1\u03cc\u03c4\u03c5\u03c0\u03bf\xbb \u03ba\u03b1\u03b9 \u03b5\u03bd\u03b5\u03c1\u03b3\u03bf\u03c0\u03bf\u03b9\u03bf\u03cd\u03bd\u03c4\u03b1\u03b9 \u03bc\u03cc\u03bd\u03b5\u03c2 \u03c4\u03bf\u03c5\u03c2 \u03cc\u03c3\u03b5\u03c2 \u03ad\u03c7\u03b5\u03b9. \u0389 \u03b5\u03bd\u03b5\u03c1\u03b3\u03bf\u03c0\u03bf\u03af\u03b7\u03c3\u03b5 \u03b5\u03c3\u03cd \u03cc\u03c3\u03b5\u03c2 \u03b8\u03ad\u03bb\u03b5\u03b9\u03c2 (\u03c4\u03bf \xab+\xbb \u03c3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc, \u03ba\u03bb\u03b9\u03ba \u03c3\u03c4\u03bf \u2610 \u03c3\u03c4\u03bf\u03bd \u03c5\u03c0\u03bf\u03bb\u03bf\u03b3\u03b9\u03c3\u03c4\u03ae), \u03ae \u03cc\u03bb\u03b5\u03c2 \u03bc\u03b1\u03b6\u03af \u03bc\u03b5 \xab\u2713 \u0395\u03c0\u03b9\u03bb\u03bf\u03b3\u03ae \u03cc\u03bb\u03c9\u03bd\xbb (\xab\u039a\u03b1\u03bc\u03af\u03b1\xbb \u03c4\u03b9\u03c2 \u03ba\u03ac\u03bd\u03b5\u03b9 \u03cc\u03bb\u03b5\u03c2 \u03b1\u03bd\u03b5\u03bd\u03b5\u03c1\u03b3\u03ad\u03c2). \u038c\u03c3\u03b5\u03c2 \u03ad\u03c7\u03bf\u03c5\u03bd \u03bd\u03bf\u03cd\u03bc\u03b5\u03c1\u03b1 (\u03c0.\u03c7. \u039a\u03b5\u03bd\u03c4\u03c1\u03b9\u03ba\u03ae \u03a0\u03cd\u03bb\u03b7, \u03a0\u03b5\u03c1\u03af\u03c0\u03bf\u03bb\u03bf) \u03b5\u03af\u03bd\u03b1\u03b9 \u03bc\u03af\u03b1 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ae: \u03c4\u03b7\u03bd \u03b1\u03bd\u03bf\u03af\u03b3\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03b2\u03bb\u03ad\u03c0\u03b5\u03b9\u03c2 \u03ba\u03ac\u03b8\u03b5 \u03bd\u03bf\u03cd\u03bc\u03b5\u03c1\u03bf \u03bc\u03b5 \u03c4\u03b9\u03c2 \u03ce\u03c1\u03b5\u03c2 \u03c4\u03bf\u03c5. \u039c\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03ba\u03b1\u03b9 \u03bd\u03b1 \u03c6\u03c4\u03b9\u03ac\u03be\u03b5\u03b9\u03c2 \u03bd\u03ad\u03b5\u03c2 (\u03b4\u03b5\u03c2 \xab\u03a0\u03ce\u03c2 \u03c6\u03c4\u03b9\u03ac\u03c7\u03bd\u03b5\u03b9\u03c2 \u03bd\u03ad\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1\xbb).","\u0395\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2 - \u0393\u03b9\u03b1 \u03cc\u03c0\u03bf\u03b9\u03bf\u03bd \u03c7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9: \u03ac\u03bf\u03c0\u03bb\u03bf\u03c2, \u03cc\u03c7\u03b9 \u03c0\u03c1\u03c9\u03b9\u03bd\u03ad\u03c2 \u03ae \u03b2\u03c1\u03b1\u03b4\u03b9\u03bd\u03ad\u03c2, \u03cc\u03c7\u03b9 24\u03c9\u03c1\u03b5\u03c2, \u03ac\u03b4\u03b5\u03b9\u03b1, \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03b4\u03b5\u03bd \u03ba\u03ac\u03bd\u03b5\u03b9 (\u03b4\u03b5\u03c2 \xab\u03a0\u03ce\u03c2 \u03b4\u03bf\u03c5\u03bb\u03b5\u03cd\u03bf\u03c5\u03bd \u03bf\u03b9 \u03b5\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2\xbb).","\u0392\u03b3\u03ac\u03bb\u03b5 \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 - \u0394\u03b9\u03ac\u03bb\u03b5\u03be\u03b5 \xab\u0397\u03bc\u03b5\u03c1\u03ae\u03c3\u03b9\u03bf\xbb \u03ae \xab\u0395\u03b2\u03b4\u03bf\u03bc\u03b1\u03b4\u03b9\u03b1\u03af\u03bf\xbb \u03ba\u03b1\u03b9 \u03b1\u03c0\u03cc \u03c0\u03bf\u03b9\u03b1 \u03bc\u03ad\u03c1\u03b1, \u03ba\u03b1\u03b9 \u03c0\u03ac\u03c4\u03b1 \xab\u0392\u03b3\u03ac\u03bb\u03b5 \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1\xbb. \u039a\u03b1\u03c4\u03ad\u03b2\u03b1\u03c3\u03b5 \u03c4\u03bf Excel \u03bc\u03b5 \u03c4\u03b9\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03c4\u03bf \u03c4\u03c5\u03c0\u03ce\u03c3\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03ba\u03c1\u03ac\u03c4\u03b1 \u03c4\u03bf \u0386\u03c4\u03bf\u03bc\u03b1.xlsx."],numbered:!0,note:"\u03a4\u03b7\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03b7 \u03c6\u03bf\u03c1\u03ac \u03c3\u03c5\u03bd\u03b5\u03c7\u03af\u03b6\u03b5\u03b9 \u03bc\u03cc\u03bd\u03bf \u03c4\u03bf\u03c5 \u03b1\u03c0\u03cc \u03c4\u03b7\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03b7 \u03bc\u03ad\u03c1\u03b1, \u03bc\u03b5 \u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac \u03c0\u03bf\u03c5 \u03ad\u03bc\u03b5\u03b9\u03bd\u03b5."},{title:"\u039a\u03b1\u03bd\u03cc\u03bd\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03b4\u03b5\u03bd \u03c3\u03c0\u03ac\u03bd\u03b5 \u03c0\u03bf\u03c4\u03ad",items:["\u039c\u03af\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c4\u03b7 \u03bc\u03ad\u03c1\u03b1 - \u03ba\u03b1\u03bd\u03b5\u03af\u03c2 \u03b4\u03b5\u03bd \u03c0\u03b1\u03af\u03c1\u03bd\u03b5\u03b9 2 \u03b4\u03b9\u03b1\u03c6\u03bf\u03c1\u03b5\u03c4\u03b9\u03ba\u03ad\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03c4\u03b7\u03bd \u03af\u03b4\u03b9\u03b1 \u03bc\u03ad\u03c1\u03b1. \u0391\u03bd \u03b4\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1, \u03b7 \u03b8\u03ad\u03c3\u03b7 \u03bc\u03ad\u03bd\u03b5\u03b9 \u03ba\u03b5\u03bd\u03ae \u03ba\u03b1\u03b9 \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9 \xab\u0394\u0395\u039d \u03a6\u03a4\u0391\u039d\u039f\u03a5\u039d \u03a4\u0391 \u0391\u03a4\u039f\u039c\u0391\xbb - \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03ba\u03b1\u03bd\u03b5\u03af\u03c2 \u03b4\u03b5\u03cd\u03c4\u03b5\u03c1\u03b7 \u03c6\u03bf\u03c1\u03ac.","\u0394\u03cd\u03bf \u03c3\u03c5\u03bd\u03b5\u03c7\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03bc\u03cc\u03bd\u03bf \u03b1\u03bd \u03b4\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1 - \u03ba\u03b1\u03bd\u03bf\u03bd\u03b9\u03ba\u03ac \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03c4\u03bf \u03c0\u03bf\u03bb\u03cd \u03bc\u03ad\u03c1\u03b1 \u03c0\u03b1\u03c1\u03ac \u03bc\u03ad\u03c1\u03b1. \u0391\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1 \u03b4\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03ba\u03b1\u03bb\u03c5\u03c6\u03b8\u03bf\u03cd\u03bd \u03bf\u03b9 \u03b8\u03ad\u03c3\u03b5\u03b9\u03c2, \u03ba\u03ac\u03c0\u03bf\u03b9\u03bf\u03b9 \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd 2 \u03c3\u03c5\u03bd\u03b5\u03c7\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2, \u03bc\u03b5 \u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac (\u03c0\u03c1\u03ce\u03c4\u03b1 \u03cc\u03c3\u03bf\u03b9 \u03b4\u03b5\u03bd \u03ad\u03c7\u03bf\u03c5\u03bd \u03be\u03b1\u03bd\u03b1\u03bc\u03c0\u03b5\u03af), \u03ba\u03b1\u03b9 \u03c4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9 \u03cc\u03c4\u03b9 \u03bf\u03b9 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03b1\u03c0\u03cc \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1.","\u03a6\u03c5\u03bb\u03ac\u03ba\u03b9\u03b1 \u03c4\u03bf \u03a3\u03b1\u03b2\u03b2\u03b1\u03c4\u03bf\u03ba\u03cd\u03c1\u03b9\u03b1\u03ba\u03bf - \u03b5\u03af\u03bd\u03b1\u03b9 \u03c4\u03c1\u03b9\u03ae\u03bc\u03b5\u03c1\u03bf: \u03cc\u03c0\u03bf\u03b9\u03bf\u03c2 \u03c0\u03ac\u03b5\u03b9 \u03a0\u03b1\u03c1\u03b1\u03c3\u03ba\u03b5\u03c5\u03ae \u03bc\u03ad\u03bd\u03b5\u03b9 \u03a3\u03ac\u03b2\u03b2\u03b1\u03c4\u03bf \u03ba\u03b1\u03b9 \u039a\u03c5\u03c1\u03b9\u03b1\u03ba\u03ae \u03ba\u03b1\u03b9 \u03b3\u03c5\u03c1\u03bd\u03ac\u03b5\u03b9 \u0394\u03b5\u03c5\u03c4\u03ad\u03c1\u03b1 \u03c0\u03c1\u03c9\u03af (\u03c4\u03b7 \u0394\u03b5\u03c5\u03c4\u03ad\u03c1\u03b1 \u03b4\u03b5\u03bd \u03c0\u03b1\u03af\u03c1\u03bd\u03b5\u03b9 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1). \u0391\u03bb\u03bb\u03ac\u03b6\u03b5\u03b9 \u03bc\u03b5 \u03c4\u03bf \xab\u03a4\u03c1\u03b9\u03ae\u03bc\u03b5\u03c1\u03bf \u03a3\u039a\xbb \u03c3\u03b5 \u03ba\u03ac\u03b8\u03b5 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1.","\u0392\u03b1\u03b8\u03bc\u03cc\u03c2 - \u03ba\u03ac\u03b8\u03b5 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c4\u03b7\u03bd \u03ba\u03ac\u03bd\u03b5\u03b9 \u03bc\u03cc\u03bd\u03bf \u03cc\u03c0\u03bf\u03b9\u03bf\u03c2 \u03ad\u03c7\u03b5\u03b9 \u03c4\u03bf\u03bd \u03b2\u03b1\u03b8\u03bc\u03cc \u03c0\u03bf\u03c5 \u03b5\u03c0\u03b9\u03c4\u03c1\u03ad\u03c0\u03b5\u03b9 (\u03c0.\u03c7. \u03c4\u03bf \u0391\u03a5\u0394\u039c \u03c0\u03bf\u03c4\u03ad \u03a3\u03a4\u03a1).","\u0395\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03ac\u03b4\u03b5\u03b9\u03b5\u03c2 - \u03bf \u03ac\u03bf\u03c0\u03bb\u03bf\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03bf\u03c4\u03ad \u03c3\u03b5 \u03ad\u03bd\u03bf\u03c0\u03bb\u03b7, \u03ba\u03b1\u03bd\u03b5\u03af\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c3\u03b5 \u03ce\u03c1\u03b5\u03c2 \u03ae \u03bc\u03ad\u03c1\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03ad\u03c7\u03b5\u03b9 \u03b5\u03be\u03b1\u03af\u03c1\u03b5\u03c3\u03b7 \u03ae \u03ac\u03b4\u03b5\u03b9\u03b1.","\u038a\u03b4\u03b9\u03b1 \u03ce\u03c1\u03b1 - \u03ba\u03b1\u03bd\u03b5\u03af\u03c2 \u03b4\u03b5\u03bd \u03ad\u03c7\u03b5\u03b9 \u03b4\u03cd\u03bf \u03b2\u03ac\u03c1\u03b4\u03b9\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03c0\u03ad\u03c6\u03c4\u03bf\u03c5\u03bd \u03c4\u03b7\u03bd \u03af\u03b4\u03b9\u03b1 \u03ce\u03c1\u03b1."],numbered:!1,note:"\u0394\u03b5\u03bd \u03bc\u03b5\u03c4\u03c1\u03ac\u03bd\u03b5 \u03c3\u03b1\u03bd \u03b4\u03b5\u03cd\u03c4\u03b5\u03c1\u03b7 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1: \u03bf\u03b9 \u03b5\u03b2\u03b4\u03bf\u03bc\u03b1\u03b4\u03b9\u03b1\u03af\u03b5\u03c2 (\u0391\u0393\u039f\u03a3 / \u0391\u039d\u0398\u03a3\u03a4\u0397\u03a3 \u0395\u0392\u0394\u039f\u039c\u0391\u0394\u0391\u03a3) \u03ba\u03b1\u03b9 \u03bf\u03b9 \u03b8\u03ad\u03c3\u03b5\u03b9\u03c2 \u03c0\u03bf\u03c5 \u03b5\u03af\u03bd\u03b1\u03b9 \xab\u03af\u03b4\u03b9\u03bf\u03c2 \u03bc\u03b5\xbb \u03ae \xab\u03b1\u03c0\u03cc\xbb \u03ac\u03bb\u03bb\u03b7 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 (\u03c0.\u03c7. \u039f\u0394\u0397\u0393\u039f\u03a3 \u03a6/\u03a6, \u03c0\u03bb\u03b7\u03c1\u03ce\u03bc\u03b1\u03c4\u03b1 \u03bf\u03c7\u03b7\u03bc\u03ac\u03c4\u03c9\u03bd, \u0391\u039c 2) - \u03b1\u03c5\u03c4\u03ad\u03c2 \u03c4\u03b9\u03c2 \u03ba\u03ac\u03bd\u03b5\u03b9 \u03bf \u03af\u03b4\u03b9\u03bf\u03c2 \u03ac\u03bd\u03b8\u03c1\u03c9\u03c0\u03bf\u03c2 \u03bc\u03b1\u03b6\u03af \u03bc\u03b5 \u03c4\u03b7\u03bd \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c4\u03bf\u03c5."},{title:"\u03a0\u03ce\u03c2 \u03b4\u03bf\u03c5\u03bb\u03b5\u03cd\u03bf\u03c5\u03bd \u03bf\u03b9 \u03b5\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2",intro:"\u03a3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc: \u03ba\u03b1\u03c1\u03c4\u03ad\u03bb\u03b1 \xab\u039f\u03bd\u03cc\u03bc\u03b1\u03c4\u03b1\xbb \u03ba\u03b1\u03b9 \u03c0\u03b1\u03c4\u03ac\u03c2 \u03c0\u03ac\u03bd\u03c9 \u03c3\u03c4\u03bf \u03cc\u03bd\u03bf\u03bc\u03b1. \u03a3\u03c4\u03bf\u03bd \u03c5\u03c0\u03bf\u03bb\u03bf\u03b3\u03b9\u03c3\u03c4\u03ae: \u03ba\u03bf\u03c5\u03bc\u03c0\u03af \xab\u0395\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2\xbb.",items:["\u0386\u03bf\u03c0\u03bb\u03bf\u03c2 - \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03bf\u03c4\u03ad \u03c3\u03b5 \u03ad\u03bd\u03bf\u03c0\u03bb\u03b7 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1. \u03a3\u03c4\u03b9\u03c2 \u03ac\u03bf\u03c0\u03bb\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03c1\u03ce\u03c4\u03bf\u03c2.","\u038c\u03c7\u03b9 \u03c0\u03c1\u03c9\u03b9\u03bd\u03ad\u03c2 / \u03b1\u03c0\u03bf\u03b3\u03b5\u03c5\u03bc\u03b1\u03c4\u03b9\u03bd\u03ad\u03c2 / \u03b2\u03c1\u03b1\u03b4\u03b9\u03bd\u03ad\u03c2 / \u03bd\u03c5\u03c7\u03c4\u03b5\u03c1\u03b9\u03bd\u03ad\u03c2 - \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c3\u03b5 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c0\u03bf\u03c5 \u03c0\u03ad\u03c6\u03c4\u03b5\u03b9 \u03c3\u03b5 \u03b1\u03c5\u03c4\u03ad\u03c2 \u03c4\u03b9\u03c2 \u03ce\u03c1\u03b5\u03c2 (\u03c0\u03c1\u03c9\u03af 06-12, \u03b1\u03c0\u03cc\u03b3\u03b5\u03c5\u03bc\u03b1 12-18, \u03b2\u03c1\u03ac\u03b4\u03c5 18-24, \u03bd\u03cd\u03c7\u03c4\u03b1 00-06). \u03a3\u03c4\u03bf \xab\u0386\u03bb\u03bb\u03b5\u03c2 \u03ce\u03c1\u03b5\u03c2\xbb \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9\u03c2 \u03b4\u03b9\u03ba\u03ad\u03c2 \u03c3\u03bf\u03c5, \u03c0.\u03c7. 22:00-02:00.","\u038c\u03c7\u03b9 24\u03c9\u03c1\u03b5\u03c2 - \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c3\u03b5 24\u03c9\u03c1\u03b5\u03c2 \u03ae \u03b5\u03b2\u03b4\u03bf\u03bc\u03b1\u03b4\u03b9\u03b1\u03af\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2.","\u03a5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03b4\u03b5\u03bd \u03ba\u03ac\u03bd\u03b5\u03b9 - \u03c4\u03c3\u03b5\u03ba\u03ac\u03c1\u03b5\u03b9\u03c2 \u03cc\u03c3\u03b5\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03bf\u03c1\u03b5\u03af \u03bd\u03b1 \u03ba\u03ac\u03bd\u03b5\u03b9.","\u0386\u03b4\u03b5\u03b9\u03b1 - \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9\u03c2 \u03b1\u03c0\u03cc-\u03ad\u03c9\u03c2 (\u03c0.\u03c7. 20/11/2026-24/11/2026). \u0395\u03ba\u03b5\u03af\u03bd\u03b5\u03c2 \u03c4\u03b9\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1. \u038c\u03c4\u03b1\u03bd \u03b3\u03c5\u03c1\u03af\u03c3\u03b5\u03b9, \u03b1\u03bd \u03ad\u03c7\u03b5\u03b9 \u03bc\u03b5\u03af\u03bd\u03b5\u03b9 \u03c0\u03af\u03c3\u03c9 \u03c3\u03b5 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2, \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03c1\u03ce\u03c4\u03bf\u03c2 \u03bc\u03ad\u03c7\u03c1\u03b9 \u03bd\u03b1 \u03c6\u03c4\u03ac\u03c3\u03b5\u03b9 \u03c4\u03bf\u03c5\u03c2 \u03ac\u03bb\u03bb\u03bf\u03c5\u03c2 (\u03bc\u03ad\u03c1\u03b1 \u03c0\u03b1\u03c1\u03ac \u03bc\u03ad\u03c1\u03b1 - \u03b9\u03c3\u03c7\u03cd\u03b5\u03b9 \u03b3\u03b9\u03b1 \u03a3\u03a4\u03a1). \u0391\u03bd \u03b4\u03b5\u03bd \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03af\u03c3\u03c9, \u03c3\u03c5\u03bd\u03b5\u03c7\u03af\u03b6\u03b5\u03b9 \u03ba\u03b1\u03bd\u03bf\u03bd\u03b9\u03ba\u03ac.","\u0391\u03c0\u03cc\u03c3\u03c0\u03b1\u03c3\u03b7 - \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9\u03c2 \u03b1\u03c0\u03cc-\u03ad\u03c9\u03c2. \u0394\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03bf\u03cd\u03c4\u03b5 \u03c3\u03c4\u03b9\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \xab\u03bc\u03cc\u03bd\u03bf \u03b1\u03c0\u03cc\xbb. \u039c\u03b5\u03c4\u03c1\u03ac\u03b5\u03b9 \u03c3\u03b1\u03bd \u03bd\u03b1 \u03ad\u03ba\u03b1\u03bd\u03b5 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2: 1 \u03b5\u03b2\u03b4\u03bf\u03bc\u03ac\u03b4\u03b1 = 3 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 (\u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03b1\u03bd\u03b1\u03bb\u03bf\u03b3\u03b9\u03ba\u03ac), \u03bf\u03c0\u03cc\u03c4\u03b5 \u03cc\u03c4\u03b1\u03bd \u03b3\u03c5\u03c1\u03af\u03c3\u03b5\u03b9 \u03b4\u03b5\u03bd \u03c7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9 \u03bd\u03b1 \xab\u03c6\u03c4\u03ac\u03c3\u03b5\u03b9\xbb \u03c4\u03bf\u03c5\u03c2 \u03ac\u03bb\u03bb\u03bf\u03c5\u03c2.","\u0386\u03bb\u03bb\u03b5\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03bb\u03b5\u03af\u03c0\u03b5\u03b9 - \u03bc\u03ad\u03c1\u03b5\u03c2 (\u03c0.\u03c7. \u03a3\u03ac\u03b2\u03b2\u03b1\u03c4\u03bf, \u039a\u03c5\u03c1\u03b9\u03b1\u03ba\u03ae) \u03ae \u03b7\u03bc\u03b5\u03c1\u03bf\u03bc\u03b7\u03bd\u03af\u03b5\u03c2 (\u03c0.\u03c7. 18/11/2026). \u0395\u03ba\u03b5\u03af\u03bd\u03b5\u03c2 \u03c4\u03b9\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03bf\u03c5\u03b8\u03b5\u03bd\u03ac.","\u03a3\u03b7\u03bc\u03b5\u03af\u03c9\u03c3\u03b7 - \u03cc,\u03c4\u03b9 \u03b8\u03ad\u03bb\u03b5\u03b9\u03c2 \u03bd\u03b1 \u03b8\u03c5\u03bc\u03ac\u03c3\u03b1\u03b9 (\u03b4\u03b5\u03bd \u03b5\u03c0\u03b7\u03c1\u03b5\u03ac\u03b6\u03b5\u03b9 \u03c4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1)."],numbered:!1,note:"\u039a\u03ac\u03c4\u03c9-\u03ba\u03ac\u03c4\u03c9 \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9 \u03b1\u03bc\u03ad\u03c3\u03c9\u03c2 \u03c0\u03bf\u03b9\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03bc\u03c0\u03bf\u03c1\u03b5\u03af \u03b1\u03ba\u03cc\u03bc\u03b1 \u03bd\u03b1 \u03ba\u03ac\u03bd\u03b5\u03b9. \u0391\u03bd \u03b3\u03c1\u03ac\u03c8\u03b5\u03b9 \xab\u03ba\u03b1\u03bc\u03af\u03b1\xbb, \u03bf\u03b9 \u03b5\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2 \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03bf\u03bb\u03bb\u03ad\u03c2."},{title:"\u0388\u03ba\u03c4\u03b1\u03ba\u03c4\u03b7 \u03b1\u03bb\u03bb\u03b1\u03b3\u03ae (\u03c0.\u03c7. \u03b1\u03c1\u03c1\u03ce\u03c3\u03c4\u03b7\u03c3\u03b5 \u03ba\u03ac\u03c0\u03bf\u03b9\u03bf\u03c2)",intro:"\u03a3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc: \u03c3\u03c4\u03bf \xab\u03a0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1\xbb \u03c0\u03b1\u03c4\u03ac\u03c2 \u03c4\u03bf \u21c4 \u03b4\u03af\u03c0\u03bb\u03b1 \u03c3\u03c4\u03bf \u03cc\u03bd\u03bf\u03bc\u03b1. \u03a3\u03c4\u03bf\u03bd \u03c5\u03c0\u03bf\u03bb\u03bf\u03b3\u03b9\u03c3\u03c4\u03ae: \u03ba\u03bf\u03c5\u03bc\u03c0\u03af \xab\u0388\u03ba\u03c4\u03b1\u03ba\u03c4\u03b7 \u03b1\u03bb\u03bb\u03b1\u03b3\u03ae\xbb, \u03b4\u03b9\u03b1\u03bb\u03ad\u03b3\u03b5\u03b9\u03c2 \u03bc\u03ad\u03c1\u03b1 \u03ba\u03b1\u03b9 \u03c0\u03bf\u03b9\u03bf\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03bf\u03c1\u03b5\u03af.",items:["\u03a4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 \u03c0\u03c1\u03bf\u03c4\u03b5\u03af\u03bd\u03b5\u03b9 \u03c4\u03bf\u03bd \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03bf \u03c3\u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac (\u2605): \u03b5\u03bb\u03b5\u03cd\u03b8\u03b5\u03c1\u03bf\u03c2 \u03b5\u03ba\u03b5\u03af\u03bd\u03b7 \u03c4\u03b7 \u03bc\u03ad\u03c1\u03b1, \u03c7\u03c9\u03c1\u03af\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c0\u03bf\u03c5 \u03bd\u03b1 \u03c0\u03ad\u03c6\u03c4\u03b5\u03b9 \u03c0\u03ac\u03bd\u03c9, \u03cc\u03c7\u03b9 2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03c3\u03c5\u03bd\u03b5\u03c7\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03b1\u03bd \u03b3\u03af\u03bd\u03b5\u03c4\u03b1\u03b9, \u03bc\u03b5 \u03c4\u03b9\u03c2 \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03ba\u03b1\u03b9 \u03ce\u03c1\u03b5\u03c2. \u039c\u03c0\u03bf\u03c1\u03b5\u03af\u03c2 \u03bd\u03b1 \u03b4\u03b9\u03b1\u03bb\u03ad\u03be\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03ac\u03bb\u03bb\u03bf\u03bd \u03b1\u03c0\u03cc \u03c4\u03b7 \u03bb\u03af\u03c3\u03c4\u03b1.","\u0391\u03c5\u03c4\u03cc\u03c2 \u03c0\u03bf\u03c5 \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03b3\u03c1\u03ac\u03c6\u03b5\u03c4\u03b1\u03b9 \u03ba\u03b1\u03bd\u03bf\u03bd\u03b9\u03ba\u03ac \u03cc\u03c4\u03b9 \u03ad\u03ba\u03b1\u03bd\u03b5 \u03c4\u03b7\u03bd \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 (\u03bc\u03b5\u03c4\u03c1\u03ac\u03b5\u03b9 \u03c3\u03c4\u03b9\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03ba\u03b1\u03b9 \u03c3\u03c4\u03b9\u03c2 \u03ce\u03c1\u03b5\u03c2 \u03c4\u03bf\u03c5).","\u0391\u03c5\u03c4\u03cc\u03c2 \u03c0\u03bf\u03c5 \u03b2\u03b3\u03b1\u03af\u03bd\u03b5\u03b9 \u0394\u0395\u039d \u03b3\u03c1\u03ac\u03c6\u03b5\u03c4\u03b1\u03b9 \u03cc\u03c4\u03b9 \u03c4\u03b7\u03bd \u03ad\u03ba\u03b1\u03bd\u03b5: \u03bc\u03ad\u03bd\u03b5\u03b9 \u03c3\u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac \u03c4\u03bf\u03c5 \u03b3\u03b9\u03b1 \u03c4\u03b9\u03c2 \u03b5\u03c0\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03ba\u03b1\u03b9 \u03c4\u03bf\u03c5 \u03b3\u03c1\u03ac\u03c6\u03b5\u03c4\u03b1\u03b9 \xab\u03bb\u03b5\u03af\u03c0\u03b5\u03b9\xbb \u03b5\u03ba\u03b5\u03af\u03bd\u03b7 \u03c4\u03b7 \u03bc\u03ad\u03c1\u03b1 (\u03c3\u03c4\u03b9\u03c2 \u03b5\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2), \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03bc\u03b7\u03bd \u03be\u03b1\u03bd\u03b1\u03c0\u03c1\u03bf\u03c4\u03b1\u03b8\u03b5\u03af.","\u03a4\u03bf \u0386\u03c4\u03bf\u03bc\u03b1.xlsx \u03ba\u03b1\u03b9 \u03c4\u03bf Excel \u03c4\u03bf\u03c5 \u03c0\u03c1\u03bf\u03b3\u03c1\u03ac\u03bc\u03bc\u03b1\u03c4\u03bf\u03c2 (\u03c6\u03cd\u03bb\u03bb\u03bf \u03c4\u03b7\u03c2 \u03bc\u03ad\u03c1\u03b1\u03c2, \xab\u0395\u03b2\u03b4\u03bf\u03bc\u03ac\u03b4\u03b1\xbb, \xab\u039b\u03af\u03c3\u03c4\u03b1\xbb \u03bc\u03b5 \u03c3\u03b7\u03bc\u03b5\u03af\u03c9\u03c3\u03b7 \xab\u03ad\u03ba\u03c4\u03b1\u03ba\u03c4\u03b7 \u03b1\u03bb\u03bb\u03b1\u03b3\u03ae\xbb) \u03b5\u03bd\u03b7\u03bc\u03b5\u03c1\u03ce\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03bc\u03cc\u03bd\u03b1 \u03c4\u03bf\u03c5\u03c2. \u03a3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc \u03ba\u03b1\u03c4\u03ad\u03b2\u03b1\u03c3\u03b5 \u03be\u03b1\u03bd\u03ac \u03c4\u03b1 \u03b1\u03c1\u03c7\u03b5\u03af\u03b1."],numbered:!1},{title:"\u03a0\u03ce\u03c2 \u03c6\u03c4\u03b9\u03ac\u03c7\u03bd\u03b5\u03b9\u03c2 \u03bd\u03ad\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1",items:["\u0386\u03bd\u03bf\u03b9\u03be\u03b5 - \xab\u03a5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2\xbb \u03ba\u03b1\u03b9 \u03bc\u03b5\u03c4\u03ac \xab+ \u039d\u03ad\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1\xbb (\u03ae \xab\u0391\u03c0\u03cc \u03c4\u03b9\u03c2 \u03c0\u03c1\u03bf\u03c4\u03b5\u03b9\u03bd\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2\xbb \u03b3\u03b9\u03b1 \u03bc\u03af\u03b1 \u03c4\u03bf\u03c5 \u03b5\u03bd\u03c4\u03cd\u03c0\u03bf\u03c5).","\u03a4\u03af\u03c4\u03bb\u03bf\u03c2 - \u03c0.\u03c7. \u03a3\u039a\u039f\u03a0\u039f\u03a3 \u0391\u03a0\u039f\u0398\u0397\u039a\u0397\u03a3. \u0391\u03bd \u03ad\u03c7\u03b5\u03b9 \u03bd\u03bf\u03cd\u03bc\u03b5\u03c1\u03b1 (1\u03bf, 2\u03bf...), \u03b3\u03c1\u03ac\u03c8' \u03c4\u03bf \u03c3\u03c4\u03bf \xab\u039d\u03bf\u03cd\u03bc\u03b5\u03c1\u03bf\xbb: \u03cc\u03bb\u03b1 \u03c4\u03b1 \u03bd\u03bf\u03cd\u03bc\u03b5\u03c1\u03b1 \u03bc\u03b5 \u03c4\u03bf\u03bd \u03af\u03b4\u03b9\u03bf \u03c4\u03af\u03c4\u03bb\u03bf \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03bc\u03b1\u03b6\u03af \u03c3\u03b5 \u03bc\u03af\u03b1 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ae (\u03c3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc: \u03ac\u03bd\u03bf\u03b9\u03be\u03b5 \u03c4\u03b7\u03bd \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u2192 \xab+ \u039d\u03ad\u03bf \u03bd\u03bf\u03cd\u03bc\u03b5\u03c1\u03bf\xbb).","\u03a9\u03c1\u03ac\u03c1\u03b9\u03bf - \u03b4\u03b9\u03ac\u03bb\u03b5\u03be\u03b5 \u03ad\u03c4\u03bf\u03b9\u03bc\u03bf (24\u03c9\u03c1\u03b7, 3\u03c9\u03c1\u03b5\u03c2 \u03b2\u03ac\u03c1\u03b4\u03b9\u03b5\u03c2...) \u03ae \u03b3\u03c1\u03ac\u03c8\u03b5 \u03c0.\u03c7. 08:00-20:00, \u03ae \u03c6\u03c4\u03b9\u03ac\u03be\u03b5 \u03b2\u03ac\u03c1\u03b4\u03b9\u03b5\u03c2 \u03bc\u03b5 \xab\u0391\u03c0\u03cc\xbb / \xab\u0388\u03c9\u03c2\xbb \u03ba\u03b1\u03b9 \xab+ \u0392\u03ac\u03c1\u03b4\u03b9\u03b1\xbb. \u0391\u03c0\u03cc \u03ba\u03ac\u03c4\u03c9 \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9 \u03b1\u03bd \u03ba\u03b1\u03c4\u03ac\u03bb\u03b1\u03b2\u03b5 \u03c4\u03bf \u03c9\u03c1\u03ac\u03c1\u03b9\u03bf.","\u0386\u03c4\u03bf\u03bc\u03b1 \u03ba\u03b1\u03b9 \u03b2\u03b1\u03b8\u03bc\u03cc\u03c2 - \u03c0\u03cc\u03c3\u03bf\u03b9 \u03c4\u03b7 \u03c6\u03bf\u03c1\u03ac, \u03ba\u03b1\u03b9 \u03c0\u03bf\u03b9\u03bf\u03c2 \u03b2\u03b1\u03b8\u03bc\u03cc\u03c2 \u03c4\u03b7\u03bd \u03ba\u03ac\u03bd\u03b5\u03b9 (\u03c0.\u03c7. \u03a3\u03a4\u03a1). \u0393\u03b9\u03b1 \u03b4\u03cd\u03bf \u03b2\u03b1\u03b8\u03bc\u03bf\u03cd\u03c2 \u03b3\u03c1\u03ac\u03c8\u03b5 \u03c4\u03bf\u03c5\u03c2 \u03bc\u03b5 \u03ba\u03cc\u03bc\u03bc\u03b1, \u03c0.\u03c7. \xab\u0394\u039d\u0395\u0391\u03a3, \u03a3\u03a4\u03a1\xbb.","\u0388\u03bd\u03bf\u03c0\u03bb\u03b7 - \u03c4\u03c3\u03ad\u03ba\u03b1\u03c1\u03ad \u03c4\u03bf \u03b1\u03bd \u03b5\u03af\u03bd\u03b1\u03b9 \u03ad\u03bd\u03bf\u03c0\u03bb\u03b7, \u03b3\u03b9\u03b1 \u03bd\u03b1 \u03bc\u03b7 \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03ac\u03bf\u03c0\u03bb\u03bf\u03b9.","\u03a0\u03bf\u03b9\u03bf\u03b9 \u03c4\u03b7\u03bd \u03ba\u03ac\u03bd\u03bf\u03c5\u03bd - \xab\u038c\u03bb\u03bf\u03b9 \u03c4\u03bf\u03c5 \u03b2\u03b1\u03b8\u03bc\u03bf\u03cd\xbb (\u03bc\u03b5 \u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac), \xab\u03a3\u03c4\u03b1\u03b8\u03b5\u03c1\u03cc \u03ac\u03c4\u03bf\u03bc\u03bf\xbb (\u03c0.\u03c7. \u03c3\u03c4\u03bf \u039a\u03a8\u039c \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03ac\u03bd\u03c4\u03b1 \u03bf \u03af\u03b4\u03b9\u03bf\u03c2) \u03ae \xab\u039c\u03cc\u03bd\u03bf \u03b1\u03c0\u03cc \u03c3\u03c5\u03b3\u03ba\u03b5\u03ba\u03c1\u03b9\u03bc\u03ad\u03bd\u03bf\u03c5\u03c2\xbb (\u03b4\u03b9\u03b1\u03bb\u03ad\u03b3\u03b5\u03b9 \u03bc\u03cc\u03bd\u03bf \u03b1\u03bd\u03ac\u03bc\u03b5\u03c3\u03b1 \u03c3\u03b5 \u03cc\u03c3\u03bf\u03c5\u03c2 \u03c4\u03c3\u03b5\u03ba\u03ac\u03c1\u03b5\u03b9\u03c2).","\u03a3\u03c4\u03bf \u03ad\u03bd\u03c4\u03c5\u03c0\u03bf - \xab\u03a3\u03c4\u03ae\u03bb\u03b7 \u03b5\u03bd\u03c4\u03cd\u03c0\u03bf\u03c5\xbb (\u03b1\u03c1\u03b9\u03c3\u03c4\u03b5\u03c1\u03ae \u03ae \u03b4\u03b5\u03be\u03b9\u03ac) \u03ba\u03b1\u03b9 \xab\u0395\u03c0\u03b9\u03ba\u03b5\u03c6\u03b1\u03bb\u03af\u03b4\u03b1\xbb: \u03c0\u03bf\u03cd \u03b8\u03b1 \u03c4\u03c5\u03c0\u03c9\u03b8\u03b5\u03af.","\u0391\u03c0\u03bf\u03b8\u03ae\u03ba\u03b5\u03c5\u03c3\u03b7 - \u03ba\u03b1\u03b9 \u03b5\u03af\u03bd\u03b1\u03b9 \u03ad\u03c4\u03bf\u03b9\u03bc\u03b7. \u0393\u03b9\u03b1 \u03bd\u03b1 \u03bc\u03b7 \u03b2\u03b3\u03b1\u03af\u03bd\u03b5\u03b9 \u03b3\u03b9\u03b1 \u03bb\u03af\u03b3\u03bf \u03ba\u03b1\u03b9\u03c1\u03cc, \u03ba\u03ac\u03bd' \u03c4\u03b7\u03bd \u03b1\u03bd\u03b5\u03bd\u03b5\u03c1\u03b3\u03ae \u03b1\u03bd\u03c4\u03af \u03bd\u03b1 \u03c4\u03b7 \u03c3\u03b2\u03ae\u03c3\u03b5\u03b9\u03c2."],numbered:!0},{title:"\u03a0\u03ce\u03c2 \u03bc\u03bf\u03b9\u03c1\u03ac\u03b6\u03b5\u03b9 \u03c4\u03b9\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2",items:["\u0393\u03cd\u03c1\u03bf\u03c2 - \u03cc\u03bb\u03bf\u03b9 \u03c4\u03bf\u03c5 \u03af\u03b4\u03b9\u03bf\u03c5 \u03b2\u03b1\u03b8\u03bc\u03bf\u03cd \u03ba\u03ac\u03bd\u03bf\u03c5\u03bd \u03b1\u03c0\u03cc \u03bc\u03af\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c0\u03c1\u03b9\u03bd \u03be\u03b1\u03bd\u03b1\u03bc\u03c0\u03b5\u03af \u03ba\u03ac\u03c0\u03bf\u03b9\u03bf\u03c2. \u038c\u03c4\u03b1\u03bd \u03ba\u03ac\u03bd\u03bf\u03c5\u03bd \u03cc\u03bb\u03bf\u03b9, \u03be\u03b5\u03ba\u03b9\u03bd\u03ac \u03bd\u03ad\u03bf\u03c2 \u03b3\u03cd\u03c1\u03bf\u03c2 \u03bc\u03b5 \u03c4\u03c5\u03c7\u03b1\u03af\u03b1 \u03c3\u03b5\u03b9\u03c1\u03ac. \u039a\u03ac\u03b8\u03b5 \u03b2\u03b1\u03b8\u03bc\u03cc\u03c2 \u03ad\u03c7\u03b5\u03b9 \u03b4\u03b9\u03ba\u03cc \u03c4\u03bf\u03c5 \u03b3\u03cd\u03c1\u03bf.","\u039e\u03b5\u03ba\u03bf\u03cd\u03c1\u03b1\u03c3\u03b7 - \u03bc\u03af\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03c4\u03b7 \u03bc\u03ad\u03c1\u03b1 \u03c4\u03bf \u03c0\u03bf\u03bb\u03cd, \u03bc\u03ad\u03c1\u03b1 \u03c0\u03b1\u03c1\u03ac \u03bc\u03ad\u03c1\u03b1 (\u03b4\u03cd\u03bf \u03c3\u03c5\u03bd\u03b5\u03c7\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03bc\u03cc\u03bd\u03bf \u03b1\u03bd \u03b4\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1), \u03ba\u03b1\u03b9 \u03cc\u03c3\u03bf \u03b3\u03af\u03bd\u03b5\u03c4\u03b1\u03b9 \u03c7\u03c9\u03c1\u03af\u03c2 \u03ba\u03bf\u03bb\u03bb\u03b7\u03c4\u03ad\u03c2 \u03b2\u03ac\u03c1\u03b4\u03b9\u03b5\u03c2.","\u03a0\u03bf\u03b9\u03ba\u03b9\u03bb\u03af\u03b1 - \u03c0\u03c1\u03bf\u03c3\u03c0\u03b1\u03b8\u03b5\u03af \u03bd\u03b1 \u03bc\u03b7\u03bd \u03c0\u03b9\u03ac\u03bd\u03b5\u03b9 \u03ba\u03ac\u03c0\u03bf\u03b9\u03bf\u03c2 \u03c4\u03b7\u03bd \u03af\u03b4\u03b9\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03be\u03b1\u03bd\u03ac \u03bc\u03ad\u03c3\u03b1 \u03c3\u03c4\u03b7\u03bd \u03b5\u03b2\u03b4\u03bf\u03bc\u03ac\u03b4\u03b1, \u03ce\u03c3\u03c4\u03b5 \u03bd\u03b1 \u03c0\u03b5\u03c1\u03bd\u03bf\u03cd\u03bd \u03cc\u03bb\u03bf\u03b9 \u03b1\u03c0\u03cc \u03cc\u03bb\u03b5\u03c2.","\u038a\u03c3\u03b5\u03c2 \u03ce\u03c1\u03b5\u03c2 - \u03bc\u03bf\u03b9\u03c1\u03ac\u03b6\u03b5\u03b9 \u03c4\u03b9\u03c2 \u03bc\u03b5\u03b3\u03ac\u03bb\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 (24\u03c9\u03c1\u03b5\u03c2) \u03c3\u03b5 \u03cc\u03c3\u03bf\u03c5\u03c2 \u03ad\u03c7\u03bf\u03c5\u03bd \u03ba\u03ac\u03bd\u03b5\u03b9 \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03ce\u03c1\u03b5\u03c2. \u03a3\u03c4\u03bf \u0386\u03c4\u03bf\u03bc\u03b1.xlsx \u03cc\u03c3\u03bf\u03b9 \u03ad\u03c7\u03bf\u03c5\u03bd \u03c4\u03b9\u03c2 \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03ce\u03c1\u03b5\u03c2 \u03c3\u03c4\u03bf\u03bd \u03b2\u03b1\u03b8\u03bc\u03cc \u03c4\u03bf\u03c5\u03c2 \u03c6\u03b1\u03af\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03bc\u03b5 \u03ad\u03bd\u03c4\u03bf\u03bd\u03b1 - \u03b1\u03c5\u03c4\u03bf\u03af \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03c0\u03c1\u03ce\u03c4\u03bf\u03b9.","\u038a\u03b4\u03b9\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03be\u03b1\u03bd\u03ac - \u03b5\u03c0\u03b9\u03c4\u03c1\u03ad\u03c0\u03b5\u03c4\u03b1\u03b9 \u03cc\u03c4\u03b1\u03bd \u03b4\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1. \u03a4\u03cc\u03c4\u03b5 \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03cc\u03c0\u03bf\u03b9\u03bf\u03c2 \u03ad\u03c7\u03b5\u03b9 \u03c4\u03b9\u03c2 \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03ce\u03c1\u03b5\u03c2.","\u03a3\u03b1\u03b2\u03b2\u03b1\u03c4\u03bf\u03ba\u03cd\u03c1\u03b9\u03b1\u03ba\u03b1 (\u03a3\u03a4\u03a1) - \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03c0\u03c1\u03ce\u03c4\u03b1 \u03cc\u03c3\u03bf\u03b9 \u03ad\u03c7\u03bf\u03c5\u03bd \u03ba\u03ac\u03bd\u03b5\u03b9 \u03c4\u03b1 \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b1 \u03a3\u03b1\u03b2\u03b2\u03b1\u03c4\u03bf\u03ba\u03cd\u03c1\u03b9\u03b1\u03ba\u03b1.","\u0394\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1 - \u03b1\u03bd \u03bc\u03b9\u03b1 \u03bc\u03ad\u03c1\u03b1 \u03b4\u03b5\u03bd \u03c5\u03c0\u03ac\u03c1\u03c7\u03b5\u03b9 \u03b5\u03bb\u03b5\u03cd\u03b8\u03b5\u03c1\u03bf\u03c2, \u03b7 \u03b8\u03ad\u03c3\u03b7 \u03bc\u03ad\u03bd\u03b5\u03b9 \u03ba\u03b5\u03bd\u03ae \u03bc\u03b5 \xab\u0394\u0395\u039d \u03a6\u03a4\u0391\u039d\u039f\u03a5\u039d \u03a4\u0391 \u0391\u03a4\u039f\u039c\u0391\xbb. \u0391\u03bd \u03c3\u03c4\u03bf \u03c3\u03cd\u03bd\u03bf\u03bb\u03bf \u03bf\u03b9 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03b1\u03c0\u03cc \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1, \u03cc\u03bb\u03bf\u03b9 \u03be\u03b1\u03bd\u03b1\u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03c0\u03b9\u03bf \u03c3\u03c5\u03c7\u03bd\u03ac \u03bc\u03b5 \u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac."],numbered:!1},{title:"\u03a0\u03c1\u03cc\u03c4\u03c5\u03c0\u03bf Excel (\u03c4\u03bf \u03ad\u03bd\u03c4\u03c5\u03c0\u03bf \u03c4\u03b7\u03c2 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1\u03c2)",items:["\u03a4\u03b9 \u03b5\u03af\u03bd\u03b1\u03b9 - \u03c4\u03bf \u03ac\u03b4\u03b5\u03b9\u03bf Excel \u03c4\u03b7\u03c2 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1\u03c2 \u03bc\u03b5 \u03c4\u03b7 \u03c6\u03cc\u03c1\u03bc\u03b1 \u03c0\u03bf\u03c5 \u03b8\u03ad\u03bb\u03b5\u03c4\u03b5 (\u03b4\u03b9\u03ac\u03c4\u03b1\u03be\u03b7, \u03c3\u03b7\u03bc\u03b5\u03b9\u03ce\u03c3\u03b5\u03b9\u03c2, \u03c5\u03c0\u03bf\u03b3\u03c1\u03b1\u03c6\u03ad\u03c2). \u03a4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 \u03b2\u03b3\u03b1\u03af\u03bd\u03b5\u03b9 \u03c0\u03ac\u03bd\u03c9 \u03c3\u03b5 \u03b1\u03c5\u03c4\u03cc, \u03af\u03b4\u03b9\u03bf \u03b1\u03ba\u03c1\u03b9\u03b2\u03ce\u03c2, \u03bc\u03b5 \u03c4\u03b1 \u03bf\u03bd\u03cc\u03bc\u03b1\u03c4\u03b1 \u03c3\u03c4\u03b9\u03c2 \u03b8\u03ad\u03c3\u03b5\u03b9\u03c2 \u03c4\u03bf\u03c5\u03c2.","\u03a4\u03b9 \u03c0\u03c1\u03ad\u03c0\u03b5\u03b9 \u03bd\u03b1 \u03ad\u03c7\u03b5\u03b9 - \u03bc\u03b9\u03b1 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ae \u03b5\u03c0\u03b9\u03ba\u03b5\u03c6\u03b1\u03bb\u03af\u03b4\u03b1\u03c2 \u03bc\u03b5 \xab\u03a9\u03a1\u0391\u03a1\u0399\u039f\xbb, \xab\u0392\u0391\u0398\u039c\u039f\u03a3\xbb \u03ba\u03b1\u03b9 \xab\u039f\u039d\u039f\u039c\u0391\xbb (\u03ae \xab\u039f\u039d\u039f\u039c\u0391\u03a4\u0395\u03a0\u03a9\u039d\u03a5\u039c\u039f\xbb) \u03b3\u03b9\u03b1 \u03ba\u03ac\u03b8\u03b5 \u03c3\u03c4\u03ae\u03bb\u03b7. \u039a\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03b1\u03c5\u03c4\u03ae\u03bd, \u03ba\u03ac\u03b8\u03b5 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ae \u03bc\u03b5 \u03c4\u03af\u03c4\u03bb\u03bf \u03ba\u03b1\u03b9 \u03c9\u03c1\u03ac\u03c1\u03b9\u03bf \u03b5\u03af\u03bd\u03b1\u03b9 \u03bc\u03b9\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 (\u03b5\u03bd\u03c9\u03bc\u03ad\u03bd\u03b5\u03c2 \u03b3\u03c1\u03b1\u03bc\u03bc\u03ad\u03c2 = \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1).","\u03a0\u03ce\u03c2 \u03c4\u03bf \u03b2\u03ac\u03b6\u03b5\u03b9\u03c2 - \u03ba\u03bf\u03c5\u03bc\u03c0\u03af \xab\u03a0\u03c1\u03cc\u03c4\u03c5\u03c0\u03bf\xbb \u03ba\u03b1\u03b9 \u03b4\u03b9\u03b1\u03bb\u03ad\u03b3\u03b5\u03b9\u03c2 \u03c4\u03bf \u03b1\u03c1\u03c7\u03b5\u03af\u03bf. \u0393\u03c1\u03ac\u03c6\u03b5\u03b9 \u03c0\u03bf\u03b9\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03b2\u03c1\u03ae\u03ba\u03b5, \u03c0\u03bf\u03b9\u03b5\u03c2 \u03b5\u03af\u03bd\u03b1\u03b9 \u03bd\u03ad\u03b5\u03c2 \u03ba\u03b1\u03b9 \u03c0\u03bf\u03b9\u03b5\u03c2 \u03bb\u03b5\u03af\u03c0\u03bf\u03c5\u03bd, \u03ba\u03b1\u03b9 \u03c0\u03b1\u03c4\u03ac\u03c2 \xab\u03a7\u03c1\u03ae\u03c3\u03b7\xbb.","\u03a0\u03bf\u03b9\u03b5\u03c2 \u03b3\u03af\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03b5\u03bd\u03b5\u03c1\u03b3\u03ad\u03c2 - \u03cc\u03c3\u03b5\u03c2 \u03b2\u03c1\u03b5\u03b9 \u03c3\u03c4\u03bf \u03c0\u03c1\u03cc\u03c4\u03c5\u03c0\u03bf \u03b3\u03af\u03bd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03b5\u03bd\u03b5\u03c1\u03b3\u03ad\u03c2 \u03bc\u03cc\u03bd\u03b5\u03c2 \u03c4\u03bf\u03c5\u03c2. \u038c\u03c3\u03b5\u03c2 \u03b4\u03b5\u03bd \u03ad\u03c7\u03b5\u03b9 \u03bc\u03ad\u03bd\u03bf\u03c5\u03bd \u03c0\u03c1\u03bf\u03c4\u03b5\u03b9\u03bd\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 (\u03b1\u03bd\u03b5\u03bd\u03b5\u03c1\u03b3\u03ad\u03c2) \u03ba\u03b1\u03b9 \u03c4\u03b9\u03c2 \u03b5\u03bd\u03b5\u03c1\u03b3\u03bf\u03c0\u03bf\u03b9\u03b5\u03af\u03c2 \u03bc\u03cc\u03bd\u03bf \u03b1\u03bd \u03c4\u03b9\u03c2 \u03b8\u03ad\u03bb\u03b5\u03b9\u03c2.","\u039d\u03ad\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 - \u03cc\u03c3\u03b5\u03c2 \u03c0\u03c1\u03bf\u03c3\u03b8\u03ad\u03c4\u03b5\u03b9\u03c2 \u03bc\u03b5\u03c4\u03ac \u03c3\u03c4\u03b7\u03bd \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae \u03bc\u03c0\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03bc\u03cc\u03bd\u03b5\u03c2 \u03c4\u03bf\u03c5\u03c2 \u03c3\u03c4\u03bf Excel, \u03ba\u03ac\u03c4\u03c9 \u03b1\u03c0\u03cc \u03c4\u03b9\u03c2 \u03c5\u03c0\u03cc\u03bb\u03bf\u03b9\u03c0\u03b5\u03c2 \u03c4\u03b7\u03c2 \u03af\u03b4\u03b9\u03b1\u03c2 \u03c3\u03c4\u03ae\u03bb\u03b7\u03c2. \u03a4\u03bf \u03c0\u03c1\u03cc\u03c4\u03c5\u03c0\u03bf \u03b4\u03b5\u03bd \u03c7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9 \u03bd\u03b1 \u03c4\u03bf \u03b1\u03bb\u03bb\u03ac\u03be\u03b5\u03b9\u03c2."],numbered:!1},{title:"\u0399\u03c3\u03c4\u03bf\u03c1\u03b9\u03ba\u03cc (\u0386\u03c4\u03bf\u03bc\u03b1.xlsx)",items:["\u03a4\u03b9 \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9 - \u03b4\u03af\u03c0\u03bb\u03b1 \u03c3\u03b5 \u03ba\u03ac\u03b8\u03b5 \u03cc\u03bd\u03bf\u03bc\u03b1 \u03c0\u03cc\u03c3\u03b5\u03c2 \u03ba\u03b1\u03b9 \u03c0\u03bf\u03b9\u03b5\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03ad\u03ba\u03b1\u03bd\u03b5, \u03c4\u03b9\u03c2 \u03ce\u03c1\u03b5\u03c2, \u03ba\u03b1\u03b9 \u03b1\u03bd \u03ad\u03ba\u03b1\u03bd\u03b5 \u03c3\u03c4\u03bf\u03bd \u03c4\u03c9\u03c1\u03b9\u03bd\u03cc \u03b3\u03cd\u03c1\u03bf (\xab\u0395\u039a\u0391\u039d\u0395\xbb) \u03ae \u03b1\u03bd \u03ad\u03c1\u03c7\u03b5\u03c4\u03b1\u03b9 \u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac \u03c4\u03bf\u03c5 (\xab\u03a3\u0395\u0399\u03a1\u0391 \u03a4\u039f\u03a5 \u03a3\u03a5\u039d\u03a4\u039f\u039c\u0391\xbb).","\u039e\u03b1\u03bd\u03ac \u03bf\u03b9 \u03af\u03b4\u03b9\u03b5\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 - \u03b1\u03bd \u03be\u03b1\u03bd\u03b1\u03b2\u03b3\u03ac\u03bb\u03b5\u03b9\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03c0\u03bf\u03c5 \u03ad\u03c7\u03bf\u03c5\u03bd \u03ae\u03b4\u03b7 \u03b2\u03b3\u03b5\u03b9, \u03c1\u03c9\u03c4\u03ac\u03b5\u03b9 \u03c0\u03c1\u03ce\u03c4\u03b1 \u03ba\u03b1\u03b9 \u03bc\u03b5\u03c4\u03ac \u03c4\u03b9\u03c2 \u03b1\u03bd\u03c4\u03b9\u03ba\u03b1\u03b8\u03b9\u03c3\u03c4\u03ac.","\u039a\u03b9\u03bd\u03b7\u03c4\u03cc \u03ba\u03b1\u03b9 \u03c5\u03c0\u03bf\u03bb\u03bf\u03b3\u03b9\u03c3\u03c4\u03ae\u03c2 - \u03c4\u03bf \u03af\u03b4\u03b9\u03bf \u03b1\u03c1\u03c7\u03b5\u03af\u03bf \u03b1\u03bd\u03bf\u03af\u03b3\u03b5\u03b9 \u03ba\u03b1\u03b9 \u03c3\u03c4\u03b1 \u03b4\u03cd\u03bf: \u03ba\u03b1\u03c4\u03ad\u03b2\u03b1\u03c3\u03ad \u03c4\u03bf \u03b1\u03c0\u03cc \u03c4\u03bf \u03ad\u03bd\u03b1 \u03ba\u03b1\u03b9 \u03c6\u03cc\u03c1\u03c4\u03c9\u03c3\u03ad \u03c4\u03bf \u03c3\u03c4\u03bf \u03ac\u03bb\u03bb\u03bf (\xab\u0399\u03c3\u03c4\u03bf\u03c1\u03b9\u03ba\u03cc\xbb \u03c3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc).","\u0391\u03bd\u03c4\u03af\u03b3\u03c1\u03b1\u03c6\u03bf - \u03ba\u03c1\u03ac\u03c4\u03b1 \u03b1\u03bd\u03c4\u03af\u03b3\u03c1\u03b1\u03c6\u03bf. \u03a3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc \u03c4\u03b1 \u03c3\u03c4\u03bf\u03b9\u03c7\u03b5\u03af\u03b1 \u03bc\u03ad\u03bd\u03bf\u03c5\u03bd \u03bc\u03cc\u03bd\u03bf \u03c3\u03b5 \u03b1\u03c5\u03c4\u03cc \u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc."],numbered:!1},{title:"\u03a4\u03b9 \u03c3\u03b7\u03bc\u03b1\u03af\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03bc\u03b7\u03bd\u03cd\u03bc\u03b1\u03c4\u03b1",items:["\u0394\u0395\u039d \u03a6\u03a4\u0391\u039d\u039f\u03a5\u039d \u03a4\u0391 \u0391\u03a4\u039f\u039c\u0391 (\u03ba\u03b5\u03bd\u03ae \u03b8\u03ad\u03c3\u03b7) - \u03b5\u03ba\u03b5\u03af\u03bd\u03b7 \u03c4\u03b7 \u03bc\u03ad\u03c1\u03b1 \u03cc\u03c3\u03bf\u03b9 \u03bc\u03c0\u03bf\u03c1\u03bf\u03cd\u03bd \u03bd\u03b1 \u03c4\u03b7\u03bd \u03ba\u03ac\u03bd\u03bf\u03c5\u03bd \u03ad\u03c7\u03bf\u03c5\u03bd \u03ae\u03b4\u03b7 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1 \u03ae \u03b5\u03be\u03b1\u03af\u03c1\u03b5\u03c3\u03b7/\u03ac\u03b4\u03b5\u03b9\u03b1, \u03ba\u03b1\u03b9 \u03ba\u03b1\u03bd\u03b5\u03af\u03c2 \u03b4\u03b5\u03bd \u03bc\u03c0\u03b1\u03af\u03bd\u03b5\u03b9 \u03c3\u03b5 2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2. \u03a3\u03c5\u03bc\u03c0\u03bb\u03ae\u03c1\u03c9\u03c3\u03ad \u03c4\u03b7 \u03bc\u03b5 \u03c4\u03bf \u03c7\u03ad\u03c1\u03b9, \u03c0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b5 \u03ac\u03c4\u03bf\u03bc\u03b1, \u03bb\u03b9\u03b3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03b5\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2 \u03ae \u03ba\u03bb\u03b5\u03af\u03c3\u03b5 \u03ba\u03ac\u03c0\u03bf\u03b9\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1.","\u039a\u03b1\u03bd\u03ad\u03bd\u03b1\u03c2 \u03bc\u03b5 \u03b1\u03c5\u03c4\u03cc \u03c4\u03bf\u03bd \u03b2\u03b1\u03b8\u03bc\u03cc - \u03b4\u03b5\u03bd \u03c5\u03c0\u03ac\u03c1\u03c7\u03b5\u03b9 \u03ba\u03b1\u03bd\u03b5\u03af\u03c2 \u03bc\u03b5 \u03b1\u03c5\u03c4\u03cc\u03bd \u03c4\u03bf\u03bd \u03b2\u03b1\u03b8\u03bc\u03cc \u03c3\u03c4\u03b7 \u03bb\u03af\u03c3\u03c4\u03b1. \u0386\u03bb\u03bb\u03b1\u03be\u03b5 \u03c4\u03bf\u03bd \u03b2\u03b1\u03b8\u03bc\u03cc \u03c4\u03b7\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b1\u03c2 \u03ae \u03c0\u03c1\u03cc\u03c3\u03b8\u03b5\u03c3\u03b5 \u03ac\u03c4\u03bf\u03bc\u03b1.","\u039a\u03af\u03c4\u03c1\u03b9\u03bd\u03bf \u03cc\u03bd\u03bf\u03bc\u03b1 / \u03c7\u03b1\u03bb\u03ac\u03c1\u03c9\u03c3\u03b7 - \u03bc\u03c0\u03ae\u03ba\u03b5 \u03b5\u03c0\u03b5\u03b9\u03b4\u03ae \u03b4\u03b5\u03bd \u03c5\u03c0\u03ae\u03c1\u03c7\u03b5 \u03ac\u03bb\u03bb\u03bf\u03c2, \u03c0.\u03c7. \u03bc\u03b5 \u03bb\u03af\u03b3\u03b7 \u03be\u03b5\u03ba\u03bf\u03cd\u03c1\u03b1\u03c3\u03b7 \u03b1\u03c0\u03cc \u03c4\u03b7\u03bd \u03c0\u03c1\u03bf\u03b7\u03b3\u03bf\u03cd\u03bc\u03b5\u03bd\u03b7 \u03b2\u03ac\u03c1\u03b4\u03b9\u03b1. \u03a4\u03b9\u03c2 \u03b2\u03bb\u03ad\u03c0\u03b5\u03b9\u03c2 \u03c3\u03c4\u03b9\u03c2 \xab\u03a0\u03c1\u03bf\u03b5\u03b9\u03b4\u03bf\u03c0\u03bf\u03b9\u03ae\u03c3\u03b5\u03b9\u03c2\xbb (\u03c3\u03c4\u03bf Excel: \u03c6\u03cd\u03bb\u03bb\u03bf Warnings).","\u0394\u03b5\u03bd \u03c6\u03c4\u03ac\u03bd\u03bf\u03c5\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1 \u03b3\u03b9\u03b1 \u03bc\u03af\u03b1 \u03bc\u03ad\u03c1\u03b1 (\u03a3\u03a4\u03a1) - \u03c3\u03b5 \u03bc\u03af\u03b1 \u03bc\u03ad\u03c1\u03b1 \u03bf\u03b9 \u03b8\u03ad\u03c3\u03b5\u03b9\u03c2 \u03c4\u03c9\u03bd \u03a3\u03a4\u03a1 \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03b5\u03c1\u03b9\u03c3\u03c3\u03cc\u03c4\u03b5\u03c1\u03b5\u03c2 \u03b1\u03c0\u03cc \u03c4\u03bf\u03c5\u03c2 \u03a3\u03a4\u03a1, \u03bf\u03c0\u03cc\u03c4\u03b5 \u03ba\u03ac\u03c0\u03bf\u03b9\u03b5\u03c2 \u03b8\u03ad\u03c3\u03b5\u03b9\u03c2 \u03bc\u03ad\u03bd\u03bf\u03c5\u03bd \u03ba\u03b5\u03bd\u03ad\u03c2. \u0392\u03b3\u03b1\u03af\u03bd\u03b5\u03b9 \u03af\u03b4\u03b9\u03bf \u03c3\u03c4\u03bf \u03b7\u03bc\u03b5\u03c1\u03ae\u03c3\u03b9\u03bf \u03ba\u03b1\u03b9 \u03c3\u03c4\u03bf \u03b5\u03b2\u03b4\u03bf\u03bc\u03b1\u03b4\u03b9\u03b1\u03af\u03bf.","\u0395\u03bd\u03b7\u03bc\u03ad\u03c1\u03c9\u03c3\u03b7: 2 \u03c3\u03c5\u03bd\u03b5\u03c7\u03cc\u03bc\u03b5\u03bd\u03b5\u03c2 \u03bc\u03ad\u03c1\u03b5\u03c2 - \u03bc\u03ad\u03c1\u03b1 \u03c0\u03b1\u03c1\u03ac \u03bc\u03ad\u03c1\u03b1 \u03b4\u03b5\u03bd \u03ad\u03c6\u03c4\u03b1\u03bd\u03b1\u03bd \u03c4\u03b1 \u03ac\u03c4\u03bf\u03bc\u03b1, \u03bf\u03c0\u03cc\u03c4\u03b5 \u03ba\u03ac\u03c0\u03bf\u03b9\u03bf\u03b9 \u03bc\u03c0\u03ae\u03ba\u03b1\u03bd 2 \u03bc\u03ad\u03c1\u03b5\u03c2 \u03c3\u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac (\u03bc\u03b5 \u03c4\u03b7 \u03c3\u03b5\u03b9\u03c1\u03ac, \u03c0\u03c1\u03ce\u03c4\u03b1 \u03cc\u03c3\u03bf\u03b9 \u03b4\u03b5\u03bd \u03b5\u03af\u03c7\u03b1\u03bd \u03be\u03b1\u03bd\u03b1\u03bc\u03c0\u03b5\u03af). \u0395\u03af\u03bd\u03b1\u03b9 \u03bc\u03cc\u03bd\u03bf \u03b5\u03bd\u03b7\u03bc\u03ad\u03c1\u03c9\u03c3\u03b7, \u03cc\u03c7\u03b9 \u03bb\u03ac\u03b8\u03bf\u03c2."],numbered:!1},{title:"\u039d\u03bf\u03bc\u03b9\u03ba\u03ac, \u03b1\u03c0\u03cc\u03c1\u03c1\u03b7\u03c4\u03bf \u03ba\u03b1\u03b9 \u03b1\u03c3\u03c6\u03ac\u03bb\u03b5\u03b9\u03b1",items:["\u0391\u03bd\u03b5\u03c0\u03af\u03c3\u03b7\u03bc\u03b7 \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae - \u03b4\u03b5\u03bd \u03b5\u03af\u03bd\u03b1\u03b9 \u03b5\u03c0\u03af\u03c3\u03b7\u03bc\u03b7 \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae \u03c4\u03bf\u03c5 \u0395\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03bf\u03cd \u03a3\u03c4\u03c1\u03b1\u03c4\u03bf\u03cd, \u03c4\u03bf\u03c5 \u0393\u0395\u03a3 \u03ae \u03c4\u03bf\u03c5 \u03a5\u03c0\u03bf\u03c5\u03c1\u03b3\u03b5\u03af\u03bf\u03c5 \u0395\u03b8\u03bd\u03b9\u03ba\u03ae\u03c2 \u0386\u03bc\u03c5\u03bd\u03b1\u03c2 \u03ba\u03b1\u03b9 \u03b4\u03b5\u03bd \u03c3\u03c5\u03bd\u03b4\u03ad\u03b5\u03c4\u03b1\u03b9 \u03bc\u03b5 \u03b1\u03c5\u03c4\u03bf\u03cd\u03c2. \u0395\u03af\u03bd\u03b1\u03b9 \u03b2\u03bf\u03ae\u03b8\u03b7\u03bc\u03b1 \u03b3\u03b9\u03b1 \u03cc\u03c0\u03bf\u03b9\u03bf\u03bd \u03c6\u03c4\u03b9\u03ac\u03c7\u03bd\u03b5\u03b9 \u03c4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03b9\u03ce\u03bd.","\u03a4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1 \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03c1\u03cc\u03c4\u03b1\u03c3\u03b7 - \u03c4\u03bf \u03b5\u03bb\u03ad\u03b3\u03c7\u03b5\u03b9 \u03ba\u03b1\u03b9 \u03c4\u03bf \u03b5\u03b3\u03ba\u03c1\u03af\u03bd\u03b5\u03b9 \u03bf \u03b1\u03c1\u03bc\u03cc\u03b4\u03b9\u03bf\u03c2 (\u03c0.\u03c7. \u03bf \u0394\u03b9\u03bf\u03b9\u03ba\u03b7\u03c4\u03ae\u03c2) \u03c0\u03c1\u03b9\u03bd \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03c3\u03c4\u03b5\u03af. \u0399\u03c3\u03c7\u03cd\u03b5\u03b9 \u03cc,\u03c4\u03b9 \u03c5\u03c0\u03bf\u03b3\u03c1\u03ac\u03c6\u03b5\u03c4\u03b1\u03b9, \u03cc\u03c7\u03b9 \u03cc,\u03c4\u03b9 \u03b2\u03b3\u03ac\u03b6\u03b5\u03b9 \u03b7 \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae.","\u03a7\u03c9\u03c1\u03af\u03c2 \u03b5\u03b3\u03b3\u03cd\u03b7\u03c3\u03b7 - \u03b7 \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae \u03b4\u03af\u03bd\u03b5\u03c4\u03b1\u03b9 \xab\u03c9\u03c2 \u03ad\u03c7\u03b5\u03b9\xbb. \u039f \u03b4\u03b7\u03bc\u03b9\u03bf\u03c5\u03c1\u03b3\u03cc\u03c2 \u03b4\u03b5\u03bd \u03b5\u03c5\u03b8\u03cd\u03bd\u03b5\u03c4\u03b1\u03b9 \u03b3\u03b9\u03b1 \u03bb\u03ac\u03b8\u03b7 \u03c3\u03c4\u03bf \u03c0\u03c1\u03cc\u03b3\u03c1\u03b1\u03bc\u03bc\u03b1, \u03b3\u03b9\u03b1 \u03c7\u03b1\u03bc\u03ad\u03bd\u03b1 \u03b4\u03b5\u03b4\u03bf\u03bc\u03ad\u03bd\u03b1 \u03ae \u03b3\u03b9\u03b1 \u03c4\u03bf\u03bd \u03c4\u03c1\u03cc\u03c0\u03bf \u03c0\u03bf\u03c5 \u03c7\u03c1\u03b7\u03c3\u03b9\u03bc\u03bf\u03c0\u03bf\u03b9\u03b5\u03af\u03c4\u03b1\u03b9.","\u03a4\u03b1 \u03b4\u03b5\u03b4\u03bf\u03bc\u03ad\u03bd\u03b1 \u03bc\u03ad\u03bd\u03bf\u03c5\u03bd \u03c3\u03c4\u03b7 \u03c3\u03c5\u03c3\u03ba\u03b5\u03c5\u03ae - \u03bf\u03bd\u03cc\u03bc\u03b1\u03c4\u03b1, \u03b2\u03b1\u03b8\u03bc\u03bf\u03af, \u03b5\u03be\u03b1\u03b9\u03c1\u03ad\u03c3\u03b5\u03b9\u03c2 \u03ba\u03b1\u03b9 \u03b9\u03c3\u03c4\u03bf\u03c1\u03b9\u03ba\u03cc \u03b1\u03c0\u03bf\u03b8\u03b7\u03ba\u03b5\u03cd\u03bf\u03bd\u03c4\u03b1\u03b9 \u03bc\u03cc\u03bd\u03bf \u03c3\u03c4\u03bf \u03ba\u03b9\u03bd\u03b7\u03c4\u03cc \u03ae \u03c3\u03c4\u03bf\u03bd \u03c5\u03c0\u03bf\u03bb\u03bf\u03b3\u03b9\u03c3\u03c4\u03ae \u03ba\u03b1\u03b9 \u03c3\u03c4\u03b1 Excel \u03c0\u03bf\u03c5 \u03ba\u03b1\u03c4\u03b5\u03b2\u03ac\u03b6\u03b5\u03b9\u03c2. \u0397 \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae \u03b4\u03b5\u03bd \u03c3\u03c4\u03ad\u03bb\u03bd\u03b5\u03b9 \u03c4\u03af\u03c0\u03bf\u03c4\u03b1 \u03c3\u03c4\u03bf \u03af\u03bd\u03c4\u03b5\u03c1\u03bd\u03b5\u03c4: \u03b4\u03b5\u03bd \u03ad\u03c7\u03b5\u03b9 \u03bb\u03bf\u03b3\u03b1\u03c1\u03b9\u03b1\u03c3\u03bc\u03bf\u03cd\u03c2, \u03b4\u03b9\u03b1\u03c6\u03b7\u03bc\u03af\u03c3\u03b5\u03b9\u03c2 \u03ae \u03c3\u03c4\u03b1\u03c4\u03b9\u03c3\u03c4\u03b9\u03ba\u03ac. \u039c\u03b5 \u03c4\u03b7\u03bd \u03b1\u03c0\u03b5\u03b3\u03ba\u03b1\u03c4\u03ac\u03c3\u03c4\u03b1\u03c3\u03b7 \u03c3\u03b2\u03ae\u03bd\u03bf\u03c5\u03bd.","\u03a0\u03c1\u03bf\u03c3\u03c9\u03c0\u03b9\u03ba\u03ac \u03b4\u03b5\u03b4\u03bf\u03bc\u03ad\u03bd\u03b1 (GDPR) - \u03c4\u03b1 \u03bf\u03bd\u03cc\u03bc\u03b1\u03c4\u03b1 \u03b5\u03af\u03bd\u03b1\u03b9 \u03c0\u03c1\u03bf\u03c3\u03c9\u03c0\u03b9\u03ba\u03ac \u03b4\u03b5\u03b4\u03bf\u03bc\u03ad\u03bd\u03b1. \u03a5\u03c0\u03b5\u03cd\u03b8\u03c5\u03bd\u03bf\u03c2 \u03b3\u03b9\u03b1 \u03c4\u03b7 \u03c7\u03c1\u03ae\u03c3\u03b7 \u03c4\u03bf\u03c5\u03c2 \u03b5\u03af\u03bd\u03b1\u03b9 \u03b7 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1 \u03ba\u03b1\u03b9 \u03cc\u03c0\u03bf\u03b9\u03bf\u03c2 \u03c4\u03b1 \u03b2\u03ac\u03b6\u03b5\u03b9 (\u039a\u03b1\u03bd\u03bf\u03bd\u03b9\u03c3\u03bc\u03cc\u03c2 \u0395\u0395 2016/679, \u03bd. 4624/2019). \u0392\u03ac\u03bb\u03b5 \u03bc\u03cc\u03bd\u03bf \u03cc,\u03c4\u03b9 \u03c7\u03c1\u03b5\u03b9\u03ac\u03b6\u03b5\u03c4\u03b1\u03b9 \u03b3\u03b9\u03b1 \u03c4\u03b9\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2. \u039c\u0397\u039d \u03b3\u03c1\u03ac\u03c6\u03b5\u03b9\u03c2 \u03bb\u03cc\u03b3\u03bf\u03c5\u03c2 \u03c5\u03b3\u03b5\u03af\u03b1\u03c2 \u03ae \u03b9\u03b1\u03c4\u03c1\u03b9\u03ba\u03ac \u03c3\u03c4\u03bf\u03b9\u03c7\u03b5\u03af\u03b1: \u03b3\u03c1\u03ac\u03c8\u03b5 \u03bc\u03cc\u03bd\u03bf \xab\u03ac\u03bf\u03c0\u03bb\u03bf\u03c2\xbb, \xab\u03cc\u03c7\u03b9 24\u03c9\u03c1\u03b5\u03c2\xbb \u03ba\u03c4\u03bb.","\u0391\u03c3\u03c6\u03ac\u03bb\u03b5\u03b9\u03b1 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1\u03c2 - \u03bc\u03b7 \u03b2\u03ac\u03b6\u03b5\u03b9\u03c2 \u03b4\u03b9\u03b1\u03b2\u03b1\u03b8\u03bc\u03b9\u03c3\u03bc\u03ad\u03bd\u03b5\u03c2 \u03c0\u03bb\u03b7\u03c1\u03bf\u03c6\u03bf\u03c1\u03af\u03b5\u03c2. \u039c\u03b7 \u03bc\u03bf\u03b9\u03c1\u03ac\u03b6\u03b5\u03c3\u03b1\u03b9 \u03c4\u03b1 Excel \u03bc\u03b5 \u03c4\u03b9\u03c2 \u03c5\u03c0\u03b7\u03c1\u03b5\u03c3\u03af\u03b5\u03c2 \u03b5\u03ba\u03c4\u03cc\u03c2 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1\u03c2 (\u03c0.\u03c7. \u03c3\u03b5 \u03b1\u03bd\u03bf\u03b9\u03c7\u03c4\u03ad\u03c2 \u03bf\u03bc\u03ac\u03b4\u03b5\u03c2). \u03a4\u03ae\u03c1\u03b7\u03c3\u03b5 \u03c4\u03b9\u03c2 \u03b5\u03bd\u03c4\u03bf\u03bb\u03ad\u03c2 \u03c4\u03b7\u03c2 \u03bc\u03bf\u03bd\u03ac\u03b4\u03b1\u03c2 \u03b3\u03b9\u03b1 \u03ba\u03b9\u03bd\u03b7\u03c4\u03ac \u03ba\u03b1\u03b9 \u03b1\u03c1\u03c7\u03b5\u03af\u03b1.","\u0386\u03b4\u03b5\u03b9\u03b5\u03c2 \u03bb\u03bf\u03b3\u03b9\u03c3\u03bc\u03b9\u03ba\u03bf\u03cd - \u03b7 \u03b5\u03c6\u03b1\u03c1\u03bc\u03bf\u03b3\u03ae \u03c7\u03c1\u03b7\u03c3\u03b9\u03bc\u0
