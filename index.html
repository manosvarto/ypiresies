<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Δεν είναι διαθέσιμο</title>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;background:#11130c;color:#e9e7da;
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .box{max-width:420px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#a5a78f;margin:0}
</style>
</head>
<body>
  <div class="box">
    <h1>Δεν είναι διαθέσιμο</h1>
    <p>Αυτή η σελίδα δεν είναι πλέον ανοιχτή.</p>
  </div>
  <script>
    // καθάρισε ό,τι είχε αποθηκεύσει η παλιά εφαρμογή σε όποιον την είχε επισκεφθεί (service worker + cache)
    try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())); } catch(e){}
    try { if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))); } catch(e){}
  </script>
</body>
</html>
