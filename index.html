<style>
/* Layout: phone-first app shell - sticky title bar, one column of panels, bottom tab bar (top tabs on wide screens).
   Army colours: olive bar, khaki/sand page, gold in the dark theme; rust-orange for what needs attention. */
:root {
  --bg: #ECEADF; --surface: #FCFBF6; --surface-2: #F3F1E7; --ink: #1E2318; --muted: #62685A; --line: #D7D3C2;
  --accent: #4B5320; --accent-ink: #FFFFFF; --accent-soft: #E3E5CF; --orange: #A3561C; --orange-soft: #F5E3D0;
  --good: #3D7533; --good-soft: #E2EED9; --bad: #B3261E; --bad-soft: #F8DEDA; --warn: #8A5F00; --warn-soft: #F7ECCB;
  --bar: #3A4220; --bar-ink: #FFFFFF; --bar-sub: #D8CB8C; --shadow: 0 1px 2px rgba(30, 35, 24, .07), 0 2px 8px rgba(30, 35, 24, .06);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11130C; --surface: #1A1D13; --surface-2: #22261A; --ink: #E9E7DA; --muted: #A5A78F; --line: #33382A;
  --accent: #C9A94A; --accent-ink: #14160E; --accent-soft: #37361E; --orange: #E3A365; --orange-soft: #45301A;
  --good: #8FC67F; --good-soft: #213320; --bad: #F08A80; --bad-soft: #4A201C; --warn: #E8C25E; --warn-soft: #3F3413;
  --bar: #252A16; --bar-ink: #FFFFFF; --bar-sub: #CBBE82; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11130C; --surface: #1A1D13; --surface-2: #22261A; --ink: #E9E7DA; --muted: #A5A78F; --line: #33382A;
  --accent: #C9A94A; --accent-ink: #14160E; --accent-soft: #37361E; --orange: #E3A365; --orange-soft: #45301A;
  --good: #8FC67F; --good-soft: #213320; --bad: #F08A80; --bad-soft: #4A201C; --warn: #E8C25E; --warn-soft: #3F3413;
  --bar: #252A16; --bar-ink: #FFFFFF; --bar-sub: #CBBE82; --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; -webkit-text-size-adjust: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* title bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { width: 40px; height: 40px; flex: none; border-radius: 9px; }
.top h1 { font-size: 19px; font-weight: 700; }
.top p { margin: 0; font-size: 12px; color: var(--bar-sub); }
.top .grow { flex: 1; min-width: 0; }
.icon-btn { background: transparent; border: 1px solid rgba(255,255,255,.35); color: var(--bar-ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.icon-btn:focus-visible { outline: 2px solid var(--bar-sub); outline-offset: 2px; }
.tabs-top { display: none; gap: 4px; }
.tabs-top a { color: var(--bar-sub); text-decoration: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.tabs-top a[aria-current="page"] { background: rgba(255,255,255,.14); color: var(--bar-ink); }

/* bottom tab bar (phones) */
.tabs-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-bottom a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 2px; border-radius: 10px; }
.tabs-bottom a svg { width: 22px; height: 22px; }
.tabs-bottom a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main { padding-block: 16px 8px; display: grid; gap: 14px; }
/* the author's line: very top (in the title bar) and very bottom of the app - never in the Excel files */
.author { text-align: center; font: 700 11px/1.3 var(--font); letter-spacing: .06em; color: var(--bar-sub); padding: 4px 16px 0; }
.author-bottom { color: var(--muted); padding: 10px 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) {
  .tabs-top { display: flex; } .tabs-bottom { display: none; } main { padding-block: 20px 8px; } .author-bottom { padding-bottom: 24px; }
}

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 17px; font-weight: 700; color: var(--accent); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.grid2 { display: grid; gap: 14px; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; padding: 14px; font-size: 17px; border-radius: 12px; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 15px; }
.check { display: flex; gap: 10px; align-items: center; padding: 8px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border: 0; white-space: nowrap; }
.chip.warn { background: var(--orange-soft); color: var(--orange); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
button.chip { cursor: pointer; }
.rank-splits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rank-split { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.rank-split b { font-size: 14px; }
button.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; padding: 1px 6px; background: var(--orange-soft); color: var(--orange); white-space: nowrap; }
.badge.rank { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); letter-spacing: .02em; }

.banner { border-radius: var(--r); padding: 12px 14px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.notice { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border-left: 4px solid var(--warn); font-size: 14px; }
.notice.err { border-left-color: var(--bad); }
.notice.info { border-left-color: var(--accent); color: var(--muted); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat span { font-size: 12px; color: var(--muted); }
.stat.good b { color: var(--good); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }

/* day roster */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.days button { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 10px; cursor: pointer; text-align: center; }
.days button b { display: block; font-size: 15px; }
.days button span { font-size: 11.5px; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.days button[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.sheet { display: grid; gap: 14px; }
@media (min-width: 860px) { .sheet.two { grid-template-columns: 1fr 1fr; align-items: start; } }
.sec { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sec h3 { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); padding: 7px 12px; border-bottom: 1px solid var(--line); }
.duty { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
.sec h3 + .duty, .sec .duty:first-child { border-top: 0; }
.duty .what b { display: block; font-size: 14px; }
.duty .what .mono { font-size: 12px; color: var(--muted); white-space: pre-line; }
.who { display: grid; gap: 4px; align-content: start; }
.who div { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.who .empty { color: var(--bad); font-weight: 600; }
.who .linked { color: var(--muted); font-weight: 500; font-size: 13px; }
.who .flag { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
mark { background: var(--warn-soft); color: inherit; border-radius: 4px; padding: 0 2px; }

/* lists */
.list { display: grid; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.item .off { opacity: .5; }
.group-title { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 12px 4px 4px; }
.mini { display: flex; gap: 4px; }
.mini button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.mini button.onoff { font-weight: 700; color: var(--accent); }
.mini button.onoff.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; position: sticky; top: 0; }
td.num, th.num { text-align: center; font-variant-numeric: tabular-nums; }
td.zero { color: var(--line); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* editor sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(12, 14, 8, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheetbox { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
@media (min-width: 760px) { .overlay { align-items: center; } .sheetbox { border-radius: 16px; } }
.sheetbox header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheetbox h2 { font-size: 18px; color: var(--accent); }
.preview { font-size: 13.5px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
.preview.bad { background: var(--bad-soft); color: var(--bad); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(520px, calc(100vw - 32px)); overflow-wrap: anywhere; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
@media (min-width: 760px) { .toast { bottom: 24px; } }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -3px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
details summary { cursor: pointer; font-weight: 600; }
.hint { font-size: 12.5px; color: var(--muted); }
.help ol, .help ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.help p { margin: 0; }
.help li::marker { color: var(--accent); font-weight: 700; }
</style>

<script>/*

(function (root) {
  "use strict";

  // ------------------------------------------------------------------ text helpers
  function norm(v) {
    if (v === null || v === undefined) return "";
    return String(v).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
      .replace(/[–—−]/g, "-").replace(/\s+/g, " ").trim();
  }
  function splitList(v) {
    if (v === null || v === undefined) return [];
    if (v instanceof Date) return [v];
    return String(v).split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
  }
  function parseBool(v, dflt) {
    if (v === null || v === undefined || String(v).trim() === "") return dflt;
    if (v === true) return true;
    if (v === false) return false;
    return !["0", "ΟΧΙ", "Ο", "NO", "N", "FALSE", "ΨΕΥΔΕΣ", "ΑΝΕΝΕΡΓΗ"].includes(norm(v));
  }
  const pad2 = n => String(n).padStart(2, "0");
  const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m / 60)) + ":" + pad2(m % 60); };

  // ------------------------------------------------------------------ dates (ISO strings, no time zones)
  function isoToUTC(iso) { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); }
  function utcToIso(t) { const d = new Date(t); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate()); }
  function addDays(iso, n) { return utcToIso(isoToUTC(iso) + n * 86400000); }
  function diffDays(a, b) { return Math.round((isoToUTC(a) - isoToUTC(b)) / 86400000); }
  function weekday(iso) { return (new Date(isoToUTC(iso)).getUTCDay() + 6) % 7; } // Mon=0
  function mondayOf(iso) { return addDays(iso, -weekday(iso)); }
  function fmtDate(iso, withYear = true) { const [y, m, d] = iso.split("-"); return withYear ? `${d}/${m}/${y}` : `${d}/${m}`; }
  function dateToIso(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function excelDateToIso(v) {
    if (v instanceof Date) return utcToIso(Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate()));
    const s = String(v || "").trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);

    return null;

  const TIME_RE = /(\d{1,2})[:.](\d{2})\s*-\s*(\d{1,2})[:.](\d{2})/g;
  function parseTimes(text, dayStart = CONFIG.dayStart) {

    if (!found.length) {
      if (/^24\s*(ΩΡ|H|HOUR)/.test(raw)) return { intervals: [[dayStart, dayStart + 1440]], labels: ["24ΩΡΗ"] };

  function parseRanges(v, startIso) {
    const one = t => {
      if (t instanceof Date) return excelDateToIso(t);
      t = norm(t);
      let iso = excelDateToIso(t);
      const m = t.match(/^(\d{1,2})[\/.](\d{1,2})$/);
      if (!iso && m && startIso) {

        iso = [y - 1, y, y + 1].map(yy => `${yy}-${pad2(m[2])}-${pad2(m[1])}`)

      if (parts.length === 1 && (tok.match(/-/g) || []).length === 1) parts = tok.split("-").map(x => x.trim());

      if (!ds.length || ds.some(d => !d)) continue;
      let [a, b] = [ds[0], ds[ds.length - 1]];

        weekend3: !weekly && !linkKind && (r.weekend3 === undefined ? isOutpost(service, section) : !!r.weekend3),
        fixed: splitNames(r.fixed), pool: new Set(splitNames(r.pool).map(norm)) };
      p.task = taskName(p);
      if (seen.has(norm(p.task))) { p.post = `${p.post} (${posts.length + 1})`.trim(); p.task = taskName(p); }
      seen.add(norm(p.task));
      p.hours = intervals.reduce((a, [s, e]) => a + e - s, 0) / 60;
      p.shiftText = labels.length ? labels.join(" / ") : (linkKind ? "" : "—");
      p.linkText = linkKind === "same" ? `ίδιος με ${linkTarget}` : linkKind === "from" ? `από ${linkTarget}` : "";
      posts.push(p);
    });
    if (!posts.some(p => !p.linkKind)) throw new Error("Δεν υπάρχει καμία ενεργή υπηρεσία.");
    const regular = posts.filter(p => !p.linkKind);
    for (const p of posts.filter(p => p.linkKind)) {
      const t = p.linkTarget;
      if (p.linkKind === "same") {
        const hit = regular.find(q => [norm(q.task), norm(q.post)].includes(t)) || regular.find(q => norm(q.service) === t)
          || regular.find(q => norm(q.task).includes(t));
        p.linkPosts = hit ? [hit.idx] : [];
      } else {
        let hits = regular.filter(q => [norm(q.service), norm(q.section), norm(q.task)].includes(t)).map(q => q.idx);
        if (!hits.length) hits = regular.filter(q => norm(q.task).includes(t)).map(q => q.idx);
        p.linkPosts = hits;
      }
      if (!p.linkPosts.length) warn(`«${p.task}»: δεν βρέθηκε η υπηρεσία «${t}» - θα μείνει κενό.`);
    }
    return posts;
  }

  // ------------------------------------------------------------------ people
  /* person: {name, rank} ; rule: {unarmed, no24h, shifts, tasks, days, note} */
  function buildWorkers(people, rules, posts, startIso, warn = () => {}) {
    const workers = [];
    const seen = new Set();
    for (const p of people) {
      const name = String(p.name || "").trim();
      if (!name || seen.has(norm(name))) continue;
      seen.add(norm(name));
      const r = rules[name] || {};
      const w = { idx: workers.length, name, rank: String(p.rank || "").trim() || CONFIG.defaultRank,
        unarmed: !!r.unarmed, no24h: !!r.no24h, forbiddenWindows: parseForbiddenShifts(r.shifts),
        forbiddenTasksRaw: splitList(r.tasks), forbiddenPosts: new Set(), note: r.note || "", exemptParts: [] };
      const un = parseUnavailable(r.days, startIso);
      w.unavailableWeekdays = un.weekdays; w.unavailableDates = un.dates;
      // άδεια: no duty, afterwards he catches up (ΣΤΡ) · απόσπαση: no duty, counts as duties done
      w.leave = parseRanges(r.leave, startIso); w.detached = parseRanges(r.detached, startIso);
      for (const [a, b] of w.leave.concat(w.detached)) for (let d = a; d <= b; d = addDays(d, 1)) w.unavailableDates.add(d);
      if (w.unarmed) w.exemptParts.push("ΑΟΠΛΟΣ");
      if (w.no24h) w.exemptParts.push("όχι 24ωρες");
      if (r.shifts) w.exemptParts.push(`όχι ώρες: ${r.shifts}`);
      if (r.tasks) w.exemptParts.push(`όχι: ${r.tasks}`);
      if (r.days) w.exemptParts.push(`λείπει: ${r.days}`);
      if (r.leave) w.exemptParts.push(`άδεια: ${r.leave}`);
      if (r.detached) w.exemptParts.push(`απόσπαση: ${r.detached}`);
      for (const tok of w.forbiddenTasksRaw) {
        const t = norm(tok);
        let hits = posts.filter(p => [norm(p.service), norm(p.task), norm(p.post)].includes(t));
        if (!hits.length) hits = posts.filter(p => t && norm(p.task).includes(t));
        hits.forEach(p => w.forbiddenPosts.add(p.idx));
      }
      workers.push(w);
    }
    if (!workers.length) throw new Error("Δεν υπάρχει κανένα όνομα.");
    return workers;
  }
  /* names written in one cell: separated by comma, semicolon or new line */
  function splitNames(v) { return String(v || "").split(/[,;\n]/).map(t => t.trim()).filter(Boolean); }
  function postAllowed(w, p) {
    if (p.linkKind) return false;
    if (p.pool && p.pool.size) { if (!p.pool.has(norm(w.name))) return false; }  // «μόνο από»: whatever their rank
    else if (p.rank && !rankSet(p.rank).has(rankKey(w.rank))) return false;
    if (w.forbiddenPosts.has(p.idx)) return false;
    if (w.unarmed && p.armed) return false;
    if (w.no24h && (p.weekly || p.hours >= 24)) return false;
    for (const [fs, fe] of w.forbiddenWindows)
      for (let k = -1; k < 3; k++) {
        const a = fs + 1440 * k, b = fe + 1440 * k;
        if (p.intervals.some(([s, e]) => s < b && a < e)) return false;
      }
    return true;
  }

  // ------------------------------------------------------------------ random
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shortageText(rank, seats, people, lo, hi, days, b2b = true) {
    const each = lo === hi ? `${lo}` : `${lo} έως ${hi}`;
    const period = days === 1 ? "τη μέρα" : `σε ${days} μέρες`;
    if (seats / Math.max(1, days) > people)  // more seats in a day than people: some stay empty
      return `${rank}: ${seats} υπηρεσίες ${period} για ${people} άτομα. Δεν φτάνουν τα άτομα: κανείς δεν παίρνει ` +
        `2 υπηρεσίες την ίδια μέρα, οπότε κάποιες θέσεις μένουν κενές («ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ»).`;
    if (b2b && days > 1 && seats / days > people / 2)  // more than every other day
      return `${rank}: ${seats} υπηρεσίες ${period} για ${people} άτομα. Οι υπηρεσίες είναι περισσότερες από ` +
        `τα άτομα: μέρα παρά μέρα δεν φτάνουν, γι' αυτό κάποιοι μπαίνουν 2 συνεχόμενες μέρες - με τη ` +
        `σειρά, πρώτα όσοι δεν έχουν ξαναμπεί, για να είναι δίκαιο για όλους.`;
    return `${rank}: ${seats} υπηρεσίες ${period} για ${people} άτομα. Οι υπηρεσίες είναι περισσότερες από τα ` +
      `άτομα, γι' αυτό ξαναμπαίνουν όλοι (ο καθένας κάνει ${each}) και κάποιοι πιάνουν ξανά την ίδια ` +
      `υπηρεσία. Μπαίνουν με τη σειρά, ώστε να περνούν όλοι από όλες τις υπηρεσίες.`;
  }

  // ------------------------------------------------------------------ scheduler
  class Scheduler {
    constructor(workers, posts, startIso, days, st = {}) {
      this.workers = workers; this.posts = posts; this.days = days;
      this.dates = Array.from({ length: days }, (_, d) => addDays(startIso, d));
      this.regular = posts.filter(p => !p.linkKind); this.linked = posts.filter(p => p.linkKind);
      this.startCycles = Object.assign({}, st.cycles || {});
      this.startServed = new Set(st.served || []);
      this.startEarly = new Set([...(st.early || [])].filter(w => this.startServed.has(w)));
      this.priorBusy = st.priorBusy || workers.map(() => []);
      this.priorWeek = st.priorWeek || workers.map(() => [new Map(), new Map()]);
      this.priorTotal = st.priorTotal || workers.map(() => new Map());  // every earlier duty per service
      this.priorYesterday = st.priorYesterday || new Map();  // worker -> [tasks] of the day before the start
      this.noB2B = CONFIG.noBackToBack !== false;
      this.group = workers.map(w => rankKey(w.rank) || rankKey(CONFIG.defaultRank));
      this.members = new Map();
      workers.forEach(w => { const g = this.group[w.idx]; if (!this.members.has(g)) this.members.set(g, new Set()); this.members.get(g).add(w.idx); });
      this.postOk = workers.map(w => posts.map(p => postAllowed(w, p)));
      // «σταθερό άτομο»: that person does only this duty, every day, outside the rotation
      const byName = new Map(workers.map(w => [norm(w.name), w.idx]));
      this.fixedOf = new Map(); this.fixedMissing = [];
      for (const p of this.regular) if (p.fixed && p.fixed.length) {
        this.fixedOf.set(p.idx, p.fixed.slice(0, p.needed).map(n => {
          const w = byName.get(norm(n));
          if (w === undefined) { this.fixedMissing.push(`Σταθερό άτομο «${n}» στο «${p.task}»: δεν υπάρχει στη λίστα ονομάτων.`); return null; }
          return w;
        }));
      }
      this.fixedWorkers = new Set([...this.fixedOf.values()].flat().filter(w => w !== null));
      for (const w of this.fixedWorkers) {
        const mine = new Set([...this.fixedOf].filter(([, ids]) => ids.includes(w)).map(([pi]) => pi));
        this.postOk[w] = posts.map(p => mine.has(p.idx));
      }
      this.dayOk = workers.map(w => this.dates.map(d => !(w.unavailableWeekdays.has(weekday(d)) || w.unavailableDates.has(d))));
      this.postGroups = new Map(this.regular.map(p => [p.idx, new Set(workers.filter(w => this.postOk[w.idx][p.idx]).map(w => this.group[w.idx]))]));
      const daily = this.regular.filter(p => !p.weekly);
      this.eligServices = workers.map(w => new Set(daily.filter(p => this.postOk[w.idx][p.idx]).map(p => p.service)));
      this.eligTasks = workers.map(w => new Set(daily.filter(p => this.postOk[w.idx][p.idx]).map(p => p.task)));
      this.noOne = new Set(this.regular.filter(p => !workers.some(w => this.postOk[w.idx][p.idx])).map(p => p.idx));
      const byTask = new Map(this.regular.filter(p => p.weekly).map(p => [norm(p.task), p.idx]));
      this.priorWeekly = new Map();
      for (const [key, ws] of Object.entries(st.priorWeekly || {})) {
        const [mon, t] = key.split("|");
        if (byTask.has(t)) this.priorWeekly.set(mon + "|" + byTask.get(t), ws.slice());
      }
      // απόσπαση counts as duties done (CONFIG.detachedPerWeek per week, pro rata) up to each day of the roster;
      // άδεια: the ranks in CONFIG.catchupRanks catch up afterwards (see run)
      const perDayCredit = (+CONFIG.detachedPerWeek || 0) / 7;
      const credit = (w, date) => perDayCredit * w.detached.reduce((a, [f, t]) => a + (date >= f ? diffDays(date < t ? date : t, f) + 1 : 0), 0);
      this.creditDay = workers.map(w => this.dates.map(d => credit(w, d)));
      this.leaveStarted = workers.map(w => this.dates.map(d => w.leave.some(([f]) => f <= d)));
      this.catchupGroups = new Set((CONFIG.catchupRanks || []).map(rankKey));
      this.avgHours = new Map();
      for (const g of this.members.keys()) {
        const hs = this.regular.filter(p => !p.weekly && this.postGroups.get(p.idx).has(g)).map(p => p.hours);
        this.avgHours.set(g, hs.length ? hs.reduce((a, b) => a + b, 0) / hs.length : 0);
      }
      this.fairGroups = [...this.members.values()].map(ms => [...ms].filter(w => this.dayOk[w].every(Boolean)
        && !workers[w].forbiddenPosts.size && !workers[w].forbiddenWindows.length && !this.fixedWorkers.has(w)));
    }

    coverageWarnings() {
      const out = this.fixedMissing.slice();
      // «μόνο από»: few people for many seats -> they come back often
      const bySvc = new Map();
      for (const p of this.regular) if (p.pool && p.pool.size && !this.fixedOf.has(p.idx)) {
        const e = bySvc.get(p.service) || { seats: 0, people: new Set() };
        e.seats += p.weekly ? 0 : p.needed;
        this.workers.forEach(w => { if (this.postOk[w.idx][p.idx]) e.people.add(w.idx); });
        bySvc.set(p.service, e);
      }
      for (const [svc, e] of bySvc) if (e.seats && e.people.size < 2 * e.seats)
        out.push(`«${svc}»: μόνο ${e.people.size} άτομα για ${e.seats} θέσεις την ημέρα - θα ξαναμπαίνουν συχνά.`);
      const idle = [...new Set(this.workers.filter(w => !this.regular.some(p => !p.rank || rankSet(p.rank).has(rankKey(w.rank))))
        .map(w => this.group[w.idx]))].sort((a, b) => rankSort(a) - rankSort(b));
      if (idle.length) out.push(`Για ${idle.join(", ")} δεν υπάρχει καμία υπηρεσία στη λίστα - δεν θα μπουν πουθενά.`);
      for (const w of this.workers)
        if (!this.regular.some(p => this.postOk[w.idx][p.idx]) && this.regular.some(p => !p.rank || rankSet(p.rank).has(rankKey(w.rank))))
          out.push(`Ο ${w.name} (${w.rank}) δεν μπορεί να κάνει καμία υπηρεσία με τις εξαιρέσεις που έχει.`);
      for (const p of this.regular) {
        const n = this.workers.filter(w => this.postOk[w.idx][p.idx]).length;
        if (n === 0) out.push(`Δεν υπάρχει κανένας με βαθμό ${p.rank || "?"} - η «${p.task}» μένει κενή.`);
        else if (n < p.needed) out.push(`Μόνο ${n} άτομα μπορούν να κάνουν «${p.task}» (χρειάζονται ${p.needed}).`);
      }
      return out;
    }

    run(seed) {
      const R = rng(seed);
      const nW = this.workers.length, days = this.days;
      const busy = this.priorBusy.map(b => b.slice());
      const count = new Array(nW).fill(0), hours = new Array(nW).fill(0);
      const perDay = this.workers.map(() => new Array(days).fill(0));
      let svcWeek = this.priorWeek.map(pw => new Map(pw[0]));
      let postWeek = this.priorWeek.map(pw => new Map(pw[1]));
      const svcTotal = this.priorTotal.map(t => new Map(t));
      const strRank = rankKey(CONFIG.defaultRank);
      const add = (m, k, v) => m.set(k, (m.get(k) || 0) + v);
      const assign = new Map(), notes = new Map(), cycleOf = new Map(), carried = new Set(), kept3 = new Set();
      // days with a daily duty (weekly duties and linked roles do not count) -> no duty two days in a row
      const onDuty = this.workers.map(() => new Set());
      const b2bCount = new Array(nW).fill(0);  // times on duty two days in a row (only when the people were not enough)
      for (const w of this.priorYesterday.keys()) if (w >= 0 && w < nW) onDuty[w].add(-1);
      const res = { seed, assign, notes, cycleOf, carried, weekend3: kept3, count, hours, unfilled: 0, severity: 0, earlyRepeats: 0, completions: [] };
      const cycles = new Map();
      const cyc = g => cycles.has(g) ? cycles.get(g) : (this.startCycles[g] || this.startCycles["*"] || 1);
      let served = new Set(this.startServed), early = new Set(this.startEarly);
      const canServe = this.workers.map(w => this.regular.some(p => this.postOk[w.idx][p.idx]) && !this.fixedWorkers.has(w.idx));
      const holders = new Map([...this.priorWeekly].map(([k, v]) => [k, v.slice()]));
      // duties done so far (history + this roster): after a leave, whoever is behind catches up
      const totalCount = this.priorTotal.map(t => [...t].reduce((a, [k, v]) => a + (String(k).startsWith("#") ? 0 : v), 0));
      const behind = new Array(nW).fill(0);
      const K = (d, p, s) => d + ":" + p + (s === undefined ? "" : ":" + s);
      const inc = (m, k) => m.set(k, (m.get(k) || 0) + 1);

      const evaluate = (w, p, d) => {
        if (!this.postOk[w][p.idx] || !this.dayOk[w][d]) return null;
        if ((assign.get(K(d, p.idx)) || []).includes(w) || perDay[w][d] >= CONFIG.maxHard) return null;
        // two days in a row only when nobody free is left (then whoever had it fewest times first)
        let b2b = this.noB2B && !p.weekly && (onDuty[w].has(d - 1) || onDuty[w].has(d + 1));
        if (p.weekend3 && weekday(this.dates[d]) === 4) {
          // Friday on a 3-day weekend duty: he stays Saturday and Sunday too, and is back on Monday
          for (const k of [1, 2]) if (d + k < days && !this.dayOk[w][d + k]) return null;
          if (this.noB2B && d + 3 < days && onDuty[w].has(d + 3)) b2b = true;
        }
        const base = d * 1440;
        let worst = null, worstLabel = "", nearest = null;
        for (const [a, b, label] of busy[w]) for (const [s0, e0] of p.intervals) {
          const s = s0 + base, e = e0 + base;
          if (s < b && a < e) return null;
          const gap = s >= b ? s - b : a - e;
          if (nearest === null || gap < nearest) nearest = gap;
          if (gap < CONFIG.minGap && (worst === null || gap < worst)) { worst = gap; worstLabel = label; }
        }
        const viol = [];
        // whoever is behind after a leave does not climb in weight, so he can catch up
        if (b2b) viol.push(["b2b", `${b2bCount[w] + 1}η φορά`, behind[w] > 0 ? 1 : b2bCount[w] + 1]);
        if (worst !== null) viol.push(["gap", `${worst} λεπτά από ${worstLabel}`]);
        if (perDay[w][d] >= CONFIG.maxSoft) viol.push(["day_limit", `${perDay[w][d] + 1}η υπηρεσία της ημέρας`]);
        if (postWeek[w].get(p.task)) {
          if ([...this.eligTasks[w]].some(t => !postWeek[w].get(t))) viol.push(["same_post", `${postWeek[w].get(p.task) + 1}η φορά`, postWeek[w].get(p.task)]);
        } else if (CONFIG.variety === "service" && svcWeek[w].get(p.service)) {
          if ([...this.eligServices[w]].some(sv => !svcWeek[w].get(sv))) viol.push(["same_service", `${p.service}, ${svcWeek[w].get(p.service) + 1}η φορά`, svcWeek[w].get(p.service)]);
        }
        return [viol, nearest];
      };
      const occupy = (w, p, d) => {
        const label = `${fmtDate(this.dates[d], false)} ${p.task}`;
        for (const [s, e] of p.intervals) busy[w].push([s + d * 1440, e + d * 1440, label]);
      };
      const pick = (p, d, slot) => {
        for (const g of this.postGroups.get(p.idx)) {
          const ms = this.members.get(g);
          let waiting = false;
          for (const w of ms) if (!served.has(w) && this.dayOk[w][d] && canServe[w]) { waiting = true; break; }
          if (!waiting) {
            res.completions.push([this.dates[d], g, cyc(g)]);
            cycles.set(g, cyc(g) + 1);
            served = new Set([...served].filter(w => !ms.has(w)).concat([...early].filter(w => ms.has(w))));
            early = new Set([...early].filter(w => !ms.has(w)));
          }
        }
        let best = null, bestKey = null, bestViol = null;
        for (let w = 0; w < nW; w++) {
          const ev = evaluate(w, p, d);
          if (!ev) continue;
          const [viol, nearest] = ev;
          let major = 0, minor = 0;
          for (const v of viol) { const wt = vWeight(v); if (MAJOR.has(v[0])) major += wt; else minor += wt; }
          const repeat = !served.has(w) ? 0 : (early.has(w) ? 2 : 1);
          const tired = nearest !== null && nearest < CONFIG.restPreferred ? 1 : 0;
          // when a repeat is unavoidable: whoever did this duty fewest times this week
          const load = (svcWeek[w].get(p.service) || 0) + (postWeek[w].get(p.task) || 0);
          // unarmed duties go to unarmed people first, so armed people stay free for armed duties
          const arm = p.armed || this.workers[w].unarmed ? 0 : 1;
          // rest > rotation cycle > weekly variety > unarmed first > fewest times in this service overall > rest > random
          // ΣΤΡ: Saturday/Sunday duties go round too - whoever had the fewest weekends first
          const weekend = weekday(this.dates[d]) >= 5 && this.group[w] === strRank ? (svcTotal[w].get(WEEKEND_KEY) || 0) : 0;
          // equal hours: the one with the fewest hours so far (history + this roster) first, in 8-hour steps
          const hoursLoad = Math.floor(((svcTotal[w].get(HOURS_KEY) || 0) + this.creditDay[w][d] * this.avgHours.get(this.group[w])) / 8);
          // after a leave: whoever is behind the others goes first until he catches up (still every other day)
          const key = [major, -behind[w], repeat, minor, weekend, load, arm, hoursLoad, svcTotal[w].get(p.service) || 0, tired, R()];
          if (!bestKey || less(key, bestKey)) { best = w; bestKey = key; bestViol = viol; }
        }
        if (best === null) { res.unfilled++; res.severity += UNFILLED_PENALTY; return null; }
        const g = this.group[best];
        if (served.has(best)) { early.add(best); cycleOf.set(K(d, p.idx, slot), cyc(g) + 1); res.earlyRepeats++; }
        else { served.add(best); cycleOf.set(K(d, p.idx, slot), cyc(g)); }
        occupy(best, p, d);
        count[best]++; totalCount[best]++; hours[best] += p.hours; perDay[best][d]++;
        if (!p.weekly) { onDuty[best].add(d); }
        inc(svcWeek[best], p.service); inc(svcTotal[best], p.service); inc(postWeek[best], p.task);
        add(svcTotal[best], HOURS_KEY, p.hours);
        if (weekday(this.dates[d]) >= 5) inc(svcTotal[best], WEEKEND_KEY);
        if (bestViol.some(v => v[0] === "b2b")) b2bCount[best]++;
        if (bestViol.length) { notes.set(K(d, p.idx, slot), bestViol); res.severity += bestViol.reduce((a, v) => a + vWeight(v), 0); }
        return best;
      };

      /* person a: (pa, sa) -> (pb, sb), person b the other way, if no rule is relaxed for either */
      const swap = (d, pa, sa, pb, sb) => {
        const A = assign.get(K(d, pa.idx)), B = assign.get(K(d, pb.idx)), a = A[sa], b = B[sb];
        const la = `${fmtDate(this.dates[d], false)} ${pa.task}`, lb = `${fmtDate(this.dates[d], false)} ${pb.task}`;
        const saved = [busy[a].slice(), busy[b].slice()];
        busy[a] = busy[a].filter(x => x[2] !== la); busy[b] = busy[b].filter(x => x[2] !== lb);
        A[sa] = null; B[sb] = null;
        for (const [w, q] of [[a, pa], [b, pb]]) { add(svcWeek[w], q.service, -1); add(postWeek[w], q.task, -1); perDay[w][d]--; }
        const ea = evaluate(a, pb, d), eb = evaluate(b, pa, d);
        const ok = !!ea && !!eb && !ea[0].length && !eb[0].length;
        if (ok) {
          B[sb] = a; A[sa] = b;
          const ca = cycleOf.get(K(d, pa.idx, sa)), cb = cycleOf.get(K(d, pb.idx, sb));
          cycleOf.set(K(d, pa.idx, sa), cb); cycleOf.set(K(d, pb.idx, sb), ca);
          for (const [w, op, np] of [[a, pa, pb], [b, pb, pa]]) {
            occupy(w, np, d); hours[w] += np.hours - op.hours; add(svcTotal[w], HOURS_KEY, np.hours - op.hours);
            add(svcTotal[w], op.service, -1); add(svcTotal[w], np.service, 1);
          }
        } else { A[sa] = a; B[sb] = b; busy[a] = saved[0]; busy[b] = saved[1]; }
        for (const [w, q] of ok ? [[a, pb], [b, pa]] : [[a, pa], [b, pb]]) { add(svcWeek[w], q.service, 1); add(postWeek[w], q.task, 1); perDay[w][d]++; }
        return ok;
      };
      /* equal hours: the end of a rotation cycle forces whoever is left onto the long duties - swap a long and a
         short duty of the same day between two people of the same rank when the one with more hours has the long one */
      const balanceDay = (d, before) => {
        for (let it = 0; it < 200; it++) {
          const seats = [];
          for (const p of this.regular) {
            if (p.weekly || p.weekend3 || this.noOne.has(p.idx) || this.fixedOf.has(p.idx)) continue;
            (assign.get(K(d, p.idx)) || []).forEach((w, slot) => {
              if (w !== null && perDay[w][d] === 1 && !notes.has(K(d, p.idx, slot))) seats.push([p, slot, w]);
            });
          }
          const longFirst = seats.slice().sort((x, y) => y[0].hours - x[0].hours || before[y[2]] - before[x[2]]);
          const lowFirst = seats.slice().sort((x, y) => before[x[2]] - before[y[2]]);
          let done = false;
          for (const [pa, sa, a] of longFirst) {
            for (const [pb, sb, b] of lowFirst) {
              if (pa.idx === pb.idx || this.group[a] !== this.group[b] || pa.hours < pb.hours + 4 || before[a] < before[b] + 4) continue;
              if (this.postOk[a][pb.idx] && this.postOk[b][pa.idx] && swap(d, pa, sa, pb, sb)) { done = true; break; }
            }
            if (done) break;
          }
          if (!done) return;
        }
      };

      for (let d = 0; d < days; d++) {
        if (d > 0 && weekday(this.dates[d]) === 0) { svcWeek = this.workers.map(() => new Map()); postWeek = this.workers.map(() => new Map()); }
        const mon = mondayOf(this.dates[d]);
        const hoursBefore = svcTotal.map(t => t.get(HOURS_KEY) || 0);
        // behind after a leave: duties (with the απόσπαση credit) below the average of the rank
        for (const [g, ms] of this.members) {
          const pool = [...ms].filter(w => canServe[w]);
          if (!this.catchupGroups.has(g) || !pool.length) continue;
          const eff = new Map(pool.map(w => [w, totalCount[w] + this.creditDay[w][d]]));
          const avg = [...eff.values()].reduce((a, b) => a + b, 0) / pool.length;
          for (const w of pool) behind[w] = this.leaveStarted[w][d] ? Math.max(0, Math.floor(avg - eff.get(w) + 1e-9)) : 0;
        }
        // «σταθερό άτομο»: the same person every day; someone else only when that person is away
        for (const p of this.regular.filter(p => this.fixedOf.has(p.idx))) {
          const seats = []; assign.set(K(d, p.idx), seats);
          const ids = this.fixedOf.get(p.idx);
          for (let slot = 0; slot < p.needed; slot++) {
            const w = slot < ids.length ? ids[slot] : null;
            if (w !== null && this.dayOk[w][d]) {
              seats.push(w); occupy(w, p, d); count[w]++; totalCount[w]++; hours[w] += p.hours; perDay[w][d]++;
              onDuty[w].add(d);
              cycleOf.set(K(d, p.idx, slot), cyc(this.group[w]));
            } else seats.push(this.noOne.has(p.idx) ? null : pick(p, d, slot));
          }
        }
        for (const p of this.regular.filter(p => p.weekly && !this.fixedOf.has(p.idx))) {
          const seats = []; assign.set(K(d, p.idx), seats);
          if (this.noOne.has(p.idx)) { for (let i = 0; i < p.needed; i++) seats.push(null); continue; }
          const hk = mon + "|" + p.idx;
          if (!holders.has(hk)) holders.set(hk, []);
          const kept = holders.get(hk);
          for (let slot = 0; slot < p.needed; slot++) {
            const w = slot < kept.length ? kept[slot] : null;
            if (w !== null && w !== undefined && this.dayOk[w][d] && this.postOk[w][p.idx]) {
              seats.push(w); occupy(w, p, d); carried.add(K(d, p.idx, slot)); continue;
            }
            const nw = pick(p, d, slot);
            seats.push(nw);
            if (nw !== null && slot >= kept.length) kept.push(nw);
          }
        }
        // 3-day weekend duties (φυλάκια): Saturday and Sunday the same people as the day before
        const carriedToday = new Set();
        if (weekday(this.dates[d]) >= 5) {
          for (const p of this.regular.filter(p => p.weekend3 && !this.fixedOf.has(p.idx) && !this.noOne.has(p.idx))) {
            let before;
            if (d > 0) before = (assign.get(K(d - 1, p.idx)) || []).slice();
            else { const tn = norm(p.task); before = [...this.priorYesterday].filter(([, ts]) => ts.includes(tn)).map(([w]) => w).slice(0, p.needed); }
            const seats = []; assign.set(K(d, p.idx), seats);
            for (let slot = 0; slot < p.needed; slot++) {
              const w = slot < before.length ? before[slot] : null;
              if (w !== null && w !== undefined && this.dayOk[w][d] && this.postOk[w][p.idx] && perDay[w][d] < CONFIG.maxHard && !seats.includes(w)) {
                seats.push(w); occupy(w, p, d); count[w]++; totalCount[w]++; hours[w] += p.hours; perDay[w][d]++;
                onDuty[w].add(d);
                add(svcTotal[w], HOURS_KEY, p.hours); inc(svcTotal[w], WEEKEND_KEY);
                cycleOf.set(K(d, p.idx, slot), cycleOf.has(K(d - 1, p.idx, slot)) ? cycleOf.get(K(d - 1, p.idx, slot)) : cyc(this.group[w]));
                kept3.add(K(d, p.idx, slot));
              } else seats.push(pick(p, d, slot));
            }
            carriedToday.add(p.idx);
          }
        }
        const daily = this.regular.filter(p => !p.weekly && !this.fixedOf.has(p.idx) && !carriedToday.has(p.idx));
        daily.filter(p => this.noOne.has(p.idx)).forEach(p => assign.set(K(d, p.idx), new Array(p.needed).fill(null)));
        const clean = p => { let n = 0; for (let w = 0; w < nW; w++) { const ev = evaluate(w, p, d); if (ev && !ev[0].length) n++; } return n; };
        const order = daily.filter(p => !this.noOne.has(p.idx)).map(p => [clean(p) / p.needed, -p.hours, p.idx, p])
          .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]).map(x => x[3]);
        for (const p of order) {
          const seats = []; assign.set(K(d, p.idx), seats);
          for (let slot = 0; slot < p.needed; slot++) seats.push(pick(p, d, slot));
        }
        balanceDay(d, hoursBefore);
        const used = new Set();
        for (const p of this.linked) {
          if (p.linkKind === "same") {
            const src = p.linkPosts.length ? (assign.get(K(d, p.linkPosts[0])) || []) : [];
            assign.set(K(d, p.idx), Array.from({ length: p.needed }, (_, i) => i < src.length ? src[i] : null));
            continue;
          }
          let pool = [...new Set(p.linkPosts.flatMap(q => (assign.get(K(d, q)) || []).filter(w => w !== null)))];
          pool = pool.map(w => [used.has(w) ? 1 : 0, R(), w]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
          const chosen = pool.slice(0, p.needed);
          chosen.forEach(w => used.add(w));
          assign.set(K(d, p.idx), chosen.concat(new Array(p.needed - chosen.length).fill(null)));
        }
      }
      const strMembers = this.members.get(strRank) || new Set();
      res.weekend = svcTotal.map((t, w) => strMembers.has(w) ? (t.get(WEEKEND_KEY) || 0) : 0);
      res.hoursTotal = svcTotal.map(t => t.get(HOURS_KEY) || 0);
      res.finalCycles = {};
      for (const g of this.members.keys()) res.finalCycles[g] = cyc(g);
      res.finalServed = served; res.finalEarly = early;
      return res;
    }

    score(res) {
      let spread = 0, hs = 0, ws = 0;
      for (const pool of this.fairGroups) if (pool.length >= 2) {
        const c = pool.map(i => res.count[i]), h = pool.map(i => (res.hoursTotal || res.hours)[i]);
        const wk = pool.map(i => res.weekend ? res.weekend[i] : 0);
        spread = Math.max(spread, Math.max(...c) - Math.min(...c));
        hs = Math.max(hs, Math.max(...h) - Math.min(...h));
        ws = Math.max(ws, Math.max(...wk) - Math.min(...wk));
      }
      return [res.unfilled, res.severity, res.earlyRepeats, spread, ws, hs];
    }

    solve(attempts, baseSeed) {
      let best = null, bestScore = null;
      for (let i = 0; i < Math.max(1, attempts); i++) {
        const r = this.run(baseSeed + i), sc = this.score(r);
        if (!best || less(sc, bestScore)) { best = r; bestScore = sc; }
        if (bestScore[0] === 0 && bestScore[1] === 0 && bestScore[2] === 0 && bestScore[3] <= 1 && bestScore[4] <= 1 && i >= 4) break;
      }
      // More duties than people for a rank: repeating a duty within the week is unavoidable there,
      // so it is not reported as a relaxed rule (the ΣΤΡ summary «δεν φτάνουν τα άτομα» says it once).
      const short = this.shortGroups();
      for (const [key, viol] of [...best.notes]) {
        const [d, pi, slot] = key.split(":").map(Number);
        const w = (best.assign.get(d + ":" + pi) || [])[slot];
        if (w === null || w === undefined || !short.has(this.group[w])) continue;
        const kept = viol.filter(v => v[0] !== "same_service" && v[0] !== "same_post");
        if (kept.length) best.notes.set(key, kept); else best.notes.delete(key);
      }
      return best;
    }

    /* ranks with more duties than people in this period */
    shortGroups() {
      const out = new Set();
      for (const [g, ms] of this.members) {
        let seats = 0;
        for (const p of this.regular) {
          const gs = this.postGroups.get(p.idx);
          if (gs.has(g) && !this.noOne.has(p.idx)) seats += p.needed * (p.weekly ? 1 : this.days) / gs.size;
        }
        const people = [...ms].filter(w => this.regular.some(p => this.postOk[w][p.idx]) && !this.fixedWorkers.has(w));
        if (people.length && seats > people.length + 1e-9) out.add(g);
      }
      return out;
    }

    seats(res, d, p) { return res.assign.get(d + ":" + p.idx) || []; }

    /* ΣΤΡ only: more duties than people in this period -> everybody serves again, repeats are expected. */
    shortage(res) {
      const out = [];
      for (const [g, ms] of [...this.members].sort((a, b) => rankSort(a[0]) - rankSort(b[0]))) {
        if (g !== rankKey(CONFIG.defaultRank)) continue;  // only for ΣΤΡ
        let seats = 0;
        for (const p of this.regular) {
          const gs = this.postGroups.get(p.idx);
          if (gs.has(g) && !this.noOne.has(p.idx)) seats += p.needed * (p.weekly ? 1 : this.days) / gs.size;
        }
        const people = [...ms].filter(w => this.regular.some(p => this.postOk[w][p.idx]) && !this.fixedWorkers.has(w));
        // only when the people are not enough for ONE day (seats of a day > people), as in the daily roster;
        // more duties than people over the week is normal (they go round again) and is not reported
        if (!people.length || seats / this.days <= people.length + 1e-9) continue;
        const c = people.map(w => res.count[w]), lo = Math.min(...c), hi = Math.max(...c);
        out.push({ rank: g, seats: Math.round(seats), people: people.length, lo, hi,
          text: shortageText(g, Math.round(seats), people.length, lo, hi, this.days, this.noB2B) });
      }
      return out;
    }

    warnings(res) {
      const out = [];
      const short = this.shortGroups();
      for (const pi of this.noOne) {
        const p = this.posts[pi];
        out.push({ date: this.dates[0], task: p.task, worker: "—", rule: "ΚΑΝΕΝΑΣ ΜΕ ΑΥΤΟ ΤΟ ΒΑΘΜΟ",
          detail: `Δεν υπάρχει κανένας με βαθμό ${p.rank} στη λίστα - μένει κενή όλες τις μέρες.` });
      }
      this.dates.forEach((date, d) => {
        for (const p of this.regular) {
          if (this.noOne.has(p.idx)) continue;
          this.seats(res, d, p).forEach((w, slot) => {
            if (w === null) out.push({ date, task: p.task, worker: "—", rule: "ΔΕΝ ΦΤΑΝΟΥΝ ΤΑ ΑΤΟΜΑ",
              detail: "Κενή θέση: όσοι μπορούν να την κάνουν έχουν ήδη υπηρεσία εκείνη τη μέρα ή έχουν εξαίρεση/άδεια. Κανείς δεν μπαίνει σε 2 υπηρεσίες την ίδια μέρα." });
            for (const [code, det] of res.notes.get(`${d}:${p.idx}:${slot}`) || []) {
              let detail = det;
              if (short.has(this.group[w]) && code === "day_limit")
                detail = detail ? `${detail} · δεν φτάνουν τα άτομα` : "δεν φτάνουν τα άτομα";
              out.push({ date, task: p.task, worker: this.workers[w].name, rule: SOFT_RULES[code][1], detail });
            }
          });
        }
      });
      return out;
    }

    validate(res) {
      const errors = [], per = new Map(), dayCounts = new Map(), dutyDays = new Map(), keptDays = new Map();
      for (const [key, seats] of res.assign) {
        const [d, pi] = key.split(":").map(Number);
        const p = this.posts[pi];
        if (p.linkKind) continue;
        const real = seats.filter(w => w !== null);
        if (real.length !== new Set(real).size) errors.push(`Ίδιο άτομο δύο φορές στο ${p.task}`);
        seats.forEach((w, slot) => {
          if (w === null) return;
          const name = this.workers[w].name;
          if (!this.postOk[w][pi]) errors.push(`${name}: παραβίαση εξαίρεσης/βαθμού στο ${p.task}`);
          if (!this.dayOk[w][d]) errors.push(`${name}: σε ημέρα άδειας`);
          if (!per.has(w)) per.set(w, []);
          for (const [s, e] of p.intervals) per.get(w).push([s + d * 1440, e + d * 1440]);
          if (!res.carried.has(`${d}:${pi}:${slot}`)) { const k = w + ":" + d; dayCounts.set(k, (dayCounts.get(k) || 0) + 1); }
          if (!p.weekly) {
            if (!dutyDays.has(w)) { dutyDays.set(w, new Set()); keptDays.set(w, new Set()); }
            dutyDays.get(w).add(d);
            if (res.weekend3 && res.weekend3.has(`${d}:${pi}:${slot}`)) keptDays.get(w).add(d);
          }
        });
      }

      for (const [w, ivs] of per) {
        ivs.sort((a, b) => a[0] - b[0]);
        for (let i = 1; i < ivs.length; i++) if (ivs[i][0] < ivs[i - 1][1]) { errors.push(`${this.workers[w].name}: επικάλυψη ωρών`); break; }
      }
      for (const [k, c] of dayCounts) if (c > CONFIG.maxHard) errors.push(`${this.workers[+k.split(":")[0]].name}: πάνω από ${CONFIG.maxHard} υπηρεσίες σε μία ημέρα`);
      return errors;
    }

    cycleSummary(res) {
      const out = [];
      for (const [g, ms] of this.members) {
        if (![...this.postGroups.values()].some(gs => gs.has(g))) continue;
        out.push({ rank: g, cycle: res.finalCycles[g] || 1, done: [...ms].filter(w => res.finalServed.has(w)).length, total: ms.size });
      }
      return out.sort((a, b) => b.total - a.total || rankSort(a.rank) - rankSort(b.rank));
    }
  }
  function less(a, b) { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return true; if (a[i] > b[i]) return false; } return false; }

  // ------------------------------------------------------------------ history (same meaning as Άτομα.xlsx)
  function emptyHistory() { return { entries: [], cycles: { "*": 1 }, served: [], early: [], snapshots: {} }; }
  function historyCycle(h, rank) { const k = rankKey(rank); return h.cycles[k] || h.cycles["*"] || 1; }
  function lastDate(h) { return h.entries.reduce((m, e) => (!m || e.date > m ? e.date : m), null); }

  function prepareHistory(h, startIso) {
    const later = h.entries.filter(e => e.date >= startIso);
    if (later.length) {
      if (!h.snapshots[startIso]) {
        const last = lastDate(h);
        const starts = Object.keys(h.snapshots).filter(d => d <= last).sort().map(d => fmtDate(d)).join(", ") || "-";
        throw new Error(`Υπάρχουν ήδη υπηρεσίες έως ${fmtDate(last)}. Για να συνεχίσεις δώσε ημερομηνία ${fmtDate(addDays(last, 1))}. ` +
          `Για να ξαναβγάλεις πρόγραμμα που έχει ήδη γίνει, δώσε την ίδια ημερομηνία που ξεκίνησε (${starts}).`);
      }
      const snap = h.snapshots[startIso];
      h.cycles = Object.assign({}, snap.cycles); h.served = snap.served.slice(); h.early = snap.early.slice();
      h.entries = h.entries.filter(e => e.date < startIso);
      for (const d of Object.keys(h.snapshots)) if (d > startIso) delete h.snapshots[d];
      return later.length;
    }
    h.snapshots[startIso] = { cycles: Object.assign({}, h.cycles), served: h.served.slice(), early: h.early.slice() };
    return 0;
  }

  function historyStateFor(h, workers, startIso) {
    const idx = new Map(workers.map(w => [norm(w.name), w.idx]));
    const served = h.served.map(n => idx.get(norm(n))).filter(x => x !== undefined);
    const early = h.early.map(n => idx.get(norm(n))).filter(x => x !== undefined);
    const priorBusy = workers.map(() => []), priorWeek = workers.map(() => [new Map(), new Map()]);
    const priorWeekly = {};
    const priorTotal = workers.map(() => new Map());
    const priorYesterday = new Map();  // worker -> daily duties of the day before the start
    const weeklyTasks = new Set(h.entries.filter(e => /ΕΒΔΟΜΑΔ/.test(norm(e.shift || ""))).map(e => norm(e.task)));
    const monday = mondayOf(startIso);
    for (const e of h.entries) {
      const off = diffDays(e.date, startIso), w = idx.get(norm(e.worker));
      if (w === undefined || off >= 0) continue;
      priorTotal[w].set(e.service, (priorTotal[w].get(e.service) || 0) + 1);
      priorTotal[w].set(HOURS_KEY, (priorTotal[w].get(HOURS_KEY) || 0) + (+e.hours || 0));
      if (weekday(e.date) >= 5) priorTotal[w].set(WEEKEND_KEY, (priorTotal[w].get(WEEKEND_KEY) || 0) + 1);
      if (e.date >= monday) {
        priorWeek[w][0].set(e.service, (priorWeek[w][0].get(e.service) || 0) + 1);
        priorWeek[w][1].set(e.task, (priorWeek[w][1].get(e.task) || 0) + 1);
        const k = monday + "|" + norm(e.task);
        (priorWeekly[k] = priorWeekly[k] || []).push(w);
      }
      if (off === -1 && !weeklyTasks.has(norm(e.task))) {
        if (!priorYesterday.has(w)) priorYesterday.set(w, []);
        priorYesterday.get(w).push(norm(e.task));
      }
      if (off < -2) continue;
      try {
        for (const [s, en] of parseTimes(e.shift).intervals) priorBusy[w].push([s + off * 1440, en + off * 1440, `${fmtDate(e.date, false)} ${e.task}`]);
      } catch (err) { /* weekly or unknown hours */ }
    }
    return { cycles: h.cycles, served, early, priorBusy, priorWeek, priorWeekly, priorTotal, priorYesterday };
  }

  function updateHistory(h, sch, res) {
    sch.dates.forEach((date, d) => {
      for (const p of sch.regular) {
        sch.seats(res, d, p).forEach((w, slot) => {
          if (w === null || res.carried.has(`${d}:${p.idx}:${slot}`)) return;
          const wk = sch.workers[w];
          h.entries.push({ date, service: p.service, task: p.task, shift: p.shiftText, worker: wk.name,
            rank: wk.rank || p.rank, hours: Math.round(p.hours * 100) / 100, cycle: res.cycleOf.get(`${d}:${p.idx}:${slot}`) || 1 });
        });
      }
    });
    Object.assign(h.cycles, res.finalCycles);
    h.served = [...res.finalServed].map(w => norm(sch.workers[w].name));
    h.early = [...res.finalEarly].map(w => norm(sch.workers[w].name));
  }

  // ------------------------------------------------------------------ one call: build the roster
  function generate({ people, rules, services, history, mode, startIso, attempts, seed, confirmReplace, notes }) {
    const warns = [];
    const days = mode === "day" ? 1 : 7;
    const posts = buildPosts(services, m => warns.push(m));
    const workers = buildWorkers(people, rules || {}, posts, startIso, m => warns.push(m));
    const h = history ? JSON.parse(JSON.stringify(history)) : emptyHistory();
    const endIso = addDays(startIso, days - 1);
    if (h.entries.some(e => e.date > endIso) && confirmReplace && !confirmReplace(lastDate(h)))
      throw new Error("Ακυρώθηκε.");
    const replaced = prepareHistory(h, startIso);
    const st = historyStateFor(h, workers, startIso);
    const sch = new Scheduler(workers, posts, startIso, days, st);
    warns.push(...sch.coverageWarnings());
    const baseSeed = seed !== undefined ? seed : Math.floor(Math.random() * 1e6);
    const res = sch.solve(attempts || CONFIG.attempts, baseSeed);
    const errors = sch.validate(res);
    updateHistory(h, sch, res);
    return { sch, res, history: h, warnings: sch.warnings(res), shortage: sch.shortage(res), notices: warns, errors, replaced,
      formNotes: Array.isArray(notes) ? notes : DEFAULT_NOTES,
      cycles: sch.cycleSummary(res), seed: baseSeed, startIso, endIso, days };
  }

  /* Plain object of a finished roster: what the screen and the Excel export show (kept between visits). */
  function makeView(result) {
    const { sch, res } = result;
    const posts = sch.posts.map(p => ({ idx: p.idx, task: p.task, service: p.service, section: p.section, post: p.post,
      labels: p.labels, weekly: p.weekly, linkKind: p.linkKind, linkText: p.linkText, col: p.col, rank: p.rank,
      needed: p.needed, hours: p.hours, shiftText: p.shiftText, armed: p.armed, weekend3: !!p.weekend3, noOne: sch.noOne.has(p.idx) }));
    const seats = sch.dates.map((_, d) => sch.posts.map(p => sch.seats(res, d, p).map((w, slot) => {
      const k = `${d}:${p.idx}:${slot}`;
      if (w === null || w === undefined) return null;
      const wk = sch.workers[w];
      return { name: wk.name, rank: wk.rank, unarmed: wk.unarmed, exempt: wk.exemptParts.join(" · "),
        viol: (res.notes.get(k) || []).map(([c, det]) => [SOFT_RULES[c][1], det]), carried: res.carried.has(k),
        kept3: !!(res.weekend3 && res.weekend3.has(k)),
        cycle: res.cycleOf.get(k) || null };
    })));
    const b2bLabel = SOFT_RULES.b2b[1];

  // ------------------------------------------------------------------ roster workbook (Υπηρεσίες_*.xlsx)
  // Hand-filled tables at the bottom of the paper form (cleaning per area) and the signatures - same as the PC
  const FORM_UNITS = ["1ος Μ/Κ ΛΠΖ", "2ος Μ/Κ ΛΠΖ", "3ος Μ/Κ ΛΠΖ", "ΑΥΤ"];
